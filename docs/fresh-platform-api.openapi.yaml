openapi: 3.1.0
info:
  title: Testagram Central Backend API
  version: 1.0.0
  description: >\n    Canonical public API for XClone and private service integration contracts. All API v1\n    requests carry X-Testagram-API-Version: 1 and X-Request-ID; the server echoes both headers.\n    Private responses are no-store. GET requests may be retried by clients on 429/502/503/504;\n    mutations are not automatically retried and must use Idempotency-Key where required.
servers:
  - url: https://api.testagram.site
security:
  - appwriteJWT: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': { description: Liveness }
  /readyz:
    get:
      security: []
      responses:
        '200': { description: Appwrite/feed/outbox are ready; response reports social_data_plane, moderation and post_write capability states }
        '503': { description: Required Neon connection, Appwrite collections/indexes, feed or Algorithm dependency is unavailable }
  /v1/me:
    get:
      summary: Read authenticated Appwrite user profile
      responses:
        '200': { description: Authenticated profile }
        '401': { description: Invalid or expired Appwrite JWT }
  /v1/me/profile:
    put:
      summary: Update authenticated user's profile
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '200': { description: Profile updated }
        '401': { description: Invalid or expired Appwrite JWT }
  /internal/v1/federation/outbox:
    get:
      operationId: listFederationOutbox
      summary: Read public, non-sensitive post events for the trusted Federation service
      security:
        - federationInternalBearer: []
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 99, default: 50 }
        - in: query
          name: after
          schema: { type: string, description: Base64url encoded Appwrite outbox document ID }
      responses:
        "200": { description: Bounded durable outbox page }
        "401": { description: Invalid internal service token }
        "503": { description: Outbox unavailable }
  /v1/capabilities:
    post:
      operationId: invokeBackendCapability
      summary: Invoke an authenticated capability implemented by the fresh Backend
      description: >
        Capability names are accepted only by this versioned Appwrite/Neon API.
        Unmigrated capabilities fail closed with CAPABILITY_NOT_IMPLEMENTED; this
        endpoint never proxies to Supabase or legacy database RPC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [capability, input]
              properties:
                capability: { type: string, minLength: 3, maxLength: 128, pattern: '^[a-z][a-z0-9_.-]+    post:
      operationId: createPost
      summary: Create an authenticated text post
      security:
        - appwriteJWT: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content, visibility]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
                visibility: { type: string, enum: [public, followers, private] }
                sensitive: { type: boolean, default: false }
      responses:
        "201":
          description: Post created
        "200":
          description: Idempotent replay of the original post
        "400":
          description: Invalid post or idempotency key
        "409":
          description: Idempotency key reused with a different payload
        "401":
          description: Invalid Appwrite session
  /v1/feed/home:
    get:
      summary: Read authenticated home feed
      description: Backend applies follow, block, account visibility and post visibility rules before optionally calling the private Algorithm ranker.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: before
          required: false
          schema: { type: string, maxLength: 256 }
      responses:
        '200': { description: Authorized home feed page with next_cursor, has_more and ranking_mode }
        '400': { description: Invalid pagination parameters }
        '401': { description: Invalid or expired Appwrite JWT }
        '503': { description: Feed dependencies unavailable; no unfiltered fallback is returned }
  /v1/media/uploads/reservations:
    post:
      summary: Reserve media quota and obtain upload capability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bytes, content_type]
              properties:
                bytes: { type: integer, minimum: 1 }
                content_type: { type: string, maxLength: 128 }
                sha256: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
                scope: { type: string, enum: [post_media, story_media, direct_message, profile_media, avatar], default: post_media }
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      responses:
        '201': { description: Reservation created }
        '401': { description: Invalid or expired Appwrite JWT }
  /v1/media/uploads/{reservationID}/complete:
    post:
      summary: Verify uploaded object and finalize reservation
      parameters:
        - in: path
          name: reservationID
          required: true
          schema: { type: string }
      responses:
        '200': { description: Upload finalized }
        '401': { description: Invalid or expired Appwrite JWT }
  /v1/media/{objectID}/restore:
    post:
      summary: Restore an owner-authorized archived media object
      parameters:
        - in: path
          name: objectID
          required: true
          schema: { type: string }
      responses:
        '200': { description: Archive restored and verified }
        '401': { description: Invalid or expired Appwrite JWT }
        '403': { description: Caller does not own the media object }
        '410': { description: Recovery deadline has passed }
        '503': { description: Archive provider unavailable or verification failed }
  /v1/media/{objectID}/download:
    get:
      summary: Obtain authorized short-lived media URL
      parameters:
        - in: path
          name: objectID
          required: true
          schema: { type: string }
      responses:
        '200': { description: Signed media delivery URL }
        '401': { description: Invalid or expired Appwrite JWT }
  /v1/me/legal:
    get:
      summary: Read authenticated legal-consent status
      responses:
        '200': {description: Current accepted policy version and consent timestamps}
        '401': {description: Invalid Appwrite JWT}
    put:
      summary: Record age confirmation and current legal consents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [birth_date, terms, privacy, content_policy, age_confirmed]
              properties:
                birth_date: {type: string, format: date}
                terms: {type: boolean, const: true}
                privacy: {type: boolean, const: true}
                content_policy: {type: boolean, const: true}
                age_confirmed: {type: boolean, const: true}
      responses:
        '200': {description: Consent recorded}
        '400': {description: Consent or age confirmation invalid}
        '401': {description: Invalid Appwrite JWT}
  /v1/me/federation:
    get:
      summary: Read current user's opt-in Federation preference
      responses:
        '200': {description: Federation preference}
        '401': {description: Invalid Appwrite JWT}
    put:
      summary: Update current user's Federation preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: {type: boolean}
      responses:
        '200': {description: Preference updated}
        '400': {description: Invalid preference}
        '401': {description: Invalid Appwrite JWT}
  /v1/moderation/check:
    post:
      summary: Analyze text content before publication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 5000}
      responses:
        '200': {description: Moderation decision}
        '400': {description: Invalid content}
        '401': {description: Invalid Appwrite JWT}
        '503': {description: Moderation dependency unavailable}
  /internal/v1/federation/readyz:
    get:
      security:
        - federationInternalBearer: []
      summary: Verify Backend dependencies required by Federation
      responses:
        '200': {description: Backend Federation dependency is ready}
        '401': {description: Invalid internal service token}
        '503': {description: Federation dependency unavailable}
  /internal/v1/federation/actors/{handle}:
    get:
      security:
        - federationInternalBearer: []
      summary: Resolve an eligible local ActivityPub actor by handle
      parameters:
        - in: path
          name: handle
          required: true
          schema: {type: string, minLength: 3, maxLength: 30}
      responses:
        '200': {description: Federation-enabled local actor}
        '401': {description: Invalid internal service token}
        '404': {description: Actor unavailable or Federation disabled}
  /internal/v1/federation/actors/by-id/{userID}:
    get:
      security:
        - federationInternalBearer: []
      summary: Resolve an eligible local ActivityPub actor by Appwrite user ID
      parameters:
        - in: path
          name: userID
          required: true
          schema: {type: string, minLength: 1, maxLength: 36}
      responses:
        '200': {description: Federation-enabled local actor}
        '401': {description: Invalid internal service token}
        '404': {description: Actor unavailable or Federation disabled}
components:
  securitySchemes:
    federationInternalBearer:
      type: http
      scheme: bearer
    appwriteJWT:
      type: http
      scheme: bearer
      bearerFormat: Appwrite JWT
 }
                input: { type: object }
      responses:
        '200': { description: Capability result }
        '400': { description: Invalid capability request }
        '401': { description: Invalid or expired Appwrite JWT }
        '403': { description: Account is not eligible to use Testagram }
        '501': { description: Capability has not yet been migrated to the fresh Backend }
