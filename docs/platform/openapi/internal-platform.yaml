openapi: 3.1.0
info:
  title: Testagram Internal Platform API
  version: 1.0.0
  description: >
    Contract for Testagram-owned platform primitives. Internal routes are service-to-service only.
    Do not call them directly from browsers or mobile clients. Auth, REST, storage, and realtime
    APIs remain release-specific upstream-compatible contracts.
servers:
  - url: http://platform:8095
    description: Private Docker network only
tags:
  - name: Health
  - name: Configuration
  - name: Events and audit
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200': {description: Process is alive}
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe; requires PostgreSQL
      security: []
      responses:
        '200': {description: Ready}
        '503': {description: Required dependency unavailable}
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      security: []
      responses:
        '200': {description: Prometheus text exposition format}
  /v1/config/set:
    post:
      tags: [Configuration]
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeatureFlagSet'}
      responses:
        '204': {description: Feature flag inserted or updated}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Database unavailable}
  /v1/config/{key}:
    get:
      tags: [Configuration]
      security: []
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      responses:
        '200':
          description: Public and enabled configuration value
          content:
            application/json:
              schema: {}
        '400': {description: Invalid key}
        '404': {description: Not found or not public}
        '503': {description: Database unavailable}
  /v1/events:
    post:
      tags: [Events and audit]
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventWrite'}
      responses:
        '204': {description: Event stored}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Database unavailable}
  /v1/audit:
    post:
      tags: [Events and audit]
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditWrite'}
      responses:
        '204': {description: Audit record stored}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Database unavailable}
components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Private service token; rotate out of band and never ship to clients.
  schemas:
    FeatureFlagSet:
      type: object
      additionalProperties: false
      required: [key, enabled, public, value]
      properties:
        key: {type: string, minLength: 1, maxLength: 160}
        enabled: {type: boolean}
        public: {type: boolean}
        value: {}
    EventWrite:
      type: object
      additionalProperties: false
      required: [event_name, properties]
      properties:
        event_name: {type: string, minLength: 1, maxLength: 160}
        user_id: {type: [string, 'null']}
        session_hash: {type: string}
        properties: {type: object}
    AuditWrite:
      type: object
      additionalProperties: false
      required: [action, resource_type, resource_id, metadata]
      properties:
        actor_id: {type: [string, 'null']}
        action: {type: string, minLength: 1, maxLength: 160}
        resource_type: {type: string, minLength: 1, maxLength: 160}
        resource_id: {type: string}
        metadata: {type: object}
