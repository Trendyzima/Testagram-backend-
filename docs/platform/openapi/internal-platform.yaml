openapi: 3.1.0
info:
  title: Testagram Internal Platform API
  version: 1.0.0
  description: >
    Contract for Testagram-owned platform primitives. Internal routes are service-to-service only.
    Do not call them directly from browsers or mobile clients. Auth, REST, storage, and realtime
    APIs remain release-specific upstream-compatible contracts.
servers:
  - url: http://platform:8095
    description: Private Docker network only
tags:
  - name: Health
  - name: Cache
  - name: Rate limiting
  - name: Queue
  - name: Configuration
  - name: Events and audit
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200': {description: Process is alive}
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe; requires database and Valkey
      security: []
      responses:
        '200': {description: Ready}
        '503': {description: Required dependency unavailable}
  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      security: []
      responses:
        '200': {description: Prometheus text exposition format}
  /v1/cache/get:
    get:
      tags: [Cache]
      security: [{InternalBearer: []}]
      parameters:
        - in: query
          name: key
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      responses:
        '200':
          description: Cache hit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CacheValue'}
        '400': {description: Invalid key}
        '401': {description: Unauthorized}
        '404': {description: Cache miss}
        '503': {description: Cache unavailable}
  /v1/cache/set:
    post:
      tags: [Cache]
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CacheSet'}
      responses:
        '204': {description: Stored with bounded TTL}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Cache unavailable}
  /v1/cache/delete:
    delete:
      tags: [Cache]
      security: [{InternalBearer: []}]
      parameters:
        - in: query
          name: key
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      responses:
        '204': {description: Deleted or already absent}
        '400': {description: Invalid key}
        '401': {description: Unauthorized}
        '503': {description: Cache unavailable}
  /v1/rate-limit/check:
    post:
      tags: [Rate limiting]
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RateLimitCheck'}
      responses:
        '200':
          description: Atomic fixed-window rate-limit result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RateLimitResult'}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Rate limiter unavailable}
  /v1/queue/enqueue:
    post:
      tags: [Queue]
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueueEnqueue'}
      responses:
        '200':
          description: Stream entry created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueueEnqueued'}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Queue unavailable}
  /v1/queue/claim:
    post:
      tags: [Queue]
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueueClaim'}
      responses:
        '200': {description: Claimed messages from a consumer group}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Queue unavailable}
  /v1/queue/ack:
    post:
      tags: [Queue]
      security: [{InternalBearer: []}]
      parameters:
        - {in: query, name: queue, required: true, schema: {type: string}}
        - {in: query, name: group, required: true, schema: {type: string}}
        - {in: query, name: id, required: true, schema: {type: string}}
      responses:
        '200': {description: Acknowledgement count}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Queue unavailable}
  /v1/queue/reclaim:
    post:
      tags: [Queue]
      security: [{InternalBearer: []}]
      parameters:
        - {in: query, name: queue, required: true, schema: {type: string}}
        - {in: query, name: group, required: true, schema: {type: string}}
        - {in: query, name: consumer, required: true, schema: {type: string}}
        - {in: query, name: min_idle_ms, schema: {type: integer, minimum: 1, maximum: 86400000}}
        - {in: query, name: count, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        '200': {description: Reclaimed idle messages}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Queue unavailable}
  /v1/config/set:
    post:
      tags: [Configuration]
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeatureFlagSet'}
      responses:
        '204': {description: Feature flag inserted or updated}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Database unavailable}
  /v1/config/{key}:
    get:
      tags: [Configuration]
      security: []
      parameters:
        - in: path
          name: key
          required: true
          schema: {type: string, minLength: 1, maxLength: 160}
      responses:
        '200':
          description: Public and enabled configuration value
          content:
            application/json:
              schema: {}
        '400': {description: Invalid key}
        '404': {description: Not found or not public}
        '503': {description: Database unavailable}
  /v1/events:
    post:
      tags: [Events and audit]
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EventWrite'}
      responses:
        '204': {description: Event stored}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Database unavailable}
  /v1/audit:
    post:
      tags: [Events and audit]
      security: [{InternalBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditWrite'}
      responses:
        '204': {description: Audit record stored}
        '400': {description: Invalid request}
        '401': {description: Unauthorized}
        '503': {description: Database unavailable}
components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Private service token; rotate out of band and never ship to clients.
  schemas:
    CacheValue:
      type: object
      required: [value]
      properties:
        value: {type: string}
    CacheSet:
      type: object
      additionalProperties: false
      required: [key, value, ttl_seconds]
      properties:
        key: {type: string, minLength: 1, maxLength: 160}
        value: {type: string}
        ttl_seconds: {type: integer, minimum: 1, maximum: 86400}
    RateLimitCheck:
      type: object
      additionalProperties: false
      required: [key, limit, window_seconds]
      properties:
        key: {type: string, minLength: 1, maxLength: 160}
        limit: {type: integer, minimum: 1, maximum: 100000}
        window_seconds: {type: integer, minimum: 1, maximum: 86400}
    RateLimitResult:
      type: object
      required: [allowed, count, remaining, retry_after_seconds]
      properties:
        allowed: {type: boolean}
        count: {type: integer}
        remaining: {type: integer}
        retry_after_seconds: {type: integer}
    QueueEnqueue:
      type: object
      additionalProperties: false
      required: [queue, payload]
      properties:
        queue: {type: string, minLength: 1, maxLength: 160}
        payload:
          type: object
          additionalProperties: {type: string}
    QueueEnqueued:
      type: object
      required: [id]
      properties:
        id: {type: string}
    QueueClaim:
      type: object
      additionalProperties: false
      required: [queue, group, consumer]
      properties:
        queue: {type: string, minLength: 1, maxLength: 160}
        group: {type: string, minLength: 1, maxLength: 160}
        consumer: {type: string, minLength: 1, maxLength: 160}
        count: {type: integer, minimum: 1, maximum: 100, default: 10}
    FeatureFlagSet:
      type: object
      additionalProperties: false
      required: [key, enabled, public, value]
      properties:
        key: {type: string, minLength: 1, maxLength: 160}
        enabled: {type: boolean}
        public: {type: boolean}
        value: {}
    EventWrite:
      type: object
      additionalProperties: false
      required: [event_name, properties]
      properties:
        event_name: {type: string, minLength: 1, maxLength: 160}
        user_id: {type: [string, 'null']}
        session_hash: {type: string}
        properties: {type: object}
    AuditWrite:
      type: object
      additionalProperties: false
      required: [action, resource_type, resource_id, metadata]
      properties:
        actor_id: {type: [string, 'null']}
        action: {type: string, minLength: 1, maxLength: 160}
        resource_type: {type: string, minLength: 1, maxLength: 160}
        resource_id: {type: string}
        metadata: {type: object}
