name: Cloudflare domain routing audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-domain-routing-audit.yml"
      - ".github/workflows/instabox-deploy.yml"
      - "deploy/self-hosted/Caddyfile"
      - "deploy/self-hosted/docker-compose.yml"

permissions: {}

concurrency:
  group: testagram-cloudflare-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Inventory Cloudflare zones, DNS, Workers and Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify token and collect read-only inventory
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN. Add the token value in GitHub Actions secrets; never put it in workflow code."
            exit 1
          fi

          API="https://api.cloudflare.com/client/v4"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cf_get() {
            local path="$1" output="$2" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 45 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" "$API$path")"
            if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
              echo "Cloudflare GET failed (HTTP $status): $path" >&2
              jq -r '(.errors // [])[]? | .message // "Cloudflare API error"' "$output" >&2 || true
              return 1
            fi
            jq -e '.success == true' "$output" >/dev/null
          }

          cf_get "/user/tokens/verify" "$tmp/token.json"
          token_status="$(jq -r '.result.status // "unknown"' "$tmp/token.json")"
          if [[ "$token_status" != "active" ]]; then
            echo "::error::Cloudflare token is not active (status: $token_status)."
            exit 1
          fi

          echo "## Cloudflare read-only audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Token verification: active" >> "$GITHUB_STEP_SUMMARY"
          echo "- Audit mode: GET requests only; no DNS, Worker, Pages, zone, or account mutations." >> "$GITHUB_STEP_SUMMARY"

          : > "$tmp/accounts.txt"
          page=1
          while :; do
            cf_get "/zones?per_page=50&page=$page" "$tmp/zones-$page.json"
            jq -r '.result[]? | [.id, .name, (.status // "unknown"), (.account.id // "")] | @tsv' "$tmp/zones-$page.json" >> "$tmp/zones.tsv"
            jq -r '.result[]?.account.id // empty' "$tmp/zones-$page.json" >> "$tmp/accounts.txt"
            pages="$(jq -r '.result_info.total_pages // 1' "$tmp/zones-$page.json")"
            [[ "$page" -ge "$pages" ]] && break
            page=$((page + 1))
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Zones" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s "$tmp/zones.tsv" ]]; then
            printf '| Zone | Status | DNS records |\n|---|---|---:|\n' >> "$GITHUB_STEP_SUMMARY"
            while IFS=$'\t' read -r zone_id zone_name zone_status account_id; do
              dns_count="unavailable"
              if cf_get "/zones/$zone_id/dns_records?per_page=100" "$tmp/dns.json"; then
                dns_count="$(jq -r '.result_info.total_count // (.result | length)' "$tmp/dns.json")"
                {
                  echo ""
                  echo "#### DNS inventory: $zone_name"
                  echo "| Record | Type | Target (DNS content) | Proxied | TTL |"
                  echo "|---|---|---|---|---:|"
                  jq -r '.result[]? | "| " + (.name|gsub("\\|";"\\\\|")) + " | " + .type + " | " + ((.content // "")|gsub("\\|";"\\\\|")) + " | " + ((.proxied // false)|tostring) + " | " + ((.ttl // 0)|tostring) + " |"' "$tmp/dns.json"
                } >> "$GITHUB_STEP_SUMMARY"
              fi
              if cf_get "/zones/$zone_id/workers/routes" "$tmp/routes.json"; then
                {
                  echo ""
                  echo "#### Worker routes: $zone_name"
                  echo "| Pattern | Script |"
                  echo "|---|---|"
                  jq -r '.result[]? | "| " + (.pattern // "") + " | " + (.script // "(service binding/none)") + " |"' "$tmp/routes.json"
                } >> "$GITHUB_STEP_SUMMARY"
              else
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "#### Worker routes: $zone_name" >> "$GITHUB_STEP_SUMMARY"
                echo "Unavailable with this token's current permissions." >> "$GITHUB_STEP_SUMMARY"
              fi
              printf '| %s | %s | %s |\n' "$zone_name" "$zone_status" "$dns_count" >> "$GITHUB_STEP_SUMMARY"
            done < "$tmp/zones.tsv"
          else
            echo "No zones were returned for this token." >> "$GITHUB_STEP_SUMMARY"
          fi

          sort -u "$tmp/accounts.txt" -o "$tmp/accounts.txt"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Account services" >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r account_id; do
            [[ -z "$account_id" ]] && continue
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "#### Account $account_id" >> "$GITHUB_STEP_SUMMARY"

            if cf_get "/accounts/$account_id/workers/scripts" "$tmp/workers.json"; then
              echo "- Workers scripts: $(jq -r '.result | length' "$tmp/workers.json")" >> "$GITHUB_STEP_SUMMARY"
              jq -r '.result[]? | "- Worker: " + (.id // .name // "unnamed")' "$tmp/workers.json" >> "$GITHUB_STEP_SUMMARY"
              while IFS= read -r worker; do
                [[ -z "$worker" ]] && continue
                schedules="unavailable"
                bindings="unavailable"
                deployments="unavailable"
                if cf_get "/accounts/$account_id/workers/scripts/$worker/schedules" "$tmp/worker-schedules.json"; then
                  schedules="$(jq -c '.result.schedules // [] | map(.cron)' "$tmp/worker-schedules.json")"
                fi
                if cf_get "/accounts/$account_id/workers/scripts/$worker/settings" "$tmp/worker-settings.json"; then
                  # Emit binding names/types only; never print secret or plain-text binding values.
                  bindings="$(jq -c '.result.bindings // [] | map({name, type, service, namespace})' "$tmp/worker-settings.json")"
                fi
                if cf_get "/accounts/$account_id/workers/scripts/$worker/deployments?per_page=1" "$tmp/worker-deployments.json"; then
                  deployments="$(jq -c '.result.deployments // [] | map({created_on, source})' "$tmp/worker-deployments.json")"
                fi
                workers_dev="$(jq -r --arg worker "$worker" '.result[]? | select(.id == $worker) | .workers_dev // "unknown"' "$tmp/workers.json" | head -n 1)"
                tail_consumers="unavailable"
                if cf_get "/accounts/$account_id/workers/scripts/$worker/script-settings" "$tmp/worker-script-settings.json"; then
                  tail_consumers="$(jq -c '.result.tail_consumers // [] | map({service, environment, namespace})' "$tmp/worker-script-settings.json")"
                fi
                source_scan="unavailable"
                if curl --silent --show-error --fail --connect-timeout 10 --max-time 45 \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  "$API/accounts/$account_id/workers/scripts/$worker/content/v2" -o "$tmp/worker-source"; then
                  has_supabase="no"; has_xclone="no"
                  grep -Eiq 'supabase|sb-project-ref' "$tmp/worker-source" && has_supabase="yes" || true
                  grep -Eiq 'xclone' "$tmp/worker-source" && has_xclone="yes" || true
                  origin_hosts="$(grep -Eo 'https?://[A-Za-z0-9._-]+' "$tmp/worker-source" | sed -E 's#^https?://##' | grep -E '(^|\.)instabox\.tech$|(^|\.)testagram\.site$' | sort -u | paste -sd, - || true)"
                  app_origin="$(jq -r '.result.bindings[]? | select(.name == "APP_ORIGIN" and .type == "plain_text") | .text // empty' "$tmp/worker-settings.json" | head -n 1)"
                  fetch_hosts="$(grep -Eo 'https?://[A-Za-z0-9._-]+' "$tmp/worker-source" | sed -E 's#^https?://##' | sort -u | paste -sd, - || true)"
                  workers_dev="$(jq -r '.result.workers_dev // "unknown"' "$tmp/worker-settings.json")"
                  source_scan="supabase_refs=$has_supabase,xclone_refs=$has_xclone,workers_dev=$workers_dev,app_origin=${app_origin:-unset},fetch_hosts=${fetch_hosts:-none}"
                fi
                printf '%s\n' "- Worker runtime inventory: $worker; workers_dev=$workers_dev; cron=$schedules; bindings=$bindings; tail_consumers=$tail_consumers; latest_deployments=$deployments; source_scan=$source_scan" >> "$GITHUB_STEP_SUMMARY"
              done < <(jq -r '.result[]?.id // empty' "$tmp/workers.json")
            else
              echo "- Workers scripts: unavailable with this token's current permissions" >> "$GITHUB_STEP_SUMMARY"
            fi

            if cf_get "/accounts/$account_id/pages/projects" "$tmp/pages.json"; then
              echo "- Pages projects: $(jq -r '.result | length' "$tmp/pages.json")" >> "$GITHUB_STEP_SUMMARY"
              jq -r '.result[]? | "- Pages project: " + (.name // "unnamed")' "$tmp/pages.json" >> "$GITHUB_STEP_SUMMARY"
              while IFS= read -r project; do
                [[ -z "$project" ]] && continue
                if cf_get "/accounts/$account_id/pages/projects/$project/domains" "$tmp/pages-domains.json"; then
                  {
                    echo ""
                    echo "##### Pages domains: $project"
                    echo "| Hostname | Status | Validation | Verification |"
                    echo "|---|---|---|---|"
                    jq -r '.result[]? | "| " + (.name // "") + " | " + (.status // "unknown") + " | " + (.validation_data.status // "unknown") + " | " + (.verification_data.status // "unknown") + " |"' "$tmp/pages-domains.json"
                  } >> "$GITHUB_STEP_SUMMARY"
                else
                  echo "- Pages domain inventory unavailable for $project with this token's current permissions" >> "$GITHUB_STEP_SUMMARY"
                fi
              done < <(jq -r '.result[]?.name // empty' "$tmp/pages.json")
            else
              echo "- Pages projects: unavailable with this token's current permissions" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$tmp/accounts.txt"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Audit completed. DNS targets and matching public origin hostnames are included for routing diagnosis; credentials and secret binding values are intentionally excluded." >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
