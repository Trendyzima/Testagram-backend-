name: Cloudflare Email Sending authorization diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostics/cloudflare-email-sending-readonly
    paths:
      - .github/workflows/cloudflare-email-sending-diagnostic.yml

permissions: {}

concurrency:
  group: testagram-cloudflare-email-sending-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Verify Cloudflare token, Email Sending access and sender-domain onboarding
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run sanitized read-only Cloudflare checks
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          set +x

          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Required Cloudflare GitHub secrets are missing."
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character hexadecimal account ID."
            exit 1
          fi

          API="https://api.cloudflare.com/client/v4"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT

          request() {
            local method="$1" path="$2" output="$3"
            curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              -X "$method" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" \
              "$API$path"
          }

          error_codes() {
            jq -c '[.errors[]?.code | select(type == "number")]' "$1" 2>/dev/null || echo '[]'
          }

          echo "## Cloudflare Email Sending diagnostic" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: read-only; no email sent and no Cloudflare configuration changed." >> "$GITHUB_STEP_SUMMARY"
          echo "- Credentials: existing GitHub secrets; values are never printed." >> "$GITHUB_STEP_SUMMARY"

          status="$(request GET "/user/tokens/verify" "$TMP/verify.json")"
          codes="$(error_codes "$TMP/verify.json")"
          token_state="$(jq -r '.result.status // "unknown"' "$TMP/verify.json" 2>/dev/null || echo unknown)"
          echo "- Token verification: HTTP $status; state=$token_state; error_codes=$codes" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" != "200" || "$token_state" != "active" ]]; then
            echo "::error::Cloudflare token verification failed; see sanitized workflow summary."
            exit 1
          fi

          # Account-level Email Sending read access is checked independently
          # from Zone:Read so a zone permission failure cannot hide this result.
          account_id="$CLOUDFLARE_ACCOUNT_ID"
          status="$(request GET "/accounts/$account_id/email/sending/suppressions?per_page=1" "$TMP/email-access.json")"
          codes="$(error_codes "$TMP/email-access.json")"
          email_access_success="$(jq -r '.success // false' "$TMP/email-access.json" 2>/dev/null || echo false)"
          echo "- Account Email Sending read-only probe: HTTP $status; API success=$email_access_success; error_codes=$codes" >> "$GITHUB_STEP_SUMMARY"

          status="$(request GET "/zones?name=testagram.site&per_page=1" "$TMP/zone.json")"
          codes="$(error_codes "$TMP/zone.json")"
          zone_id="$(jq -r --arg account "$account_id" '.result[]? | select(.name == "testagram.site" and .account.id == $account and .status == "active") | .id' "$TMP/zone.json" 2>/dev/null | head -n1 || true)"
          echo "- Active testagram.site zone lookup in configured account: HTTP $status; match=$([[ -n "$zone_id" ]] && echo yes || echo no); error_codes=$codes" >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$zone_id" ]]; then
            status="$(request GET "/zones/$zone_id/email/sending/subdomains" "$TMP/sending-domains.json")"
            codes="$(error_codes "$TMP/sending-domains.json")"
            success="$(jq -r '.success // false' "$TMP/sending-domains.json" 2>/dev/null || echo false)"
            echo "- Sending-domain inventory: HTTP $status; API success=$success; error_codes=$codes" >> "$GITHUB_STEP_SUMMARY"

            if [[ "$status" == "200" && "$success" == "true" ]]; then
              jq -r '.result[]? | "- Onboarded domain: " + (.name // "unknown") + "; sending_enabled=" + ((.enabled // false)|tostring)' "$TMP/sending-domains.json" >> "$GITHUB_STEP_SUMMARY"
              subdomain_tag="$(jq -r '.result[]? | select(.name == "testagram.site") | .tag' "$TMP/sending-domains.json" 2>/dev/null | head -n1 || true)"
              subdomain_enabled="$(jq -r '[.result[]? | select(.name == "testagram.site" and .enabled == true)] | length' "$TMP/sending-domains.json" 2>/dev/null || echo 0)"

              if [[ -z "$subdomain_tag" ]]; then
                echo "- Exact sender-domain onboarding: testagram.site NOT FOUND." >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::The exact testagram.site sender domain is not present; wildcard entries are not treated as apex-domain matches."
              elif [[ "$subdomain_enabled" != "1" ]]; then
                echo "- Exact sender-domain onboarding: present but sending DISABLED." >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::Email Sending is disabled for testagram.site."
              else
                echo "- Exact sender-domain onboarding: present and sending enabled." >> "$GITHUB_STEP_SUMMARY"
                dns_status="$(request GET "/zones/$zone_id/email/sending/subdomains/$subdomain_tag/dns" "$TMP/sending-dns.json")"
                dns_codes="$(error_codes "$TMP/sending-dns.json")"
                dns_success="$(jq -r '.success // false' "$TMP/sending-dns.json" 2>/dev/null || echo false)"

                if [[ "$dns_status" == "200" && "$dns_success" == "true" ]]; then
                  expected_dns="$(jq -r '.result[]? | [.name // "",.type // ""] | @tsv' "$TMP/sending-dns.json")"
                  expected_count="$(printf '%s\n' "$expected_dns" | awk 'NF==2 {n++} END {print n+0}')"
                  resolved_count=0
                  while IFS=$'\t' read -r record_name record_type; do
                    [[ -z "$record_name" || -z "$record_type" ]] && continue
                    if dig @1.1.1.1 +time=3 +tries=1 +short "$record_name" "$record_type" 2>/dev/null | grep -q .; then
                      resolved_count=$((resolved_count+1))
                    fi
                  done <<< "$expected_dns"
                  echo "- Sender DNS inventory: HTTP $dns_status; expected_records=$expected_count; records_resolving_via_1.1.1.1=$resolved_count; error_codes=$dns_codes" >> "$GITHUB_STEP_SUMMARY"
                  if [[ "$expected_count" -gt 0 && "$resolved_count" -eq "$expected_count" ]]; then
                    echo "- Sender DNS propagation: all expected record names returned answers." >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "- Sender DNS propagation: INCOMPLETE; inspect Cloudflare Email Sending DNS settings." >> "$GITHUB_STEP_SUMMARY"
                    echo "::warning::Not all expected sender DNS records resolved through the public resolver."
                  fi
                else
                  echo "- Sender DNS inventory: unavailable; HTTP $dns_status; error_codes=$dns_codes" >> "$GITHUB_STEP_SUMMARY"
                  echo "::warning::Could not retrieve expected sender DNS records."
                fi
              fi
            else
              echo "- Sender-domain onboarding: unavailable to this token or account." >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Sending-domain inventory could not be confirmed; review numeric Cloudflare error codes."
            fi
          else
            echo "- Sender-domain onboarding: not checked because the active zone could not be resolved in the configured account." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Zone lookup failed or account mismatch; account-level Email Sending probe was still performed."
          fi

          if [[ "$email_access_success" != "true" ]]; then
            echo "::warning::Review the account-level Email Sending read-only probe result."
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No POST request was made to /email/sending/send. Read-only access does not prove Email Sending Write; only an explicitly approved controlled send can conclusively verify send authorization." >> "$GITHUB_STEP_SUMMARY"
