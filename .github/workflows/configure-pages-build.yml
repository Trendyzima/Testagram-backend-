name: Configure Testagram Cloudflare Pages Flutter build

on:
  workflow_dispatch:
    inputs:
      confirm_pages_build_config_update:
        description: Confirm the apex redirect is live and Pages should build the Flutter web output.
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: testagram-pages-build-config
  cancel-in-progress: false

jobs:
  configure:
    if: github.ref == 'refs/heads/main' && inputs.confirm_pages_build_config_update == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Verify apex redirect and WebFinger ownership before changing Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          API="https://api.cloudflare.com/client/v4"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/zones?name=testagram.site" > "$tmp/zone.json"
          zone_id="$(jq -r '.result[0].id // empty' "$tmp/zone.json")"
          account_id="$(jq -r '.result[0].account.id // empty' "$tmp/zone.json")"
          [[ -n "$zone_id" && -n "$account_id" ]] || { echo "::error::Testagram zone/account lookup failed"; exit 1; }

          curl --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/zones/$zone_id/workers/routes" > "$tmp/routes.json"
          jq -e '.success == true and (.result | any(.pattern == "testagram.site/*" and .script == "testagram-apex-redirect")) and (.result | any(.pattern == "testagram.site/.well-known/webfinger*" and .script == "testagram-web"))' "$tmp/routes.json" >/dev/null || {
            echo "::error::The verified apex redirect route or dedicated WebFinger route is missing. Pages settings were not changed."
            jq -c '.result[]? | select(.pattern | startswith("testagram.site")) | {pattern,script}' "$tmp/routes.json"
            exit 1
          }

          apex_url="$API/accounts/$account_id/pages/projects/testagram-flutter-web/domains/testagram.site"
          apex_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o "$tmp/apex.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$apex_url")"
          [[ "$apex_status" == "404" ]] || {
            echo "::error::Apex is still attached to Pages or its state cannot be verified (HTTP $apex_status). Pages settings were not changed."
            jq -c '{success,errors,messages,result}' "$tmp/apex.json" || true
            exit 1
          }

          project_url="$API/accounts/$account_id/pages/projects/testagram-flutter-web"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o "$tmp/project.json" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$project_url")"
          [[ "$status" == "200" ]] || { echo "::error::Cannot read existing Pages project (HTTP $status)"; exit 1; }
          jq -e '.success == true and .result.name == "testagram-flutter-web" and .result.production_branch == "main" and .result.source.config.repo_name == "testagram-flutter-client-"' "$tmp/project.json" >/dev/null || {
            echo "::error::Pages project identity/source did not match the verified Testagram Flutter repository. No change made."
            jq -c '.result | {name,production_branch,source}' "$tmp/project.json"
            exit 1
          }

          payload='{"build_config":{"build_command":"bash cloudflare-pages/build.sh","destination_dir":"build/web","root_dir":"/","build_caching":true}}'
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 45 \
            -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" --data "$payload" \
            -o "$tmp/update.json" -w '%{http_code}' "$project_url")"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]] || ! jq -e '.success == true' "$tmp/update.json" >/dev/null; then
            echo "::error::Cloudflare Pages build settings were not updated (HTTP $status). The token needs Pages Write permission."
            jq -c '{errors,messages}' "$tmp/update.json" || true
            exit 1
          fi

          curl --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$project_url" > "$tmp/verify.json"
          jq -e '.success == true and .result.build_config.build_command == "bash cloudflare-pages/build.sh" and .result.build_config.destination_dir == "build/web" and .result.build_config.root_dir == "/"' "$tmp/verify.json" >/dev/null || {
            echo "::error::Cloudflare did not retain the expected Flutter Pages build configuration."
            jq -c '.result.build_config' "$tmp/verify.json"
            exit 1
          }

          {
            echo "## Cloudflare Pages build configuration updated"
            echo "- Project: testagram-flutter-web"
            echo "- Source: Trendyzima/testagram-flutter-client- (main)"
            echo "- Build command: `bash cloudflare-pages/build.sh`"
            echo "- Output directory: `build/web`"
            echo "- Root directory: `/`"
            echo "- Apex redirect and WebFinger routes: verified before change"
            echo "- Apex Pages association: verified absent"
            echo "- DNS records: unchanged"
          } | tee "$GITHUB_STEP_SUMMARY"
