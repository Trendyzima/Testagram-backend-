name: Deploy Testagram InstaBox Sentinel

on:
  pull_request:
    paths:
      - "infra/instabox-sentinel/**"
      - ".github/workflows/deploy-instabox-sentinel.yml"
  push:
    branches: [main]
    paths:
      - "infra/instabox-sentinel/**"
      - ".github/workflows/deploy-instabox-sentinel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-testagram-instabox-sentinel
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Verify Sentinel signature and recovery safety tests
        run: node --test infra/instabox-sentinel/test/index.test.mjs
      - name: Deploy Worker using existing Testagram credentials
        if: github.event_name != "pull_request"
        working-directory: infra/instabox-sentinel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          INSTABOX_WEBHOOK_SECRET: ${{ secrets.INSTABOX_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is required"; exit 1; }
          test -n "$INSTABOX_API_KEY" || { echo "::error::The existing INSTABOX_API_KEY secret is required"; exit 1; }
          test -n "$INSTABOX_WEBHOOK_SECRET" || { echo "::error::Create the InstaBox webhook and add its signing secret as INSTABOX_WEBHOOK_SECRET"; exit 1; }
          trap 'rm -f .worker-secrets.json' EXIT
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const secrets = {
              INSTABOX_API_KEY: process.env.INSTABOX_API_KEY,
              INSTABOX_WEBHOOK_SECRET: process.env.INSTABOX_WEBHOOK_SECRET
            };
            writeFileSync(".worker-secrets.json", JSON.stringify(secrets), { mode: 0o600 });
          '
          npx --yes wrangler@4 deploy --config wrangler.toml --secrets-file .worker-secrets.json
