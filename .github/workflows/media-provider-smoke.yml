name: Backblaze B2 storage smoke test

on:
  workflow_dispatch:
    inputs:
      confirm_b2_object_write:
        description: Confirm a temporary test object may be written to and deleted from the configured B2 bucket.
        required: true
        type: boolean
        default: false
      confirm_live_provider_writes:
        description: Confirm the isolated MinIO identity-evidence lifecycle may write, repair and delete objects in dedicated non-production B2 and R2 staging buckets.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testagram-b2-storage-smoke
  cancel-in-progress: false

jobs:
  verify-b2:
    if: inputs.confirm_b2_object_write == true
    name: Verify dedicated staging B2 credentials and object lifecycle
    runs-on: ubuntu-latest
    environment: media-staging
    timeout-minutes: 10
    env:
      B2_ENDPOINT: ${{ vars.MEDIA_STAGING_B2_ENDPOINT }}
      B2_REGION: ${{ vars.MEDIA_STAGING_B2_REGION }}
      B2_BUCKET: ${{ vars.MEDIA_STAGING_B2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.MEDIA_STAGING_B2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_STAGING_B2_SECRET_ACCESS_KEY }}
    steps:
      - name: Validate dedicated media-staging B2 settings
        shell: bash
        run: |
          set -euo pipefail
          for name in B2_ENDPOINT B2_REGION B2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing media-staging environment setting: $name"; exit 1; }
          done
          [[ "$B2_ENDPOINT" == https://* ]] || { echo "::error::B2 endpoint must use HTTPS"; exit 1; }
          [[ "$B2_BUCKET" =~ (^|[-_])(ci|staging|smoke)([-_]|$) ]] || { echo "::error::B2 bucket must explicitly identify isolated CI/staging/smoke data"; exit 1; }
          [[ ! "$B2_BUCKET" =~ (^|[-_])(prod|production)([-_]|$) ]] || { echo "::error::Production B2 bucket rejected"; exit 1; }
          echo "Dedicated staging B2 endpoint, bucket and credentials are present. Values are not printed."

      - name: Write, read back, verify SHA-256 and delete one temporary object
        shell: bash
        run: |
          set -euo pipefail
          aws --version
          stage="$(mktemp -d)"
          key="ci-smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-b2"
          cleanup() {
            aws --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" s3api delete-object \
              --bucket "$B2_BUCKET" --key "$key" >/dev/null 2>&1 || true
            rm -rf "$stage"
          }
          trap cleanup EXIT

          printf 'Testagram B2 storage smoke test\nrun=%s\nattempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$stage/source"
          expected="$(sha256sum "$stage/source" | awk '{print $1}')"

          aws --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" s3api put-object \
            --bucket "$B2_BUCKET" --key "$key" --body "$stage/source" \
            --content-type application/octet-stream >/dev/null

          aws --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" s3api get-object \
            --bucket "$B2_BUCKET" --key "$key" "$stage/readback" >/dev/null
          actual="$(sha256sum "$stage/readback" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::B2 SHA-256 read-back mismatch"; exit 1; }
          cmp -s "$stage/source" "$stage/readback"

          aws --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" s3api delete-object \
            --bucket "$B2_BUCKET" --key "$key" >/dev/null
          if aws --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" s3api head-object \
            --bucket "$B2_BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "::error::Temporary B2 object remains visible after deletion"
            exit 1
          fi
          trap - EXIT
          rm -rf "$stage"
          echo "B2 write, read-back, SHA-256 verification and logical deletion passed."

      - name: Report scope
        if: success()
        run: |
          {
            echo "### Backblaze B2 storage smoke test"
            echo "- Used dedicated media-staging environment credentials; no repository-wide provider credentials were used."
            echo "- Verified one temporary object by read-back and SHA-256."
            echo "- Verified logical deletion."
            echo "- This does not test R2, cross-provider replication, CDN delivery, or production media readiness."
          } >> "$GITHUB_STEP_SUMMARY"

  three-provider-media-replication:
    if: inputs.confirm_live_provider_writes == true
    name: Verify ordinary media bytes across Instabox MinIO, Cloudflare R2 and Backblaze B2
    runs-on: ubuntu-latest
    environment: media-staging
    timeout-minutes: 35
    env:
      TESTAGRAM_LIVE_MEDIA_REPLICATION: "true"
      MEDIA_SMOKE_INSTABOX_ENDPOINT: http://127.0.0.1:9000
      MEDIA_SMOKE_INSTABOX_REGION: us-east-1
      MEDIA_SMOKE_INSTABOX_ACCESS_KEY_ID: ci-testagram-media
      MEDIA_SMOKE_INSTABOX_SECRET_ACCESS_KEY: ci-only-media-secret-32-characters
      MEDIA_SMOKE_INSTABOX_PRIVATE_BUCKET: testagram-ci-media-private
      MEDIA_SMOKE_INSTABOX_PUBLIC_BUCKET: testagram-ci-media-public
      MEDIA_SMOKE_R2_ENDPOINT: ${{ vars.MEDIA_STAGING_R2_ENDPOINT }}
      MEDIA_SMOKE_R2_REGION: ${{ vars.MEDIA_STAGING_R2_REGION }}
      MEDIA_SMOKE_R2_ACCESS_KEY_ID: ${{ secrets.MEDIA_STAGING_R2_ACCESS_KEY_ID }}
      MEDIA_SMOKE_R2_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_STAGING_R2_SECRET_ACCESS_KEY }}
      MEDIA_SMOKE_R2_PRIVATE_BUCKET: ${{ vars.MEDIA_STAGING_R2_PRIVATE_BUCKET }}
      MEDIA_SMOKE_R2_PUBLIC_BUCKET: ${{ vars.MEDIA_STAGING_R2_PUBLIC_BUCKET }}
      MEDIA_SMOKE_B2_ENDPOINT: ${{ vars.MEDIA_STAGING_B2_ENDPOINT }}
      MEDIA_SMOKE_B2_REGION: ${{ vars.MEDIA_STAGING_B2_REGION }}
      MEDIA_SMOKE_B2_ACCESS_KEY_ID: ${{ secrets.MEDIA_STAGING_B2_ACCESS_KEY_ID }}
      MEDIA_SMOKE_B2_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_STAGING_B2_SECRET_ACCESS_KEY }}
      MEDIA_SMOKE_B2_PRIVATE_BUCKET: ${{ vars.MEDIA_STAGING_B2_PRIVATE_BUCKET }}
      MEDIA_SMOKE_B2_PUBLIC_BUCKET: ${{ vars.MEDIA_STAGING_B2_PUBLIC_BUCKET }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start isolated MinIO media primary
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --rm --name testagram-minio-three-provider-media \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$MEDIA_SMOKE_INSTABOX_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$MEDIA_SMOKE_INSTABOX_SECRET_ACCESS_KEY" \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9 \
            server /data --address ":9000" --console-address ":9001"
          for attempt in $(seq 1 40); do
            if curl -fsS "$MEDIA_SMOKE_INSTABOX_ENDPOINT/minio/health/live" >/dev/null; then break; fi
            if [ "$attempt" -eq 40 ]; then echo "::error::Isolated MinIO did not become healthy"; exit 1; fi
            sleep 2
          done
      - name: Create isolated MinIO media namespace buckets
        shell: bash
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$MEDIA_SMOKE_INSTABOX_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$MEDIA_SMOKE_INSTABOX_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="$MEDIA_SMOKE_INSTABOX_REGION"
          for bucket in "$MEDIA_SMOKE_INSTABOX_PRIVATE_BUCKET" "$MEDIA_SMOKE_INSTABOX_PUBLIC_BUCKET"; do
            aws --endpoint-url "$MEDIA_SMOKE_INSTABOX_ENDPOINT" s3api create-bucket --bucket "$bucket" >/dev/null
          done
      - name: Refuse production or ambiguous cloud buckets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MEDIA_SMOKE_R2_ENDPOINT" == https://* && "$MEDIA_SMOKE_B2_ENDPOINT" == https://* ]] || { echo "::error::B2 and R2 endpoints must use HTTPS"; exit 1; }
          r2_host="$(python3 -c 'import sys,urllib.parse; print((urllib.parse.urlsplit(sys.argv[1]).hostname or "").lower().rstrip("."))' "$MEDIA_SMOKE_R2_ENDPOINT")"
          b2_host="$(python3 -c 'import sys,urllib.parse; print((urllib.parse.urlsplit(sys.argv[1]).hostname or "").lower().rstrip("."))' "$MEDIA_SMOKE_B2_ENDPOINT")"
          [[ -n "$r2_host" && -n "$b2_host" && "$r2_host" != "$b2_host" ]] || { echo "::error::Three-provider media B2 and R2 endpoints must resolve to distinct hostnames"; exit 1; }
          for provider in R2 B2; do
            for namespace in PRIVATE PUBLIC IDENTITY; do
              name="MEDIA_SMOKE_${provider}_${namespace}_BUCKET"
              bucket="${!name:-}"
              [[ -n "$bucket" ]] || { echo "::error::Missing dedicated staging bucket: $name"; exit 1; }
              [[ "$bucket" =~ (^|[-_])(ci|staging|smoke)([-_]|$) ]] || { echo "::error::$name must explicitly identify a CI/staging/smoke bucket"; exit 1; }
              [[ ! "$bucket" =~ (^|[-_])(prod|production)([-_]|$) ]] || { echo "::error::Production bucket rejected"; exit 1; }
            done
            private="MEDIA_SMOKE_${provider}_PRIVATE_BUCKET"
            public="MEDIA_SMOKE_${provider}_PUBLIC_BUCKET"
            identity="MEDIA_SMOKE_${provider}_IDENTITY_BUCKET"
            [[ "${!private}" != "${!public}" && "${!private}" != "${!identity}" && "${!public}" != "${!identity}" ]] || { echo "::error::$provider namespace buckets must be distinct"; exit 1; }
          done
      - name: Verify upload, three independent SHA-256 copies, restore, repair and tombstone deletion
        run: go test -count=1 -run '^TestLiveMediaReplicationLifecycle$' -v ./internal/virtualstorage
      - name: Stop isolated MinIO
        if: always()
        run: docker rm -f testagram-minio-three-provider-media >/dev/null 2>&1 || true
      - name: Record three-provider media acceptance scope
        if: success()
        run: |
          {
            echo "### Three-provider media lifecycle"
            echo "- Uploaded synthetic private/public/identity-evidence objects to isolated MinIO."
            echo "- Independently verified MinIO, R2 and B2 bytes by size and SHA-256."
            echo "- Simulated MinIO loss and restored from a verified replica."
            echo "- Simulated missing R2 and corrupted B2, then repaired both."
            echo "- Verified tombstone deletion removed all three copies."
            echo "- This validates the Backend virtual-storage path; the separate Data Centre B2/R2 media service and CDN delivery remain separate gates."
          } >> "$GITHUB_STEP_SUMMARY"

