name: Backblaze B2 storage smoke test

on:
  workflow_dispatch:
    inputs:
      confirm_b2_object_write:
        description: Confirm a temporary test object may be written to and deleted from the configured B2 bucket.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testagram-b2-storage-smoke
  cancel-in-progress: false

jobs:
  verify-b2:
    if: inputs.confirm_b2_object_write == true
    name: Verify existing B2 credentials and object lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      B2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_S3_REGION }}
      B2_BUCKET: ${{ secrets.B2_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.B2_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Validate existing B2 settings
        shell: bash
        run: |
          set -euo pipefail
          for name in B2_ENDPOINT B2_REGION B2_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            [[ -n "${!name:-}" ]] || { echo "::error::Missing existing repository secret: $name"; exit 1; }
          done
          [[ "$B2_ENDPOINT" == https://* ]] || { echo "::error::B2 endpoint must use HTTPS"; exit 1; }
          echo "Existing B2 endpoint, bucket and credentials are present. Values are not printed."

      - name: Write, read back, verify SHA-256 and delete one temporary object
        shell: bash
        run: |
          set -euo pipefail
          aws --version
          stage="$(mktemp -d)"
          key="ci-smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-b2"
          cleanup() {
            aws --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" s3api delete-object \
              --bucket "$B2_BUCKET" --key "$key" >/dev/null 2>&1 || true
            rm -rf "$stage"
          }
          trap cleanup EXIT

          printf 'Testagram B2 storage smoke test\nrun=%s\nattempt=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$stage/source"
          expected="$(sha256sum "$stage/source" | awk '{print $1}')"

          aws --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" s3api put-object \
            --bucket "$B2_BUCKET" --key "$key" --body "$stage/source" \
            --content-type application/octet-stream >/dev/null

          aws --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" s3api get-object \
            --bucket "$B2_BUCKET" --key "$key" "$stage/readback" >/dev/null
          actual="$(sha256sum "$stage/readback" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]] || { echo "::error::B2 SHA-256 read-back mismatch"; exit 1; }
          cmp -s "$stage/source" "$stage/readback"

          aws --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" s3api delete-object \
            --bucket "$B2_BUCKET" --key "$key" >/dev/null
          if aws --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" s3api head-object \
            --bucket "$B2_BUCKET" --key "$key" >/dev/null 2>&1; then
            echo "::error::Temporary B2 object remains visible after deletion"
            exit 1
          fi
          trap - EXIT
          rm -rf "$stage"
          echo "B2 write, read-back, SHA-256 verification and logical deletion passed."

      - name: Report scope
        if: success()
        run: |
          {
            echo "### Backblaze B2 storage smoke test"
            echo "- Reused existing repository B2 secrets; no additional credentials required."
            echo "- Verified one temporary object by read-back and SHA-256."
            echo "- Verified logical deletion."
            echo "- This does not test R2, cross-provider replication, CDN delivery, or production media readiness."
          } >> "$GITHUB_STEP_SUMMARY"
