name: Go security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Resolve module checksums
        run: go mod tidy
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Check dependency licenses and module metadata
        run: go mod verify
      - name: Scan the isolated platform service module
        working-directory: services/platform
        run: |
          go mod download
          go run golang.org/x/vuln/cmd/govulncheck@latest ./...
          go mod verify
