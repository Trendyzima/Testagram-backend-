name: Sync Appwrite secrets to Render

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testagram-render-appwrite-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    name: Sync Appwrite runtime configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
      APPWRITE_PROJECT_ID: ${{ secrets.APPWRITE_PROJECT_ID }}
      APPWRITE_DATABASE_ID: ${{ secrets.APPWRITE_DATABASE_ID }}
      APPWRITE_SERVER_API_KEY: ${{ secrets.APPWRITE_SERVER_API_KEY }}
      RENDER_SERVICE_ID: srv-dbphc4gm7kps73aumno0
    steps:
      - name: Validate required secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in RENDER_API_KEY APPWRITE_ENDPOINT APPWRITE_PROJECT_ID APPWRITE_DATABASE_ID APPWRITE_SERVER_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          if [[ "$APPWRITE_PROJECT_ID" == *"Your actual Appwrite project ID"* ]]; then
            echo "::error::APPWRITE_PROJECT_ID is still the placeholder. Replace it with the real Appwrite project ID."
            exit 1
          fi
          if [[ "$APPWRITE_ENDPOINT" != "https://fra.cloud.appwrite.io/v1" ]]; then
            echo "::error::APPWRITE_ENDPOINT does not match the configured Frankfurt Appwrite endpoint."
            exit 1
          fi
          if [[ "$APPWRITE_DATABASE_ID" != "6af01f05003503d9d603" ]]; then
            echo "::error::APPWRITE_DATABASE_ID does not match the expected Testagram database ID."
            exit 1
          fi
          echo "Required secrets are present and non-placeholder."

      - name: Upsert Appwrite variables on Render
        shell: bash
        run: |
          set -euo pipefail
          upsert() {
            local key="$1"
            local value="$2"
            local payload
            payload="$(jq -cn --arg value "$value" '{value: $value}')"
            curl --silent --show-error --fail-with-body \
              --request PUT \
              --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/$key" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "$payload" >/dev/null
            echo "Updated $key on Render."
          }
          upsert APPWRITE_ENDPOINT "$APPWRITE_ENDPOINT"
          upsert APPWRITE_PROJECT_ID "$APPWRITE_PROJECT_ID"
          upsert APPWRITE_DATABASE_ID "$APPWRITE_DATABASE_ID"
          upsert APPWRITE_SERVER_API_KEY "$APPWRITE_SERVER_API_KEY"

      - name: Trigger Render deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          payload='{"clearCache":"do_not_clear","deployMode":"build_and_deploy"}'
          response="$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$payload")"
          deploy_id="$(jq -r '.id // empty' <<<"$response")"
          status="$(jq -r '.status // "unknown"' <<<"$response")"
          if [[ -z "$deploy_id" ]]; then
            echo "::error::Render did not return a deployment ID."
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
          echo "Render accepted deployment $deploy_id (status: $status)."
