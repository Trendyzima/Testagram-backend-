name: InstaBox deployment diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/instabox-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INSTABOX_API_KEY: ${{ secrets.TESTAGRAM_DB_API }}
    steps:
      - name: Read remote deployment status
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          if [[ -z "${INSTABOX_API_KEY:-}" ]]; then
            echo "::error::Missing TESTAGRAM_DB_API."
            exit 1
          fi
          machines="$(curl -fsS -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines?limit=100")"
          machine_id="$(jq -r '([.machines[] | select(.name == "testagram")][0].id) // (if (.machines | length) == 1 then .machines[0].id else "" end)' <<<"$machines")"
          if [[ -z "$machine_id" ]]; then
            echo "::error::Could not safely identify the Testagram machine."
            jq -c '[.machines[] | {id,name,state}]' <<<"$machines"
            exit 1
          fi
          payload="$(jq -nc '{cmd:"set +e; echo ===DEPLOY_LOG===; tail -n 100 /data/home/testagram/deploy.log 2>&1; echo ===OVERLAY_STATUS===; cat /data/home/testagram/overlay-status.txt 2>/dev/null; echo ===PUBLIC_ENDPOINTS===; sed -n /MINIO_PUBLIC_ENDPOINT=/p /data/home/testagram/repos/backend/deploy/self-hosted/.env 2>/dev/null; sed -n /MEDIA_PUBLIC_BASE_URL=/p /data/home/testagram/repos/backend/deploy/self-hosted/.env 2>/dev/null; echo ===LOCAL_HEALTH===; curl -fsS http://127.0.0.1:8080/healthz >/dev/null && echo API_OK; curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null && echo MINIO_OK; echo ===CONTAINERS===; sudo docker ps -a --format \"table {{.Names}}\\t{{.Status}}\\t{{.Ports}}\"; echo ===OBJECT_INIT_LOG===; sudo docker logs --tail 100 testagram-self-hosted-object-init-1 2>&1; echo ===MINIO_LOG===; sudo docker logs --tail 60 testagram-self-hosted-object-storage-1 2>&1; echo ===DISK=== df -h / /data; echo ===MEMORY===; free -m; echo ===BACKEND_HEAD===; git -C /data/home/testagram/repos/backend rev-parse --short HEAD 2>/dev/null; grep -n 127.0.0.1:9000 /data/home/testagram/repos/backend/deploy/self-hosted/docker-compose.yml 2>/dev/null; echo ===OBJECT_PORT_BINDINGS===; sudo docker inspect testagram-self-hosted-object-storage-1 --format '{{json .HostConfig.PortBindings}}' 2>/dev/null; echo ===API_PORT_BINDINGS===; sudo docker inspect testagram-self-hosted-api-1 --format '{{json .HostConfig.PortBindings}}' 2>/dev/null; echo ===MACHINE===; hostname; true",timeoutSeconds:60}')"
          result="$(curl -fsS -X POST -H "X-API-Key: $INSTABOX_API_KEY" -H "Content-Type: application/json" -d "$payload" "$API/v1/machines/$machine_id/exec")"
          echo "Machine: $machine_id (latest deploy check)"
          jq -r '.stdout // empty' <<<"$result"
          if [[ "$(jq -r '.exitCode // 1' <<<"$result")" != "0" ]]; then
            jq -r '.stderr // empty' <<<"$result"
            exit 1
          fi
