name: Deploy Testagram to InstaBox

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Explicitly confirm a production deployment to InstaBox"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testagram-instabox-deploy-repair-5
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == true
    name: Deploy backend and private services
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    env:
      INSTABOX_API_KEY: ${{ secrets.TESTAGRAM_DB_API }}
      INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
      APPWRITE_ENDPOINT: ${{ vars.APPWRITE_ENDPOINT || 'https://fra.cloud.appwrite.io/v1' }}
      APPWRITE_PROJECT_ID: ${{ vars.APPWRITE_PROJECT_ID || secrets.APPWRITE_PROJECT_ID || '6af01d97002875d6d7bd' }}
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4
      - name: Resolve and start the InstaBox machine
        id: machine
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          if [[ -z "${INSTABOX_API_KEY:-}" ]]; then
            echo "::error::Missing TESTAGRAM_DB_API repository secret. Add the InstaBox API key there."
            exit 1
          fi

          machines="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS \
            -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines?limit=100")"
          machine_id="${INSTABOX_MACHINE_ID:-}"
          if [[ -z "$machine_id" ]]; then
            machine_id="$(jq -r '([.machines[] | select(.name == "testagram")][0].id) // (if (.machines | length) == 1 then .machines[0].id else "" end)' <<<"$machines")"
          fi

          if [[ -z "$machine_id" && "$(jq '.machines | length' <<<"$machines")" == "0" ]]; then
            body="$(jq -nc '{name:"testagram",templateId:"agent-browser",desiredState:"running",metadata:{app:"testagram",managedBy:"github-actions"}}')"
            created="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS -X POST \
              -H "X-API-Key: $INSTABOX_API_KEY" \
              -H "Idempotency-Key: testagram-create-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              -H "Content-Type: application/json" -d "$body" "$API/v1/machines")"
            operation_id="$(jq -r '.id // empty' <<<"$created")"
            machine_id="$(jq -r '.machineId // empty' <<<"$created")"
            if [[ -z "$operation_id" ]]; then
              echo "::error::InstaBox did not return a machine creation operation."
              jq -c '.error // .' <<<"$created"
              exit 1
            fi
            for attempt in $(seq 1 90); do
              operation="$(curl -fsS -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/operations/$operation_id")"
              state="$(jq -r '.state // empty' <<<"$operation")"
              machine_id="$(jq -r '.machineId // .machine.id // empty' <<<"$operation")"
              if [[ "$state" == "succeeded" && -n "$machine_id" ]]; then break; fi
              if [[ "$state" == "failed" ]]; then
                echo "::error::InstaBox machine creation failed."
                jq -c '.error // .' <<<"$operation"
                exit 1
              fi
              sleep 5
            done
          fi

          if [[ -z "$machine_id" ]]; then
            echo "::error::Could not safely select a machine. Name one machine 'testagram' or add INSTABOX_MACHINE_ID as a repository secret."
            exit 1
          fi

          machine="$(curl -fsS -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines/$machine_id")"
          state="$(jq -r '.state // empty' <<<"$machine")"
          if [[ "$state" != "running" ]]; then
            started="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS -X POST \
              -H "X-API-Key: $INSTABOX_API_KEY" \
              -H "Idempotency-Key: testagram-start-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              -H "Content-Type: application/json" -d '{}' "$API/v1/machines/$machine_id/start")"
            operation_id="$(jq -r '.id // empty' <<<"$started")"
            if [[ -n "$operation_id" ]]; then
              for attempt in $(seq 1 90); do
                operation="$(curl -fsS -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/operations/$operation_id")"
                state="$(jq -r '.state // empty' <<<"$operation")"
                if [[ "$state" == "succeeded" ]]; then break; fi
                if [[ "$state" == "failed" ]]; then
                  echo "::error::InstaBox machine start failed."
                  jq -c '.error // .' <<<"$operation"
                  exit 1
                fi
                sleep 5
              done
            fi
          fi

          for attempt in $(seq 1 60); do
            machine="$(curl -fsS -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines/$machine_id")"
            state="$(jq -r '.state // empty' <<<"$machine")"
            ready="$(jq -r '.runtime.ready // false' <<<"$machine")"
            if [[ "$state" == "running" && "$ready" == "true" ]]; then break; fi
            if [[ "$state" == "error" ]]; then
              echo "::error::InstaBox machine is in error state."
              jq -c '{state, runtime, operationId}' <<<"$machine"
              exit 1
            fi
            sleep 5
          done

          echo "machine_id=$machine_id" >> "$GITHUB_OUTPUT"
          echo "InstaBox machine is ready."

      - name: Start deployment on the machine
        id: remote
        env:
          MACHINE_ID: ${{ steps.machine.outputs.machine_id }}
          DATA_CENTRE_MEDIA_ENABLED: ${{ vars.DATA_CENTRE_MEDIA_ENABLED || 'false' }}
          MEDIA_REPLICATION_ENABLED: ${{ vars.MEDIA_REPLICATION_ENABLED || 'false' }}
          TESTAGRAM_IDENTITY_REGISTRATION_ENABLED: ${{ vars.TESTAGRAM_IDENTITY_REGISTRATION_ENABLED || 'false' }}
          TESTAGRAM_TERMS_VERSION: ${{ vars.TESTAGRAM_TERMS_VERSION }}
          TESTAGRAM_PRIVACY_VERSION: ${{ vars.TESTAGRAM_PRIVACY_VERSION }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          ONSPACE_AI_API_KEY: ${{ secrets.ONSPACE_AI_API_KEY }}
          ONSPACE_AI_BASE_URL: ${{ vars.ONSPACE_AI_BASE_URL }}
          MEDIA_MODERATION_TOKEN: ${{ secrets.MEDIA_MODERATION_TOKEN }}
          MPESA_ENV: ${{ vars.MPESA_ENV }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_CALLBACK_URL: ${{ vars.MPESA_CALLBACK_URL }}
          ADMIN_SERVICE_AUTH_KEY: ${{ secrets.ADMIN_SERVICE_AUTH_KEY }}
          B2_S3_ENDPOINT: ${{ vars.B2_S3_ENDPOINT }}
          B2_S3_REGION: ${{ vars.B2_S3_REGION }}
          B2_S3_BUCKET: ${{ vars.B2_S3_PRIVATE_BUCKET }}
          B2_S3_PRIVATE_BUCKET: ${{ vars.B2_S3_PRIVATE_BUCKET }}
          B2_S3_PUBLIC_BUCKET: ${{ vars.B2_S3_PUBLIC_BUCKET }}
          B2_S3_IDENTITY_EVIDENCE_PRIVATE_BUCKET: ${{ vars.B2_S3_IDENTITY_EVIDENCE_PRIVATE_BUCKET }}
          B2_S3_ACCESS_KEY_ID: ${{ secrets.B2_S3_ACCESS_KEY_ID }}
          B2_S3_SECRET_ACCESS_KEY: ${{ secrets.B2_S3_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT }}
          CLOUDFLARE_R2_REGION: ${{ vars.CLOUDFLARE_R2_REGION }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_PRIVATE_BUCKET }}
          CLOUDFLARE_R2_PRIVATE_BUCKET: ${{ vars.CLOUDFLARE_R2_PRIVATE_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_BUCKET: ${{ vars.CLOUDFLARE_R2_PUBLIC_BUCKET }}
          CLOUDFLARE_R2_IDENTITY_EVIDENCE_PRIVATE_BUCKET: ${{ vars.CLOUDFLARE_R2_IDENTITY_EVIDENCE_PRIVATE_BUCKET }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        shell: bash
        run: bash scripts/start-instabox-deployment.sh
      - name: Wait for deployment and report logs
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          cmd='ROOT=/data/home/testagram; tail -n 45 "$ROOT/deploy.log" 2>/dev/null || true'
          payload="$(jq -nc --arg cmd "$cmd" '{cmd:$cmd,timeoutSeconds:60}')"
          for attempt in $(seq 1 90); do
            result="$(curl -fsS -X POST -H "X-API-Key: $INSTABOX_API_KEY" \
              -H "Content-Type: application/json" -d "$payload" \
              "$API/v1/machines/$MACHINE_ID/exec")"
            exec_code="$(jq -r '.exitCode // 1' <<<"$result")"
            output="$(jq -r '.stdout // empty' <<<"$result")"
            if [[ "$exec_code" != "0" ]]; then
              echo "::error::Could not read the remote deployment log."
              jq -r '.stderr // empty' <<<"$result"
              exit 1
            fi
            echo "$output"
            if grep -q 'DEPLOY_EXIT=0' <<<"$output"; then
              exit 0
            fi
            if grep -q 'DEPLOY_EXIT=' <<<"$output"; then
              echo "::error::Remote deployment failed. Review the machine deployment log."
              exit 1
            fi
            sleep 25
          done
          echo "::error::Deployment exceeded the wait window. The remote log remains at /data/home/testagram/deploy.log."
          exit 1

      - name: Verify all deployed service health
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          cmd='set -euo pipefail
          containers=(testagram-self-hosted-postgres-1 testagram-self-hosted-api-1 testagram-self-hosted-object-storage-1 testagram-self-hosted-media-cache-1 testagram-data-centre-algorithm-1 testagram-data-centre-federation-api-1 testagram-data-centre-platform-1 testagram-data-centre-notification-1 testagram-data-centre-video-1 testagram-data-centre-video-worker-1 testagram-data-centre-worker-1)
          if [[ -f /data/home/testagram/media-enabled.txt ]] && grep -qx true /data/home/testagram/media-enabled.txt; then
            containers+=(testagram-data-centre-media-1)
          fi
          for container in "${containers[@]}"; do
            ready=false
            status=missing
            for attempt in $(seq 1 36); do
              status="$(sudo docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}" "$container" 2>/dev/null || echo missing)"
              if [[ "$status" == healthy || "$status" == running ]]; then ready=true; break; fi
              if [[ "$status" == missing || "$status" == exited || "$status" == dead || "$status" == unhealthy ]]; then break; fi
              sleep 5
            done
            echo "$container: $status"
            if [[ "$ready" != true ]]; then
              sudo docker logs --tail=100 "$container" 2>&1 || true
              exit 1
            fi
          done
          minio_id="$(sudo docker ps -q --filter name=testagram-self-hosted-object-storage-1 | head -n 1)"
          if [[ -z "$minio_id" ]]; then
            echo "MinIO container is missing." >&2
            exit 1
          fi
          bindings="$(sudo docker inspect --format '{{json .HostConfig.PortBindings}}' "$minio_id")"
          if ! jq -e '."9000/tcp" | length == 1 and .[0].HostIp == "127.0.0.1"' <<<"$bindings" >/dev/null; then
            echo "MinIO S3 port 9000 is not restricted to the VPS loopback interface." >&2
            exit 1
          fi
          if jq -e '."9001/tcp" // [] | length > 0' <<<"$bindings" >/dev/null; then
            echo "MinIO console port 9001 must not be published on the VPS host." >&2
            exit 1
          fi
          echo "MinIO verified private: S3 bound only to 127.0.0.1; console unpublished."
          '
          payload="$(jq -nc --arg cmd "$cmd" '{cmd:$cmd,timeoutSeconds:180}')"
          result="$(curl -fsS -X POST -H "X-API-Key: $INSTABOX_API_KEY" \
            -H "Content-Type: application/json" -d "$payload" \
            "$API/v1/machines/$MACHINE_ID/exec")"
          code="$(jq -r '.exitCode // 1' <<<"$result")"
          if [[ "$code" != "0" ]]; then
            echo "::error::One or more deployed Testagram services are not healthy."
            jq -r '.stderr // empty, .stdout // empty' <<<"$result"
            exit 1
          fi
          jq -r '.stdout // empty' <<<"$result"

      - name: Publish the Backend API over HTTPS
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          port_agent_status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines/$MACHINE_ID/port-agent")"
          if [[ "$port_agent_status" != "204" ]]; then
            echo "::error::Could not install InstaBox public-port agent (HTTP $port_agent_status)."
            exit 1
          fi
          body='{"port":8080,"name":"testagram-api","protocol":"http","access":"public"}'
          published="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS -X POST \
            -H "X-API-Key: $INSTABOX_API_KEY" \
            -H "Content-Type: application/json" -d "$body" \
            "$API/v1/machines/$MACHINE_ID/ports")"
          url="$(jq -r '.url // empty' <<<"$published")"
          if [[ -z "$url" ]]; then
            echo "::error::InstaBox did not return a public HTTPS URL for port 8080."
            jq -c '.error // .' <<<"$published"
            exit 1
          fi
          echo "api_url=$url" >> "$GITHUB_OUTPUT"
          echo "Testagram API URL: $url"

      - name: Publish Go CDN media endpoint over HTTPS
        id: publish_cdn
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          body='{"port":8081,"name":"testagram-cdn","protocol":"http","access":"public"}'
          published="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS -X POST \
            -H "X-API-Key: $INSTABOX_API_KEY" \
            -H "Content-Type: application/json" -d "$body" \
            "$API/v1/machines/$MACHINE_ID/ports")"
          url="$(jq -r '.url // empty' <<<"$published")"
          if [[ -z "$url" || "$url" != https://* ]]; then
            echo "::error::InstaBox did not return a valid HTTPS URL for the Go CDN port."
            jq -c '.error // .' <<<"$published"
            exit 1
          fi
          echo "cdn_url=$url" >> "$GITHUB_OUTPUT"
          echo "Go CDN URL: $url"

      - name: Configure public CDN URL and restart Backend and Go CDN
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          CDN_URL="${{ steps.publish_cdn.outputs.cdn_url }}"
          cmd='set -euo pipefail; ROOT=/data/home/testagram; BASE_ENV="$ROOT/repos/backend/deploy/self-hosted/.env"; upsert_env(){ key="$1"; value="$2"; if grep -q "^${key}=" "$BASE_ENV"; then sed -i "s|^${key}=.*|${key}=${value}|" "$BASE_ENV"; else printf "%s=%s\n" "$key" "$value" >> "$BASE_ENV"; fi; }; CDN_URL="${CDN_URL%/}"; upsert_env MINIO_PUBLIC_ENDPOINT "http://object-storage:9000"; upsert_env CDN_MEDIA_BASE_URL "$CDN_URL"; upsert_env MEDIA_PUBLIC_BASE_URL "$CDN_URL/v1"; sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" up -d --force-recreate media-cache api; for attempt in $(seq 1 36); do if sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" exec -T media-cache /healthcheck && sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" exec -T api wget -q -O /dev/null http://127.0.0.1:8080/readyz; then break; fi; sleep 5; done; cdn_container="$(sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" ps -q media-cache)"; api_container="$(sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" ps -q api)"; check_env(){ container="$1"; key="$2"; expected="$3"; if ! sudo docker inspect --format "{{range .Config.Env}}{{println .}}{{end}}" "$container" | grep -Fqx -- "$key=$expected"; then echo "Runtime env mismatch: $key" >&2; exit 1; fi; }; expected_purge="$(sed -n "s/^CDN_PURGE_TOKEN=//p" "$BASE_ENV" | tail -n 1)"; check_env "$cdn_container" PUBLIC_BASE_URL "$CDN_URL"; check_env "$cdn_container" PURGE_TOKEN "$expected_purge"; check_env "$api_container" CDN_MEDIA_BASE_URL "$CDN_URL"; check_env "$api_container" MEDIA_PUBLIC_BASE_URL "$CDN_URL/v1"; check_env "$api_container" CDN_PURGE_URL "http://media-cache:8081/api/cache/purge"; check_env "$api_container" CDN_PURGE_TOKEN "$expected_purge"; sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" exec -T media-cache /healthcheck; sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" exec -T api wget -q -O /dev/null http://127.0.0.1:8080/readyz'
          payload="$(jq -nc --arg cmd "$cmd" --arg cdn "$CDN_URL" '{cmd:$cmd,envs:{CDN_URL:$cdn},timeoutSeconds:240}')"
          result="$(curl -fsS -X POST -H "X-API-Key: $INSTABOX_API_KEY" \
            -H "Content-Type: application/json" -d "$payload" \
            "$API/v1/machines/$MACHINE_ID/exec")"
          code="$(jq -r '.exitCode // 1' <<<"$result")"
          if [[ "$code" != "0" ]]; then
            echo "::error::Could not apply the public media URL to the backend."
            jq -r '.stderr // empty' <<<"$result"
            exit 1
          fi
          echo "Backend now uses the public MinIO endpoint."

      - name: Verify public API health and readiness
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.publish.outputs.api_url }}"
          CDN_URL="${{ steps.publish_cdn.outputs.cdn_url }}"
          for attempt in $(seq 1 30); do
            if curl -fsS "$URL/healthz" >/dev/null && curl -fsS "$URL/readyz" >/dev/null && curl -fsS "$CDN_URL/healthz" >/tmp/cdn-health.json && curl -fsS "$CDN_URL/readyz" >/tmp/cdn-ready.txt && grep -q '"service":"testagram-cdn"' /tmp/cdn-health.json && grep -qx 'ready' /tmp/cdn-ready.txt; then
              private_status="$(curl -sS -o /dev/null -w '%{http_code}' "$CDN_URL/v1/users/cdn-smoke/0123456789abcdef0123456789abcdef")"
              case "$private_status" in 401|403|404) ;; *) echo "::error::Unauthenticated media request returned unsafe HTTP $private_status"; exit 1 ;; esac
              echo "Testagram API and pinned Go CDN are reachable; MinIO remains private behind the backend/CDN and unauthenticated media denial passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::The API or public MinIO endpoint did not pass health checks."
          exit 1

      - name: Verify canonical API origin and private TV route registration
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL_API_URL="${{ vars.TESTAGRAM_API_URL || 'https://api.testagram.site' }}"
          if [[ "$CANONICAL_API_URL" != https://* ]]; then
            echo "::error::TESTAGRAM_API_URL must be an HTTPS origin."
            exit 1
          fi
          CANONICAL_API_URL="${CANONICAL_API_URL%/}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          health_status=000
          ready_status=000
          catalog_status=000
          for attempt in $(seq 1 12); do
            health_status="$(curl -sS --connect-timeout 5 --max-time 10 -o "$tmp/health" -w '%{http_code}' "$CANONICAL_API_URL/healthz" || true)"
            # Caddy deliberately hides dependency readiness from the public internet.
            # The deploy script already checks /readyz from inside the API container.
            ready_status="$(curl -sS --connect-timeout 5 --max-time 10 -o /dev/null -w '%{http_code}' "$CANONICAL_API_URL/readyz" || true)"
            catalog_status="$(curl -sS --connect-timeout 5 --max-time 10 -o "$tmp/catalog" -w '%{http_code}' "$CANONICAL_API_URL/internal/tv/catalog" || true)"
            if [[ "$health_status" == "200" && "$ready_status" == "404" && "$catalog_status" == "401" ]] &&
               grep -qx 'ok' "$tmp/health"; then
              echo "Canonical API liveness passed; private readiness remains hidden (404) and the internal TV catalogue correctly rejects unauthenticated access (401). Container readiness was verified privately during deployment."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Canonical API origin is not wired to the deployed Backend or exposes an unexpected route. Expected public /healthz=200, hidden /readyz=404 and unauthenticated /internal/tv/catalog=401; observed $health_status, $ready_status and $catalog_status."
          exit 1

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "### Testagram deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Machine: ${{ steps.machine.outputs.machine_id || 'not resolved' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API URL: ${{ steps.publish.outputs.api_url || 'not published' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Go CDN URL: ${{ steps.publish_cdn.outputs.cdn_url || 'not published' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend health: checked at /healthz and /readyz" >> "$GITHUB_STEP_SUMMARY"
          echo "- Appwrite project ID: ${{ secrets.APPWRITE_PROJECT_ID != '' && 'configured' || 'not configured; login-dependent services are skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Federation delivery workers remain disabled by design." >> "$GITHUB_STEP_SUMMARY"
