name: Deploy Testagram to InstaBox

on:
  # A merge/push to main is the production approval boundary. Pull requests
  # run validation only; they never receive production secrets or deploy.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Explicitly confirm a production deployment to InstaBox"
        required: true
        type: boolean
        default: false
      confirm_native_identity_migrations:
        description: "Authorize additive native identity, OTP, transactional mail, social email-consent and Federation actor-consent PostgreSQL migrations only if the live schema preflight finds them incomplete"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testagram-instabox-deploy-repair-5
  cancel-in-progress: false

jobs:
  validate:
    name: Validate InstaBox deployment inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate deployment shell syntax and PostgreSQL readiness regression
        shell: bash
        run: |
          bash -n scripts/start-instabox-deployment.sh
          python3 tests/test_r2_managed_domain_request.py -v
          python3 tests/test_instabox_postgres_readiness.py -v
          python3 tests/test_instabox_runtime_healthcheck_paths.py -v
          python3 tests/test_media_feature_gate_wiring.py -v
          python3 tests/test_native_identity_migration_manifest.py -v
          python3 tests/test_instabox_b2_credentials.py -v
          python3 tests/test_instabox_edge_proxy_secret.py -v
          python3 tests/test_instabox_image_digest_verification.py -v
          python3 tests/test_instabox_web_image_release_wiring.py -v
          python3 tests/test_instabox_deployment_polling.py -v
      - name: Compile watchdog safety module
        run: python3 -m py_compile scripts/instabox_watchdog.py
      - name: Run watchdog regression tests
        run: python3 -m unittest discover -s tests -p 'test_instabox_watchdog.py' -v

  deploy:
    needs: validate
    # A merge/push to main is the production approval boundary. Pull requests
    # validate only; manual dispatch still requires explicit confirmation.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true))
    name: Deploy backend and private services
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 55
    env:
      INSTABOX_API_KEY: ${{ secrets.TESTAGRAM_DB_API }}
      INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
      INSTABOX_MACHINE_NAME: ${{ vars.INSTABOX_MACHINE_NAME || 'testagramdb' }}
      TESTAGRAM_AUTH_JWT_SECRET: ${{ secrets.TESTAGRAM_AUTH_JWT_SECRET }}
      TESTAGRAM_IDENTITY_REVIEW_WEBAUTHN_ENABLED: ${{ vars.TESTAGRAM_IDENTITY_REVIEW_WEBAUTHN_ENABLED || 'false' }}
      TESTAGRAM_STAFF_WEBAUTHN_ENROLLMENT_ENABLED: ${{ vars.TESTAGRAM_STAFF_WEBAUTHN_ENROLLMENT_ENABLED || 'false' }}
      TESTAGRAM_WEBAUTHN_READINESS_TOKEN: ${{ secrets.TESTAGRAM_WEBAUTHN_READINESS_TOKEN }}
      TESTAGRAM_WEBAUTHN_RPID: ${{ vars.TESTAGRAM_WEBAUTHN_RPID || '' }}
      TESTAGRAM_WEBAUTHN_ORIGINS: ${{ vars.TESTAGRAM_WEBAUTHN_ORIGINS || '' }}
      TESTAGRAM_EDGE_PROXY_SHARED_TOKEN: ${{ secrets.TESTAGRAM_EDGE_PROXY_SHARED_TOKEN }}
      TESTAGRAM_EDGE_RECOVERY_READINESS_TOKEN: ${{ secrets.TESTAGRAM_EDGE_RECOVERY_READINESS_TOKEN }}
      AUTH_PUBLIC_BASE_URL: ${{ vars.AUTH_PUBLIC_BASE_URL || 'https://testagram.site' }}
      CLOUDFLARE_EMAIL_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AUTH_FROM_EMAIL: ${{ vars.TESTAGRAM_MAIL_FROM || 'no-reply@testagram.site' }}
      TESTAGRAM_MAIL_ENCRYPTION_KEY: ${{ secrets.TESTAGRAM_MAIL_ENCRYPTION_KEY }}
      TESTAGRAM_CLOUDFLARE_EVENTS_TOKEN: ${{ secrets.TESTAGRAM_CLOUDFLARE_EVENTS_TOKEN }}
    steps:
      - name: Check out deployment scripts
        uses: actions/checkout@v4
      - name: Validate edge proxy shared credential
        shell: bash
        run: |
          if [[ ! "${TESTAGRAM_EDGE_PROXY_SHARED_TOKEN:-}" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::Missing or invalid TESTAGRAM_EDGE_PROXY_SHARED_TOKEN production secret (expected 64 hexadecimal characters)."
            exit 1
          fi
      - name: Validate dedicated edge recovery readiness credential
        shell: bash
        run: |
          if [[ ! "$TESTAGRAM_EDGE_RECOVERY_READINESS_TOKEN" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "::error::Missing or invalid TESTAGRAM_EDGE_RECOVERY_READINESS_TOKEN production secret (expected 32 random bytes encoded as 64 hexadecimal characters; configure the same value in the CDN repository)."
            exit 1
          fi
      - name: Validate independent production media feature gates
        id: media-gates
        env:
          DATA_CENTRE_MEDIA_ENABLED: ${{ vars.DATA_CENTRE_MEDIA_ENABLED || 'false' }}
          FRESH_MEDIA_ENABLED: ${{ vars.FRESH_MEDIA_ENABLED || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          normalize_flag() {
            printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]'
          }
          early_dc_media_enabled="$(normalize_flag "${DATA_CENTRE_MEDIA_ENABLED:-false}")"
          early_fresh_gate="$(normalize_flag "${FRESH_MEDIA_ENABLED:-false}")"
          for flag in "$early_dc_media_enabled" "$early_fresh_gate"; do
            [[ "$flag" == true || "$flag" == false ]] || { echo "::error::Media feature gates must be true or false."; exit 1; }
          done
          if [[ "$early_dc_media_enabled" != "$early_fresh_gate" ]]; then
            echo "::error::DATA_CENTRE_MEDIA_ENABLED and FRESH_MEDIA_ENABLED must match; refusing a partial media profile."
            exit 1
          fi
          echo "media_enabled=$early_dc_media_enabled" >> "$GITHUB_OUTPUT"
          if [[ "$early_dc_media_enabled" == true ]]; then
            echo "Private media profile explicitly enabled; dedicated provider provisioning will run."
          else
            echo "Core-only deployment selected. Private media provisioning is skipped and identity registration remains fail-closed."
          fi

      - name: Resolve and start the InstaBox machine
        id: machine
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          EXPECTED_MACHINE_NAME="${INSTABOX_MACHINE_NAME:-testagramdb}"
          if [[ -z "${INSTABOX_API_KEY:-}" ]]; then
            echo "::error::Missing TESTAGRAM_DB_API repository secret. Add the InstaBox API key there."
            exit 1
          fi
          if [[ -z "$EXPECTED_MACHINE_NAME" ]]; then
            echo "::error::INSTABOX_MACHINE_NAME must identify the intended Testagram machine."
            exit 1
          fi

          machines="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS \
            -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines?limit=100")"
          if ! jq -e '.machines | type == "array"' <<<"$machines" >/dev/null; then
            echo "::error::InstaBox machine inventory response is malformed."
            exit 1
          fi

          machine_id="${INSTABOX_MACHINE_ID:-}"
          if [[ -z "$machine_id" ]]; then
            machine_id="$(jq -r --arg name "$EXPECTED_MACHINE_NAME" '([.machines[] | select(.name == $name)][0].id) // empty' <<<"$machines")"
          fi

          if [[ -z "$machine_id" && "$(jq '.machines | length' <<<"$machines")" == "0" ]]; then
            body="$(jq -nc --arg name "$EXPECTED_MACHINE_NAME" '{name:$name,templateId:"agent-browser",desiredState:"running",metadata:{app:"testagram",managedBy:"github-actions"}}')"
            created="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS -X POST \
              -H "X-API-Key: $INSTABOX_API_KEY" \
              -H "Idempotency-Key: testagram-create-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              -H "Content-Type: application/json" -d "$body" "$API/v1/machines")"
            operation_id="$(jq -r '.id // empty' <<<"$created")"
            machine_id="$(jq -r '.machineId // empty' <<<"$created")"
            if [[ -z "$operation_id" ]]; then
              echo "::error::InstaBox did not return a machine creation operation."
              jq -c '.error // .' <<<"$created"
              exit 1
            fi
            creation_succeeded=false
            for attempt in $(seq 1 90); do
              operation="$(curl -fsS -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/operations/$operation_id")"
              operation_state="$(jq -r '.state // empty' <<<"$operation")"
              machine_id="$(jq -r '.machineId // .machine.id // empty' <<<"$operation")"
              if [[ "$operation_state" == "succeeded" && -n "$machine_id" ]]; then
                creation_succeeded=true
                break
              fi
              if [[ "$operation_state" == "failed" ]]; then
                echo "::error::InstaBox machine creation failed."
                jq -c '.error // .' <<<"$operation"
                exit 1
              fi
              sleep 5
            done
            if [[ "$creation_succeeded" != true ]]; then
              echo "::error::Timed out waiting for InstaBox machine creation to succeed."
              exit 1
            fi
          fi

          if [[ -z "$machine_id" ]]; then
            echo "::error::No InstaBox machine named '$EXPECTED_MACHINE_NAME' was found. Set INSTABOX_MACHINE_ID only if it identifies that exact machine."
            exit 1
          fi

          machine="$(curl -fsS -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines/$machine_id")"
          actual_machine_name="$(jq -r '.name // empty' <<<"$machine")"
          if [[ "$actual_machine_name" != "$EXPECTED_MACHINE_NAME" ]]; then
            echo "::error::Refusing to deploy to machine '$actual_machine_name'; expected '$EXPECTED_MACHINE_NAME'. Check INSTABOX_MACHINE_ID and INSTABOX_MACHINE_NAME."
            exit 1
          fi
          state="$(jq -r '.state // empty' <<<"$machine")"
          if [[ "$state" != "running" ]]; then
            started="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS -X POST \
              -H "X-API-Key: $INSTABOX_API_KEY" \
              -H "Idempotency-Key: testagram-start-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              -H "Content-Type: application/json" -d '{}' "$API/v1/machines/$machine_id/start")"
            operation_id="$(jq -r '.id // empty' <<<"$started")"
            if [[ -z "$operation_id" ]]; then
              echo "::error::InstaBox did not return a machine start operation."
              jq -c '.error // .' <<<"$started"
              exit 1
            fi
            start_succeeded=false
            for attempt in $(seq 1 90); do
              operation="$(curl -fsS -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/operations/$operation_id")"
              operation_state="$(jq -r '.state // empty' <<<"$operation")"
              if [[ "$operation_state" == "succeeded" ]]; then
                start_succeeded=true
                break
              fi
              if [[ "$operation_state" == "failed" ]]; then
                echo "::error::InstaBox machine start failed."
                jq -c '.error // .' <<<"$operation"
                exit 1
              fi
              sleep 5
            done
            if [[ "$start_succeeded" != true ]]; then
              echo "::error::Timed out waiting for InstaBox machine start to succeed."
              exit 1
            fi
          fi

          ready=false
          for attempt in $(seq 1 60); do
            machine="$(curl -fsS -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines/$machine_id")"
            actual_machine_name="$(jq -r '.name // empty' <<<"$machine")"
            state="$(jq -r '.state // empty' <<<"$machine")"
            ready="$(jq -r '.runtime.ready // false' <<<"$machine")"
            if [[ "$actual_machine_name" != "$EXPECTED_MACHINE_NAME" ]]; then
              echo "::error::InstaBox machine identity changed during readiness polling."
              exit 1
            fi
            if [[ "$state" == "running" && "$ready" == "true" ]]; then break; fi
            if [[ "$state" == "error" ]]; then
              echo "::error::InstaBox machine is in error state."
              jq -c '{name, state, runtime, operationId}' <<<"$machine"
              exit 1
            fi
            sleep 5
          done

          if [[ "$state" != "running" || "$ready" != "true" ]]; then
            echo "::error::InstaBox machine '$EXPECTED_MACHINE_NAME' did not become ready within 300 seconds; refusing deployment."
            jq -c '{name, state, runtime, operationId}' <<<"$machine"
            exit 1
          fi

          echo "machine_id=$machine_id" >> "$GITHUB_OUTPUT"
          echo "Verified intended InstaBox machine '$EXPECTED_MACHINE_NAME' is running and ready."
      - name: Ensure Data Centre R2 media and metadata buckets exist
        if: steps.media-gates.outputs.media_enabled == 'true'
        id: r2-media-buckets
        env:
          DATA_CENTRE_MEDIA_ENABLED: ${{ vars.DATA_CENTRE_MEDIA_ENABLED || 'false' }}
          FRESH_MEDIA_ENABLED: ${{ vars.FRESH_MEDIA_ENABLED || 'false' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT || secrets.TESTAGRAM_BACKUP_S3_ENDPOINT }}
          R2_REGION: ${{ vars.CLOUDFLARE_R2_REGION || 'auto' }}
          R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.TESTAGRAM_BACKUP_S3_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.TESTAGRAM_BACKUP_S3_SECRET_ACCESS_KEY }}
          R2_MEDIA_BUCKET: ${{ vars.CLOUDFLARE_R2_PRIVATE_BUCKET || 'testagram-media-production-r2' }}
          R2_METADATA_BUCKET: ${{ vars.CLOUDFLARE_R2_METADATA_BUCKET || 'testagram-media-production-metadata' }}
          R2_IDENTITY_BUCKET: ${{ vars.CLOUDFLARE_R2_IDENTITY_EVIDENCE_PRIVATE_BUCKET || 'testagram-identity-evidence-production-r2' }}
        shell: bash
        run: |
          set -euo pipefail
          normalize_flag() { printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]'; }
          dc_media_enabled="$(normalize_flag "${DATA_CENTRE_MEDIA_ENABLED:-false}")"
          fresh_gate_enabled="$(normalize_flag "${FRESH_MEDIA_ENABLED:-false}")"
          [[ "$dc_media_enabled" == true && "$fresh_gate_enabled" == true ]] || { echo "::error::Internal workflow error: R2 provisioning ran without both media gates."; exit 1; }
          [[ -n "$R2_ENDPOINT" && -n "$R2_ACCESS_KEY_ID" && -n "$R2_SECRET_ACCESS_KEY" ]] || { echo "::error::Existing R2 S3 endpoint and key pair are required."; exit 1; }
          [[ "$R2_MEDIA_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || { echo "::error::Invalid R2 media bucket name."; exit 1; }
          [[ "$R2_METADATA_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || { echo "::error::Invalid R2 metadata bucket name."; exit 1; }
          [[ "$R2_IDENTITY_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || { echo "::error::Invalid R2 identity evidence bucket name."; exit 1; }
          [[ "$R2_MEDIA_BUCKET" != "$R2_METADATA_BUCKET" && "$R2_IDENTITY_BUCKET" != "$R2_MEDIA_BUCKET" && "$R2_IDENTITY_BUCKET" != "$R2_METADATA_BUCKET" && "$R2_MEDIA_BUCKET" != "testagram-production-backups" && "$R2_METADATA_BUCKET" != "testagram-production-backups" && "$R2_IDENTITY_BUCKET" != "testagram-production-backups" ]] || { echo "::error::R2 media, metadata, identity evidence and backup buckets must be distinct."; exit 1; }
          if [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::add-mask::$CLOUDFLARE_API_TOKEN"
            status="$(curl -sS --connect-timeout 5 --max-time 30 -o "$RUNNER_TEMP/r2-media-buckets.json" -w '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
            if [[ "$status" == "200" ]]; then
              ensure_bucket() {
                local bucket="$1" create_status
                if jq -e --arg name "$bucket" '.result.buckets[]? | select(.name == $name)' "$RUNNER_TEMP/r2-media-buckets.json" >/dev/null; then
                  echo "R2 bucket already exists: $bucket"
                  return
                fi
                create_status="$(curl -sS --connect-timeout 5 --max-time 30 -o "$RUNNER_TEMP/r2-create.json" -w '%{http_code}' \
                  -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
                  --data "$(jq -nc --arg name "$bucket" '{name:$name,locationHint:"apac"}')" \
                  "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
                if [[ "$create_status" == "200" ]] && jq -e '.success == true' "$RUNNER_TEMP/r2-create.json" >/dev/null; then
                  echo "Created R2 bucket: $bucket"
                  return
                fi
                echo "Cloudflare API could not create $bucket; falling back to the existing S3 key pair."
                jq -c '{success,errors:[.errors[]? | {code,message}]}' "$RUNNER_TEMP/r2-create.json" || true
                return 1
              }
              if ensure_bucket "$R2_MEDIA_BUCKET" && ensure_bucket "$R2_METADATA_BUCKET" && ensure_bucket "$R2_IDENTITY_BUCKET"; then
                echo "media_bucket=$R2_MEDIA_BUCKET" >> "$GITHUB_OUTPUT"
                echo "metadata_bucket=$R2_METADATA_BUCKET" >> "$GITHUB_OUTPUT"
                echo "identity_evidence_bucket=$R2_IDENTITY_BUCKET" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "Cloudflare R2 bucket listing returned HTTP $status; trying bucket creation permission before S3 fallback."
              for bucket in "$R2_MEDIA_BUCKET" "$R2_METADATA_BUCKET" "$R2_IDENTITY_BUCKET"; do
                create_status="$(curl -sS --connect-timeout 5 --max-time 30 -o "$RUNNER_TEMP/r2-create.json" -w '%{http_code}' \
                  -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
                  --data "$(jq -nc --arg name "$bucket" '{name:$name,locationHint:"apac"}')" \
                  "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
                if [[ "$create_status" == "200" ]] && jq -e '.success == true' "$RUNNER_TEMP/r2-create.json" >/dev/null; then
                  echo "Created R2 bucket through Cloudflare API: $bucket"
                else
                  jq -c '{success,errors:[.errors[]? | {code,message}]}' "$RUNNER_TEMP/r2-create.json" || true
                fi
              done
              jq -c '{success,errors:[.errors[]? | {code,message}]}' "$RUNNER_TEMP/r2-media-buckets.json" || true
            fi
          fi
          docker run --rm --entrypoint /bin/sh \
            -e R2_ENDPOINT="$R2_ENDPOINT" -e R2_REGION="$R2_REGION" \
            -e R2_MEDIA_BUCKET="$R2_MEDIA_BUCKET" -e R2_METADATA_BUCKET="$R2_METADATA_BUCKET" -e R2_IDENTITY_BUCKET="$R2_IDENTITY_BUCKET" \
            -e R2_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" -e R2_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" \
            ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z -ec '
              mc alias set r2 "$R2_ENDPOINT" "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" --api S3v4 --path auto >/dev/null
              mc mb --ignore-existing "r2/$R2_MEDIA_BUCKET"
              mc mb --ignore-existing "r2/$R2_METADATA_BUCKET"
              mc mb --ignore-existing "r2/$R2_IDENTITY_BUCKET"
              mc stat "r2/$R2_IDENTITY_BUCKET" >/dev/null
            '
          # R2 does not implement S3 GetBucketPolicy. Use Cloudflare's native
          # public-access controls and verify both public access surfaces.
          # Use Python's standard HTTP/1.1 client to isolate the request from curl's
          # command-line/body handling. urllib computes Content-Length from the exact
          # UTF-8 JSON bytes and sends the documented PUT with explicit JSON headers.
          : "${CLOUDFLARE_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          : "${R2_IDENTITY_BUCKET:?R2_IDENTITY_BUCKET is required}"
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          r2_managed_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_IDENTITY_BUCKET/domains/managed"
          managed_response="$RUNNER_TEMP/r2-managed-disable.json"
          managed_status_file="$RUNNER_TEMP/r2-managed-disable.status"
          python3 - "$r2_managed_url" "$managed_response" "$managed_status_file" <<'PY'
          import json
          import os
          import pathlib
          import sys
          import urllib.error
          import urllib.request

          url, response_path, status_path = sys.argv[1:]
          api_token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          if not api_token or not api_token.isascii() or any(ord(char) < 33 or ord(char) > 126 for char in api_token):
              raise SystemExit("Cloudflare API token contains invalid header characters.")
          body = json.dumps({"enabled": False}, separators=(",", ":")).encode("utf-8")
          if body != b'{"enabled":false}':
              raise SystemExit("Unexpected R2 managed-domain JSON serialization.")
          request = urllib.request.Request(
              url,
              data=body,
              headers={
                  "Authorization": f"Bearer {api_token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="PUT",
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  status, response_body = response.status, response.read()
          except urllib.error.HTTPError as error:
              status, response_body = error.code, error.read()
          pathlib.Path(response_path).write_bytes(response_body)
          pathlib.Path(status_path).write_text(str(status), encoding="ascii")
          print(f"Cloudflare R2 managed-domain update: HTTP {status}; JSON body bytes={len(body)}.")
          PY
          managed_status="$(cat "$managed_status_file")"
          if [[ "$managed_status" != "200" ]] ||
             ! jq -e '.success == true and .result.enabled == false' "$managed_response" >/dev/null; then
            echo "::error::Could not disable R2 r2.dev public access for the identity-evidence bucket (HTTP $managed_status)."
            jq -c '{success,errors,result}' "$managed_response" || true
            exit 1
          fi
          managed_check_status="$(curl -sS --connect-timeout 5 --max-time 20 -o "$RUNNER_TEMP/r2-managed-check.json" -w '%{http_code}' "$r2_managed_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if [[ "$managed_check_status" != "200" ]] || ! jq -e '.success == true and .result.enabled == false' "$RUNNER_TEMP/r2-managed-check.json" >/dev/null; then
            echo "::error::R2 r2.dev public access is not verified disabled."
            jq -c '{success,errors,result}' "$RUNNER_TEMP/r2-managed-check.json" || true
            exit 1
          fi
          custom_domains_status="$(curl -sS --connect-timeout 5 --max-time 20 -o "$RUNNER_TEMP/r2-custom-domains.json" -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_IDENTITY_BUCKET/domains/custom" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if [[ "$custom_domains_status" != "200" ]] || ! jq -e '.success == true and ([.result.domains[]? | select(.enabled == true)] | length == 0)' "$RUNNER_TEMP/r2-custom-domains.json" >/dev/null; then
            echo "::error::R2 identity-evidence bucket has an enabled public custom domain or its domain state cannot be verified."
            jq -c '{success,errors,result}' "$RUNNER_TEMP/r2-custom-domains.json" || true
            exit 1
          fi
          echo "Verified R2 identity-evidence bucket has r2.dev disabled and no enabled public custom domains."
          echo "media_bucket=$R2_MEDIA_BUCKET" >> "$GITHUB_OUTPUT"
          echo "metadata_bucket=$R2_METADATA_BUCKET" >> "$GITHUB_OUTPUT"

      - name: Provision dedicated private B2 identity-evidence bucket
        if: steps.media-gates.outputs.media_enabled == 'true'
        env:
          DATA_CENTRE_MEDIA_ENABLED: ${{ vars.DATA_CENTRE_MEDIA_ENABLED || 'false' }}
          FRESH_MEDIA_ENABLED: ${{ vars.FRESH_MEDIA_ENABLED || 'false' }}
          B2_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_S3_REGION }}
          B2_BUCKET: ${{ vars.B2_S3_IDENTITY_EVIDENCE_PRIVATE_BUCKET || 'testagram-identity-evidence-production-b2' }}
          B2_MEDIA_BUCKET: ${{ vars.B2_S3_PRIVATE_BUCKET || secrets.B2_S3_BUCKET }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID || secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY || secrets.B2_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          normalize_flag() { printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]'; }
          B2_ACCESS_KEY_ID="$(printf '%s' "$B2_ACCESS_KEY_ID" | tr -d '\r\n[:space:]')"
          B2_SECRET_ACCESS_KEY="$(printf '%s' "$B2_SECRET_ACCESS_KEY" | tr -d '\r\n[:space:]')"
          echo "B2 S3 access key ID length after whitespace normalization: ${#B2_ACCESS_KEY_ID}"
          if [[ ${#B2_ACCESS_KEY_ID} -ne 25 ]]; then
            echo "::error::The Backblaze B2 application key ID must be 25 characters. Do not use a Cloudflare R2 access key ID for B2."
            exit 1
          fi
          if [[ ${#B2_SECRET_ACCESS_KEY} -lt 30 ]]; then
            echo "::error::The Backblaze B2 application key is too short; verify the B2_APPLICATION_KEY secret."
            exit 1
          fi
          dc_media_enabled="$(normalize_flag "$DATA_CENTRE_MEDIA_ENABLED")"
          fresh_gate_enabled="$(normalize_flag "$FRESH_MEDIA_ENABLED")"
          [[ "$dc_media_enabled" == "true" && "$fresh_gate_enabled" == "true" ]] || { echo "::error::Internal workflow error: B2 provisioning ran without both media gates."; exit 1; }
          [[ -n "$B2_ENDPOINT" && -n "$B2_REGION" && -n "$B2_ACCESS_KEY_ID" && -n "$B2_SECRET_ACCESS_KEY" ]] || { echo "::error::Existing B2 endpoint, region and access key pair are required for the private identity-evidence bucket."; exit 1; }
          [[ "$B2_BUCKET" =~ ^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$ ]] || { echo "::error::Invalid B2 identity-evidence bucket name."; exit 1; }
          [[ -n "$B2_MEDIA_BUCKET" && "$B2_BUCKET" != "$B2_MEDIA_BUCKET" && "$B2_BUCKET" != "testagram-production-backups" ]] || { echo "::error::Identity evidence must use a dedicated bucket, separate from media and backups."; exit 1; }
          docker run --rm --entrypoint /bin/sh \
            -e B2_ENDPOINT="$B2_ENDPOINT" -e B2_REGION="$B2_REGION" -e B2_BUCKET="$B2_BUCKET" \
            -e B2_ACCESS_KEY_ID="$B2_ACCESS_KEY_ID" -e B2_SECRET_ACCESS_KEY="$B2_SECRET_ACCESS_KEY" \
            ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z -ec '
              mc alias set b2 "$B2_ENDPOINT" "$B2_ACCESS_KEY_ID" "$B2_SECRET_ACCESS_KEY" --api S3v4 --path auto >/dev/null
              mc mb --ignore-existing "b2/$B2_BUCKET"
              mc stat "b2/$B2_BUCKET" >/dev/null
            '
          # Backblaze B2 exposes bucket privacy through S3 ACLs, not the
          # bucket-policy API used by MinIO's anonymous-policy command.
          command -v aws >/dev/null 2>&1 || { echo "::error::AWS CLI is required to set and verify the B2 private bucket ACL."; exit 1; }
          export AWS_ACCESS_KEY_ID="$B2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$B2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION="$B2_REGION" AWS_EC2_METADATA_DISABLED=true
          aws s3api put-bucket-acl --bucket "$B2_BUCKET" --acl private --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION"
          aws s3api get-bucket-acl --bucket "$B2_BUCKET" --endpoint-url "$B2_ENDPOINT" --region "$B2_REGION" > "$RUNNER_TEMP/b2-identity-evidence-acl.json"
          jq -e '(.Grants | length == 1) and .Grants[0].Permission == "FULL_CONTROL" and .Grants[0].Grantee.Type == "CanonicalUser"' "$RUNNER_TEMP/b2-identity-evidence-acl.json" >/dev/null || { echo "::error::B2 identity-evidence bucket ACL is not private."; jq -c '{Owner,Grants}' "$RUNNER_TEMP/b2-identity-evidence-acl.json" || true; exit 1; }
          echo "Verified B2 identity-evidence bucket ACL is private."

      - name: Start deployment on the machine
        id: remote
        env:
          MACHINE_ID: ${{ steps.machine.outputs.machine_id }}
          # Immutable Flutter native-signup build a14a004c; published and smoke-tested by run 45251379507.
          TESTAGRAM_WEB_IMAGE: ghcr.io/trendyzima/testagram-web@sha256:b79c3895343d1fc6518cdcba9ddff236b6375c90676663f6b9e4f391bde7671f
          DATA_CENTRE_MEDIA_ENABLED: ${{ vars.DATA_CENTRE_MEDIA_ENABLED || 'false' }}
          FRESH_MEDIA_ENABLED: ${{ vars.FRESH_MEDIA_ENABLED || 'false' }}
          # The legacy Backend multi-bucket replicator is not the canonical media path.
          # Data Centre media owns the B2/R2 bytes and MinIO/R2 metadata sidecars.
          MEDIA_REPLICATION_ENABLED: 'false'
          CONFIRM_NATIVE_IDENTITY_MIGRATIONS: ${{ (github.event_name == 'push' || inputs.confirm_native_identity_migrations == true) && 'APPLY-NATIVE-IDENTITY-MIGRATIONS' || '' }}
          TESTAGRAM_TERMS_VERSION: ${{ vars.TESTAGRAM_TERMS_VERSION || '2026-11-11' }}
          TESTAGRAM_PRIVACY_VERSION: ${{ vars.TESTAGRAM_PRIVACY_VERSION || '2026-11-11' }}
          TESTAGRAM_AUTH_JWT_SECRET: ${{ secrets.TESTAGRAM_AUTH_JWT_SECRET }}
          TESTAGRAM_EDGE_PROXY_SHARED_TOKEN: ${{ secrets.TESTAGRAM_EDGE_PROXY_SHARED_TOKEN }}
          AUTH_PUBLIC_BASE_URL: ${{ vars.AUTH_PUBLIC_BASE_URL || 'https://testagram.site' }}
          CLOUDFLARE_EMAIL_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTH_FROM_EMAIL: ${{ vars.TESTAGRAM_MAIL_FROM || 'no-reply@testagram.site' }}
          TESTAGRAM_MAIL_ENCRYPTION_KEY: ${{ secrets.TESTAGRAM_MAIL_ENCRYPTION_KEY }}
          TESTAGRAM_CLOUDFLARE_EVENTS_TOKEN: ${{ secrets.TESTAGRAM_CLOUDFLARE_EVENTS_TOKEN }}
          MEDIA_MODERATION_TOKEN: ${{ secrets.MEDIA_MODERATION_TOKEN }}
          MPESA_ENV: ${{ vars.MPESA_ENV }}
          MPESA_SHORTCODE: ${{ secrets.MPESA_SHORTCODE }}
          MPESA_PASSKEY: ${{ secrets.MPESA_PASSKEY }}
          MPESA_CONSUMER_KEY: ${{ secrets.MPESA_CONSUMER_KEY }}
          MPESA_CONSUMER_SECRET: ${{ secrets.MPESA_CONSUMER_SECRET }}
          MPESA_CALLBACK_URL: ${{ vars.MPESA_CALLBACK_URL }}
          ADMIN_SERVICE_AUTH_KEY: ${{ secrets.ADMIN_SERVICE_AUTH_KEY }}
          B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
          B2_S3_REGION: ${{ secrets.B2_S3_REGION }}
          B2_S3_BUCKET: ${{ vars.B2_S3_PRIVATE_BUCKET || secrets.B2_S3_BUCKET }}
          B2_S3_PRIVATE_BUCKET: ${{ vars.B2_S3_PRIVATE_BUCKET || secrets.B2_S3_BUCKET }}
          B2_S3_PUBLIC_BUCKET: ${{ vars.B2_S3_PUBLIC_BUCKET }}
          B2_S3_IDENTITY_EVIDENCE_PRIVATE_BUCKET: ${{ vars.B2_S3_IDENTITY_EVIDENCE_PRIVATE_BUCKET || 'testagram-identity-evidence-production-b2' }}
          B2_S3_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID || secrets.B2_ACCESS_KEY_ID }}
          B2_S3_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY || secrets.B2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_ENDPOINT: ${{ vars.CLOUDFLARE_R2_ENDPOINT || secrets.TESTAGRAM_BACKUP_S3_ENDPOINT }}
          CLOUDFLARE_R2_REGION: ${{ vars.CLOUDFLARE_R2_REGION || 'auto' }}
          CLOUDFLARE_R2_BUCKET: ${{ steps.r2-media-buckets.outputs.media_bucket || vars.CLOUDFLARE_R2_PRIVATE_BUCKET || 'testagram-media-production-r2' }}
          CLOUDFLARE_R2_PRIVATE_BUCKET: ${{ steps.r2-media-buckets.outputs.media_bucket || vars.CLOUDFLARE_R2_PRIVATE_BUCKET || 'testagram-media-production-r2' }}
          CLOUDFLARE_R2_METADATA_BUCKET: ${{ steps.r2-media-buckets.outputs.metadata_bucket || vars.CLOUDFLARE_R2_METADATA_BUCKET || 'testagram-media-production-metadata' }}
          CLOUDFLARE_R2_PUBLIC_BUCKET: ${{ vars.CLOUDFLARE_R2_PUBLIC_BUCKET }}
          CLOUDFLARE_R2_IDENTITY_EVIDENCE_PRIVATE_BUCKET: ${{ steps.r2-media-buckets.outputs.identity_evidence_bucket || vars.CLOUDFLARE_R2_IDENTITY_EVIDENCE_PRIVATE_BUCKET || 'testagram-identity-evidence-production-r2' }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID || secrets.TESTAGRAM_BACKUP_S3_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY || secrets.TESTAGRAM_BACKUP_S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: bash scripts/start-instabox-deployment.sh
      - name: Wait for deployment and report logs
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          cmd='ROOT=/data/home/testagram; tail -n 45 "$ROOT/deploy.log" 2>/dev/null || true'
          payload="$(jq -nc --arg cmd "$cmd" '{cmd:$cmd,timeoutSeconds:60}')"
          for attempt in $(seq 1 90); do
            # InstaBox may briefly be unreachable while the machine starts.
            # A failed log poll must not abort an otherwise running deployment.
            if ! result="$(curl --silent --show-error --fail --connect-timeout 8 --max-time 20 \
              -X POST -H "X-API-Key: $INSTABOX_API_KEY" \
              -H "Content-Type: application/json" -d "$payload" \
              "$API/v1/machines/$MACHINE_ID/exec" 2>"$RUNNER_TEMP/instabox-poll-curl.err")"; then
              echo "::warning::InstaBox control plane is temporarily unreachable while polling deployment logs (attempt $attempt/90); retrying."
              if [[ -s "$RUNNER_TEMP/instabox-poll-curl.err" ]]; then
                sed -n '1,2p' "$RUNNER_TEMP/instabox-poll-curl.err"
              fi
              sleep 25
              continue
            fi
            if ! jq -e 'type == "object" and has("exitCode")' <<<"$result" >/dev/null 2>&1; then
              echo "::warning::InstaBox returned a non-execution response while polling deployment logs (attempt $attempt/90); retrying."
              sleep 25
              continue
            fi
            exec_code="$(jq -r '.exitCode // 1' <<<"$result")"
            output="$(jq -r '.stdout // empty' <<<"$result")"
            if [[ "$exec_code" != "0" ]]; then
              echo "::error::Could not read the remote deployment log after a successful InstaBox API response."
              jq -r '.stderr // empty' <<<"$result"
              exit 1
            fi
            echo "$output"
            if grep -q 'DEPLOY_EXIT=0' <<<"$output"; then
              exit 0
            fi
            if grep -q 'DEPLOY_EXIT=' <<<"$output"; then
              echo "::error::Remote deployment failed. Review the machine deployment log."
              exit 1
            fi
            sleep 25
          done
          echo "::error::Deployment exceeded the wait window. The remote log remains at /data/home/testagram/deploy.log."
          exit 1

      - name: Verify all deployed service health
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          cmd="$(cat <<'REMOTE_HEALTH_CHECK'
          set -euo pipefail
          ROOT=/data/home/testagram
          BASE_ENV="$ROOT/repos/backend/deploy/self-hosted/.env"
          COMPOSE_FILE="$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml"
          sudo docker exec testagram-self-hosted-caddy-1 caddy validate --config /etc/caddy/Caddyfile
          sudo docker compose --env-file "$BASE_ENV" -f "$COMPOSE_FILE" up -d --force-recreate caddy
          caddy_ready=false
          for attempt in $(seq 1 36); do
            if sudo docker exec testagram-self-hosted-caddy-1 wget -q -O /dev/null http://127.0.0.1:8443/_testagram/edge-health; then
              caddy_ready=true
              break
            fi
            sleep 5
          done
          if [[ "$caddy_ready" != true ]]; then
            sudo docker logs --tail=100 testagram-self-hosted-caddy-1 2>&1 || true
            echo "Caddy did not load the validated apex health route after recreation." >&2
            exit 1
          fi
          containers=(testagram-self-hosted-postgres-1 testagram-self-hosted-control-plane-1 testagram-self-hosted-api-1 testagram-self-hosted-admin-console-1 testagram-self-hosted-object-storage-1 testagram-self-hosted-media-cache-1 testagram-self-hosted-caddy-1 testagram-self-hosted-prometheus-1 testagram-data-centre-algorithm-1 testagram-data-centre-federation-api-1 testagram-data-centre-platform-1 testagram-data-centre-notification-1 testagram-data-centre-video-1 testagram-data-centre-video-worker-1 testagram-data-centre-worker-1)
          if [[ -f /data/home/testagram/media-enabled.txt ]] && grep -qx true /data/home/testagram/media-enabled.txt; then
            containers+=(testagram-data-centre-media-1)
          fi
          for container in "${containers[@]}"; do
            ready=false
            status=missing
            for attempt in $(seq 1 36); do
              status="$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || echo missing)"
              if [[ "$status" == healthy || "$status" == running ]]; then ready=true; break; fi
              if [[ "$status" == missing || "$status" == exited || "$status" == dead || "$status" == unhealthy ]]; then break; fi
              sleep 5
            done
            echo "$container: $status"
            if [[ "$ready" != true ]]; then
              sudo docker logs --tail=100 "$container" 2>&1 || true
              exit 1
            fi
          done
          minio_id="$(sudo docker ps -q --filter name=testagram-self-hosted-object-storage-1 | head -n 1)"
          if [[ -z "$minio_id" ]]; then
            echo "MinIO container is missing." >&2
            exit 1
          fi
          bindings="$(sudo docker inspect --format '{{json .HostConfig.PortBindings}}' "$minio_id")"
          if ! jq -e '."9000/tcp" | length == 1 and .[0].HostIp == "127.0.0.1"' <<<"$bindings" >/dev/null; then
            echo "MinIO S3 port 9000 is not restricted to the VPS loopback interface." >&2
            exit 1
          fi
          if jq -e '."9001/tcp" // [] | length > 0' <<<"$bindings" >/dev/null; then
            echo "MinIO console port 9001 must not be published on the VPS host." >&2
            exit 1
          fi
          echo "MinIO verified private: S3 bound only to 127.0.0.1; console unpublished."
          REMOTE_HEALTH_CHECK
          )"
          payload="$(jq -nc --arg cmd "$cmd" '{cmd:$cmd,timeoutSeconds:180}')"
          result="$(curl -fsS -X POST -H "X-API-Key: $INSTABOX_API_KEY" \
            -H "Content-Type: application/json" -d "$payload" \
            "$API/v1/machines/$MACHINE_ID/exec")"
          code="$(jq -r '.exitCode // 1' <<<"$result")"
          if [[ "$code" != "0" ]]; then
            echo "::error::One or more deployed Testagram services are not healthy."
            jq -r '.stderr // empty, .stdout // empty' <<<"$result"
            exit 1
          fi
          jq -r '.stdout // empty' <<<"$result"

      - name: Publish the Backend API over HTTPS
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          port_agent_status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines/$MACHINE_ID/port-agent")"
          if [[ "$port_agent_status" != "204" ]]; then
            echo "::error::Could not install InstaBox public-port agent (HTTP $port_agent_status)."
            exit 1
          fi
          body='{"port":8080,"name":"testagram-api","protocol":"http","access":"public"}'
          published="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS -X POST \
            -H "X-API-Key: $INSTABOX_API_KEY" \
            -H "Content-Type: application/json" -d "$body" \
            "$API/v1/machines/$MACHINE_ID/ports")"
          url="$(jq -r '.url // empty' <<<"$published")"
          if [[ -z "$url" ]]; then
            echo "::error::InstaBox did not return a public HTTPS URL for port 8080."
            jq -c '.error // .' <<<"$published"
            exit 1
          fi
          echo "api_url=$url" >> "$GITHUB_OUTPUT"
          echo "Testagram API URL: $url"

      - name: Publish Go CDN media endpoint over HTTPS
        id: publish_cdn
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          body='{"port":8081,"name":"testagram-cdn","protocol":"http","access":"public"}'
          published="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS -X POST \
            -H "X-API-Key: $INSTABOX_API_KEY" \
            -H "Content-Type: application/json" -d "$body" \
            "$API/v1/machines/$MACHINE_ID/ports")"
          url="$(jq -r '.url // empty' <<<"$published")"
          if [[ -z "$url" || "$url" != https://* ]]; then
            echo "::error::InstaBox did not return a valid HTTPS URL for the Go CDN port."
            jq -c '.error // .' <<<"$published"
            exit 1
          fi
          echo "cdn_url=$url" >> "$GITHUB_OUTPUT"
          echo "Go CDN URL: $url"

      - name: Publish the apex federation edge over HTTPS
        id: publish_apex
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          body='{"port":8443,"name":"testagram-apex-edge","protocol":"http","access":"public"}'
          published="$(curl --retry 3 --retry-all-errors --retry-delay 2 -fsS -X POST -H "X-API-Key: $INSTABOX_API_KEY" -H "Content-Type: application/json" -d "$body" "$API/v1/machines/$MACHINE_ID/ports")"
          url="$(jq -r '.url // empty' <<<"$published")"
          if [[ -z "$url" || "$url" != https://* ]]; then echo "::error::InstaBox did not return a valid HTTPS URL for the apex federation edge."; jq -c '.error // .' <<<"$published"; exit 1; fi
          health="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/apex-health.json -w '%{http_code}' "$url/_testagram/edge-health" || true)"
          if [[ "$health" != "200" ]] || ! jq -e '.ok == true and .service == "testagram-apex-edge"' /tmp/apex-health.json >/dev/null; then echo "::error::Apex Caddy ingress health check failed (HTTP $health)."; cat /tmp/apex-health.json 2>/dev/null || true; exit 1; fi
          root_status="$(curl -sS --connect-timeout 5 --max-time 20 -D /tmp/apex-root.headers -o /dev/null -w '%{http_code}' "$url/" || true)"
          if [[ "$root_status" != "308" ]] || ! grep -Fqi 'https://www.testagram.site' /tmp/apex-root.headers; then echo "::error::Apex root did not redirect to www (HTTP $root_status)."; cat /tmp/apex-root.headers; exit 1; fi
          webfinger_status="$(curl -sS --connect-timeout 5 --max-time 20 -o /tmp/apex-webfinger.json -w '%{http_code}' "$url/.well-known/webfinger?resource=acct:nonexistent-probe@invalid.testagram.site" || true)"
          case "$webfinger_status" in 503) ;; *) echo "::error::Apex WebFinger must remain closed pending G3 (expected HTTP 503, got $webfinger_status)."; cat /tmp/apex-webfinger.json 2>/dev/null || true; exit 1 ;; esac
          echo "apex_url=$url" >> "$GITHUB_OUTPUT"
          echo "Apex Caddy ingress passed health, www redirect and G3-closed WebFinger gate: $url"

      - name: Configure public CDN URL and restart Backend and Go CDN
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.instabox.sh"
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          API_ORIGIN="${{ steps.publish.outputs.api_url }}"
          CDN_URL="${{ steps.publish_cdn.outputs.cdn_url }}"
          cmd='set -euo pipefail; API_ORIGIN="${API_ORIGIN%/}"; CDN_ORIGIN="${CDN_URL%/}"; curl -fsS "$API_ORIGIN/healthz" | grep -q testagram-api; curl -fsS "$CDN_ORIGIN/healthz" | grep -q testagram-cdn; ROOT=/data/home/testagram; BASE_ENV="$ROOT/repos/backend/deploy/self-hosted/.env"; upsert_env(){ key="$1"; value="$2"; if grep -q "^${key}=" "$BASE_ENV"; then sed -i "s|^${key}=.*|${key}=${value}|" "$BASE_ENV"; else printf "%s=%s\n" "$key" "$value" >> "$BASE_ENV"; fi; }; PUBLIC_CDN_URL="https://media.testagram.site"; upsert_env MINIO_PUBLIC_ENDPOINT "http://object-storage:9000"; upsert_env CDN_MEDIA_BASE_URL "$PUBLIC_CDN_URL"; upsert_env MEDIA_PUBLIC_BASE_URL "$PUBLIC_CDN_URL/v1"; sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" up -d --force-recreate media-cache api; for attempt in $(seq 1 36); do if sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" exec -T media-cache /app/healthcheck && sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" exec -T api wget -q -O /dev/null http://127.0.0.1:8082/readyz; then break; fi; sleep 5; done; cdn_container="$(sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" ps -q media-cache)"; api_container="$(sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" ps -q api)"; check_env(){ container="$1"; key="$2"; expected="$3"; if ! sudo docker inspect --format "{{range .Config.Env}}{{println .}}{{end}}" "$container" | grep -Fqx -- "$key=$expected"; then echo "Runtime env mismatch: $key" >&2; exit 1; fi; }; expected_purge="$(sed -n "s/^CDN_PURGE_TOKEN=//p" "$BASE_ENV" | tail -n 1)"; check_env "$cdn_container" PUBLIC_BASE_URL "$PUBLIC_CDN_URL"; check_env "$cdn_container" PURGE_TOKEN "$expected_purge"; check_env "$api_container" CDN_MEDIA_BASE_URL "$PUBLIC_CDN_URL"; check_env "$api_container" MEDIA_PUBLIC_BASE_URL "$PUBLIC_CDN_URL/v1"; check_env "$api_container" CDN_PURGE_URL "http://media-cache:8081/api/cache/purge"; check_env "$api_container" CDN_PURGE_TOKEN "$expected_purge"; sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" exec -T media-cache /app/healthcheck; sudo docker compose --env-file "$BASE_ENV" -f "$ROOT/repos/backend/deploy/self-hosted/docker-compose.yml" exec -T api wget -q -O /dev/null http://127.0.0.1:8082/readyz'
          payload="$(jq -nc --arg cmd "$cmd" --arg api "$API_ORIGIN" --arg cdn "$CDN_URL" '{cmd:$cmd,envs:{API_ORIGIN:$api,CDN_URL:$cdn},timeoutSeconds:240}')"
          result="$(curl -fsS -X POST -H "X-API-Key: $INSTABOX_API_KEY" \
            -H "Content-Type: application/json" -d "$payload" \
            "$API/v1/machines/$MACHINE_ID/exec")"
          code="$(jq -r '.exitCode // 1' <<<"$result")"
          if [[ "$code" != "0" ]]; then
            echo "::error::Could not apply the public media URL to the backend."
            jq -r '.stderr // empty' <<<"$result"
            exit 1
          fi
          echo "Backend and Go CDN now publish media URLs on https://media.testagram.site; the private InstaBox CDN origin remains an upstream only."

      - name: Verify public API liveness and private endpoint isolation
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.publish.outputs.api_url }}"
          CDN_URL="${{ steps.publish_cdn.outputs.cdn_url }}"
          for attempt in $(seq 1 30); do
            api_status="$(curl -sS --connect-timeout 5 --max-time 10 -D /tmp/api-health.headers -o /tmp/api-health.json -w '%{http_code}' "$URL/healthz" || true)"
            if [[ "$api_status" == "200" ]] && grep -Eiq '^x-testagram-service:[[:space:]]*testagram-api[[:space:]]*$' /tmp/api-health.headers && jq -e '.ok == true and .service == "testagram-api"' /tmp/api-health.json >/dev/null && curl -fsS "$CDN_URL/healthz" >/tmp/cdn-health.json && grep -q '"service":"testagram-cdn"' /tmp/cdn-health.json; then
              for path in /readyz /metrics; do
                status="$(curl -sS -o /dev/null -w '%{http_code}' "$URL$path" || true)"
                if [[ "$status" != "404" ]]; then
                  echo "::error::Internal Backend endpoint $path is exposed on the public API listener (HTTP $status)."
                  exit 1
                fi
              done
              for path in /readyz /metrics; do
                status="$(curl -sS -o /dev/null -w '%{http_code}' "$CDN_URL$path" || true)"
                if [[ "$status" != "404" ]]; then
                  echo "::error::Internal Go CDN endpoint $path is exposed on the public CDN listener (HTTP $status)."
                  exit 1
                fi
              done
              # The internal TV monitor depends on these handlers being present in
              # the exact Backend binary just deployed. No token must be rejected
              # with 401; 404 means a stale binary or incorrect router is live.
              for route in /internal/tv/catalog /internal/tv/health; do
                if [[ "$route" == "/internal/tv/catalog" ]]; then
                  route_status="$(curl -sS -o /dev/null -w '%{http_code}' "$URL$route" || true)"
                else
                  route_status="$(curl -sS -X POST -H 'Content-Type: application/json' -d '{"channels":[]}' -o /dev/null -w '%{http_code}' "$URL$route" || true)"
                fi
                if [[ "$route_status" != "401" ]]; then
                  echo "::error::Expected unauthenticated internal TV route $route to reject with HTTP 401; got HTTP $route_status. Check deployed Backend image and router before declaring release ready."
                  exit 1
                fi
              done
              private_status="$(curl -sS -o /dev/null -w '%{http_code}' "$CDN_URL/v1/users/cdn-smoke/0123456789abcdef0123456789abcdef")"
              case "$private_status" in 401|403|404) ;; *) echo "::error::Unauthenticated media request returned unsafe HTTP $private_status"; exit 1 ;; esac
              echo "Testagram API and pinned Go CDN are reachable; MinIO remains private behind the backend/CDN and unauthenticated media denial passed."
              exit 0
            fi
            sleep 10
          done
          echo "::error::The published API or Go CDN did not pass HTTPS health/readiness checks."
          exit 1

      - name: Canonical hostname verification handoff
        shell: bash
        run: |
          echo "Backend, Go CDN and apex Caddy origins passed direct health/readiness checks."
          echo "Run the CDN repository canonical Cloudflare routing workflow with API, Go CDN and apex origins from this deployment summary."
          echo "The apex origin keeps ActivityPub/WebFinger fail-closed until G3 acceptance and redirects ordinary web traffic to www.testagram.site; Backend readiness remains private."

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          echo "### Testagram deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Machine: ${{ steps.machine.outputs.machine_id || 'not resolved' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- API URL: ${{ steps.publish.outputs.api_url || 'not published' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Go CDN URL: ${{ steps.publish_cdn.outputs.cdn_url || 'not published' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apex federation edge URL: ${{ steps.publish_apex.outputs.apex_url || 'not published' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Apex edge: port 8443; ActivityPub/WebFinger return 503 until G3 acceptance; canonical www redirect" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend and Go CDN: public /healthz; private /readyz and /metrics on Docker-only port 8082" >> "$GITHUB_STEP_SUMMARY"
          echo "- Federation delivery workers remain disabled by design." >> "$GITHUB_STEP_SUMMARY"

  accept-web-authentication:
    name: Verify production www serves native account creation
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the live Cloudflare-facing www route and signup deep link
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          api_response="$tmp/signup-probe.json"
          api_headers="$tmp/signup-probe.headers"
          api_status="$(curl --silent --show-error --max-time 20 -D "$api_headers" -o "$api_response" -w '%{http_code}' -X POST \
            "https://api.testagram.site/api/auth/signup" \
            -H 'Content-Type: application/json' \
            --data-binary '{"email":"signup-probe@example.invalid","username":"signup_probe","password":"short"}')"
          api_error="$(jq -r '.error.code // empty' "$api_response" 2>/dev/null || true)"
          if [[ "$api_status" != "400" || "$api_error" != "INVALID_PASSWORD" ]]; then
            echo "::error::Production native signup API did not reach password validation (HTTP $api_status, code=$api_error). No account was created."
            exit 1
          fi
          base="https://www.testagram.site"
          for path in "/" "/?mode=signup"; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
              -H 'Cache-Control: no-cache' "$base$path" -o "$tmp/page.html"
            grep -Fq 'flutter_bootstrap.js' "$tmp/page.html" || {
              echo "::error::The live www route did not serve the Flutter application shell for $path."
              exit 1
            }
          done
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 30 \
            -H 'Cache-Control: no-cache' "$base/flutter_bootstrap.js" -o "$tmp/flutter_bootstrap.js"
          grep -Fq 'main.dart.js' "$tmp/flutter_bootstrap.js" || {
            echo "::error::The live Flutter bootstrap does not reference main.dart.js."
            exit 1
          }
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 60 \
            -H 'Cache-Control: no-cache' "$base/main.dart.js" -o "$tmp/main.dart.js"
          for marker in 'Sign in' 'Sign up' 'Create account' 'Reset password'; do
            grep -aFq "$marker" "$tmp/main.dart.js" || {
              echo "::error::The production www Flutter bundle is missing required authentication entry: $marker"
              exit 1
            }
          done
          echo "Production www root, /?mode=signup deep link, Flutter bootstrap and native account-creation bundle markers passed." >> "$GITHUB_STEP_SUMMARY"
