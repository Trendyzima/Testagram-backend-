name: Workflow syntax validation

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate all GitHub Actions workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true
      - name: Lint every workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -ignore 'SC2034' -ignore 'SC2016' -ignore 'SC2129'
