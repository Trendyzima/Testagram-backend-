name: Instabox VPS Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Inspect provider state without issuing lifecycle actions"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: instabox-testagram-vps-watchdog
  cancel-in-progress: false

jobs:
  validate:
    name: Validate watchdog safety logic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile watchdog
        run: python3 -m py_compile scripts/instabox_watchdog.py
      - name: Run watchdog unit tests
        run: python3 -m unittest discover -s tests -p 'test_instabox_watchdog.py' -v

  watchdog:
    name: Check and recover Testagram VPS
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restore watchdog incident state
        uses: actions/cache/restore@v6
        with:
          path: .watchdog-state.json
          key: instabox-watchdog-state-${{ github.run_id }}
          restore-keys: |
            instabox-watchdog-state-
      - name: Run external Instabox watchdog
        env:
          INSTABOX_WATCHDOG_API_KEY: ${{ secrets.INSTABOX_WATCHDOG_API_KEY }}
          INSTABOX_READONLY_API_KEY: ${{ secrets.INSTABOX_READONLY_API_KEY }}
          WATCHDOG_AUTO_RECOVERY_ENABLED: ${{ vars.WATCHDOG_AUTO_RECOVERY_ENABLED || 'false' }}
          INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID }}
          INSTABOX_MACHINE_NAME: ${{ vars.INSTABOX_MACHINE_NAME || 'testagramdb' }}
          TESTAGRAM_HEALTH_URL: ${{ vars.TESTAGRAM_HEALTH_URL || 'https://api.testagram.site/healthz' }}
          WATCHDOG_ALERT_WEBHOOK: ${{ secrets.WATCHDOG_ALERT_WEBHOOK }}
          WATCHDOG_STATE_FILE: .watchdog-state.json
          # Scheduled recovery stays disabled until a restricted key is installed and explicitly enabled.
          WATCHDOG_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) || vars.WATCHDOG_AUTO_RECOVERY_ENABLED != 'true' }}
          WATCHDOG_PROBE_INTERVAL_SECONDS: "15"
          WATCHDOG_OPERATION_TIMEOUT_SECONDS: "300"
          WATCHDOG_RECOVERY_HEALTH_TIMEOUT_SECONDS: "300"
        shell: bash
        run: |
          set -euo pipefail
          case "$WATCHDOG_AUTO_RECOVERY_ENABLED" in
            true|false) ;;
            *) echo "::error::WATCHDOG_AUTO_RECOVERY_ENABLED must be true or false."; exit 1 ;;
          esac
          if [[ "$WATCHDOG_AUTO_RECOVERY_ENABLED" == "true" ]]; then
            if [[ -z "${INSTABOX_WATCHDOG_API_KEY:-}" ]]; then
              echo "::error::Automatic recovery requires the dedicated INSTABOX_WATCHDOG_API_KEY. The read-only key will not be substituted."
              exit 1
            fi
            export INSTABOX_WATCHDOG_API_KEY_HEADER=Authorization
          else
            if [[ -z "${INSTABOX_READONLY_API_KEY:-}" ]]; then
              echo "::error::Read-only watchdog inspection requires INSTABOX_READONLY_API_KEY."
              exit 1
            fi
            export INSTABOX_WATCHDOG_API_KEY="$INSTABOX_READONLY_API_KEY"
            export INSTABOX_WATCHDOG_API_KEY_HEADER=X-API-Key
          fi
          python3 scripts/instabox_watchdog.py
      - name: Ensure watchdog state file exists
        if: always()
        run: test -f .watchdog-state.json || printf '{}' > .watchdog-state.json
      - name: Persist watchdog incident state for the next scheduled run
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .watchdog-state.json
          key: instabox-watchdog-state-${{ github.run_id }}
      - name: Publish watchdog result
        if: always()
        run: |
          {
            echo "## Testagram VPS watchdog"
            echo
            echo "- Provider: Instabox"
            echo "- Machine: configured through repository variable"
            echo "- Schedule: every five minutes"
            echo "- Recovery: start only when provider state is stopped but desiredState remains running"
            echo "- Idle suspend: left to InstaBox wake-on-real-request and Paradev SSH"
            echo "- Routine monitoring: provider API only; no scheduled HTTP keepalive probes"
            echo
            echo "See the run log for provider state and any recovery verification details."
          } >> "$GITHUB_STEP_SUMMARY"
