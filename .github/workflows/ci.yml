name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Resolve and verify Go modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/api
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l cmd)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            gofmt -d cmd
            exit 1
          fi
      - name: Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password-not-for-production
          DATABASE_URL: postgres://testagram:ci-only-password-not-for-production@db:5432/testagram?sslmode=disable
        run: docker compose config --quiet
