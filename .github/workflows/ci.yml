name: Backend CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Resolve dependencies
        run: go mod tidy
      - name: Tests
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/api
      - name: Build production container
        run: docker build --pull -t testagram-backend:ci .
      - name: Format Go source
        run: gofmt -w cmd
      - name: Persist formatter changes on feature branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/')
        run: |
          if ! git diff --quiet -- cmd; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd
            git commit -m "style: format Go source"
            git push
          fi
      - name: Check formatting
        run: test -z "$(gofmt -l cmd)"
      - name: Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password-not-for-production
          DATABASE_URL: postgres://testagram:ci-only-password-not-for-production@db:5432/testagram?sslmode=disable
        run: docker compose config --quiet
