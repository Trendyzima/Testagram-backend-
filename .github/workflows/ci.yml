name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Resolve and verify Go modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/api
      - name: Check formatting across Go source
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

  platform:
    name: Platform service tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: services/platform/go.sum
      - name: Resolve and verify platform module
        run: |
          go mod tidy
          git diff --exit-code -- services/platform/go.mod services/platform/go.sum
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

  dependency-audit:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan API module
        run: govulncheck ./...
      - name: Scan platform module
        working-directory: services/platform
        run: govulncheck ./...

  compose:
    name: Self-hosted Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password-not-for-production
          DATABASE_URL: postgres://testagram:ci-only-password-not-for-production@db:5432/testagram?sslmode=disable
          PLATFORM_INTERNAL_TOKEN: ci-only-platform-token-not-for-production
          VPS_INTERNAL_TOKEN: ci-only-vps-token-not-for-production
          VPS_NODE_BOOTSTRAP_TOKEN: ci-only-node-token-not-for-production
        run: docker compose -f deploy/self-hosted/docker-compose.yml config --quiet
