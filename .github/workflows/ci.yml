name: Backend CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true
      - name: Resolve and verify Go modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/api ./admin-console
      - name: Build fresh Appwrite API container
        run: docker build -f Dockerfile.fresh -t testagram-backend-fresh-ci .
      - name: Validate fresh Backend OpenAPI contract
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python scripts/validate-fresh-openapi.py
      - name: Validate staff console JavaScript syntax
        run: node --check admin-console/web/app.js
      - name: Check formatting of changed API Go files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            mapfile -t go_files < <(git ls-files 'cmd/*.go' 'cmd/**/*.go')
          else
            mapfile -t go_files < <(git diff --name-only "${BASE_SHA}"...HEAD -- 'cmd/*.go' 'cmd/**/*.go')
          fi
          if (("${#go_files[@]}" > 0)); then
            unformatted="$(printf '%s\n' "${go_files[@]}" | xargs -r gofmt -l)"
            if [[ -n "$unformatted" ]]; then
              printf '%s\n' "$unformatted"
              printf '%s\n' "${go_files[@]}" | xargs -r gofmt -d
              exit 1
            fi
          fi

  identity-registration-schema-integration:
    name: Identity registration PostgreSQL schema integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run registration migration and invariant tests
        run: bash scripts/test-identity-registration-migration.sh

  dependency-audit:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan API module
        run: govulncheck ./...

  tv-health-schema-integration:
    name: TV health PostgreSQL migration integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name testagram-tv-health-ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec testagram-tv-health-ci pg_isready -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs testagram-tv-health-ci
          exit 1
      - name: Apply TV health migration and verify constraints
        run: |
          set -euo pipefail
          docker exec -i testagram-tv-health-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE testagram_app NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
          docker exec -i testagram-tv-health-ci psql -U postgres -v ON_ERROR_STOP=1 < migrations/20261106_tv_health_postgres.sql
          docker exec -i testagram-tv-health-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO testagram_tv.channel_health
            (channel_id,url,is_online,last_checked_at,last_online_at,consecutive_failures,consecutive_successes,latency_ms,priority)
          VALUES ('ci-channel','https://stream.example/live.m3u8',true,now(),now(),0,1,120,10);
          INSERT INTO testagram_tv.channel_health
            (channel_id,url,is_online,last_checked_at,last_online_at,consecutive_failures,consecutive_successes,latency_ms,priority)
          VALUES ('ci-channel','https://stream.example/live.m3u8',false,now(),NULL,1,0,2500,10)
          ON CONFLICT (channel_id) DO UPDATE SET
            is_online=EXCLUDED.is_online,
            last_checked_at=EXCLUDED.last_checked_at,
            last_online_at=CASE WHEN EXCLUDED.is_online THEN EXCLUDED.last_checked_at ELSE testagram_tv.channel_health.last_online_at END,
            consecutive_failures=CASE WHEN EXCLUDED.is_online THEN 0 ELSE testagram_tv.channel_health.consecutive_failures+1 END,
            consecutive_successes=CASE WHEN EXCLUDED.is_online THEN testagram_tv.channel_health.consecutive_successes+1 ELSE 0 END;
          DO $ci$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM testagram_tv.channel_health WHERE channel_id='ci-channel' AND NOT is_online AND consecutive_failures=1 AND consecutive_successes=0 AND last_online_at IS NOT NULL) THEN
              RAISE EXCEPTION 'offline health update did not preserve last online timestamp or failure streak';
            END IF;
          END $ci$;
          SQL
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop testagram-tv-health-ci || true

  social-schema-integration:
    name: Poll, thread and browsing history PostgreSQL integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name testagram-social-schema-ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec testagram-social-schema-ci pg_isready -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs testagram-social-schema-ci
          exit 1
      - name: Apply real prerequisite and social migrations
        run: |
          set -euo pipefail
          docker exec -i testagram-social-schema-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA testagram_local;
          CREATE TABLE testagram_local.accounts (
            user_id uuid PRIMARY KEY,
            username text NOT NULL DEFAULT 'ci_user',
            display_name text NOT NULL DEFAULT '',
            avatar_key text NOT NULL DEFAULT '',
            account_status text NOT NULL DEFAULT 'active'
          );
          CREATE TABLE testagram_local.posts (id uuid PRIMARY KEY, author_id uuid, visibility text NOT NULL DEFAULT 'public', media_ids jsonb NOT NULL DEFAULT '[]'::jsonb, created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now(), deleted_at timestamptz);
          CREATE TABLE testagram_local.follows (
            follower_id uuid NOT NULL,
            following_id uuid NOT NULL,
            status text NOT NULL DEFAULT 'accepted'
          );
          SQL
          for migration in \
            migrations/005_media_assets.sql \
            migrations/006_media_lifecycle.sql \
            migrations/007_media_product_bridge.sql \
            migrations/008_virtual_storage_bridge.sql \
            migrations/20261106_social_core.sql \
            migrations/20261107_federation_actor_consent.sql \
            migrations/20261108_communication_core.sql \
            migrations/20261108_testagram_polls.sql \
            migrations/20261109_threads_browsing_history.sql \
            migrations/20261109_thread_interactions.sql \
            migrations/20261109_iptv_social.sql \
            migrations/20261109_post_views.sql \
            migrations/20261110_native_media_post_links.sql \
            migrations/20261110_federation_outbox.sql \
            migrations/20261111_social_post_idempotency.sql \
            migrations/20261112_instabox_avatar_storage.sql \
            migrations/20261112_federation_remote_follows.sql \
            migrations/20261111_media_replica_ledger.sql \
            migrations/20261112_media_replication_outbox.sql \
            migrations/20261112_fresh_media_owner_keys.sql; do
            docker exec -i testagram-social-schema-ci psql -U postgres -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Verify durable media replication queue schema
        run: |
          set -euo pipefail
          docker exec -i testagram-social-schema-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $media_replication_schema$
          BEGIN
            IF to_regclass('testagram_media.storage_replicas') IS NULL
               OR to_regclass('testagram_media.media_replication_outbox') IS NULL
               OR to_regclass('testagram_media.media_replication_health') IS NULL THEN
              RAISE EXCEPTION 'Durable media replication schema is incomplete';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname='media_replication_enqueue_after_asset_write'
                AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'Canonical media completion does not enqueue replication';
            END IF;
          END $media_replication_schema$;
          INSERT INTO testagram_media.assets
            (object_key,owner_id,visibility,content_type,size_bytes,status,storage_namespace,storage_provider,checksum_sha256)
          VALUES
            ('users/ci-media-owner/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa','ci-media-owner','private','image/webp',1234,'ready','media-private','s3-default','aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa');
          DO $media_replication_enqueue$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM testagram_media.media_replication_outbox
              WHERE object_key='users/ci-media-owner/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                AND owner_id='ci-media-owner' AND storage_namespace='media-private'
                AND checksum_sha256='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                AND status='pending'
            ) THEN
              RAISE EXCEPTION 'Verified virtual-storage media insert did not enqueue a durable replication job';
            END IF;
          END $media_replication_enqueue$;
          UPDATE testagram_media.assets SET status='deleted'
          WHERE object_key='users/ci-media-owner/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';
          DO $media_replication_delete$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM testagram_media.media_replication_outbox
              WHERE object_key='users/ci-media-owner/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
                AND operation='delete' AND status='pending'
            ) THEN
              RAISE EXCEPTION 'Media deletion did not enqueue replica cleanup';
            END IF;
          END $media_replication_delete$;
          DELETE FROM testagram_media.assets
          WHERE object_key='users/ci-media-owner/aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';
          SQL
      - name: Verify media attachment, poll voting and private history constraints
        run: |
          set -euo pipefail
          docker exec -i testagram-social-schema-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $post_idempotency_schema$
          BEGIN
            IF to_regclass('testagram_local.post_create_idempotency') IS NULL THEN
              RAISE EXCEPTION 'Native social post idempotency schema migration missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_indexes
              WHERE schemaname='testagram_local'
                AND indexname='post_create_idempotency_pkey'
            ) THEN
              RAISE EXCEPTION 'Native social post idempotency uniqueness constraint missing';
            END IF;
          END $post_idempotency_schema$;
          DO $communication_schema$
          BEGIN
            IF to_regclass('testagram_local.conversations') IS NULL
              OR to_regclass('testagram_local.messages') IS NULL
              OR to_regclass('testagram_local.communication_outbox') IS NULL THEN
              RAISE EXCEPTION 'Native communication schema migration missing';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_trigger
              WHERE tgname='testagram_local_message_notifications'
                AND NOT tgisinternal
            ) THEN
              RAISE EXCEPTION 'Message notification trigger missing';
            END IF;
          END $communication_schema$;
          DO $federation_outbox$
          BEGIN
            IF to_regclass('testagram_local.federation_outbox') IS NULL THEN
              RAISE EXCEPTION 'Native PostgreSQL Federation outbox migration missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='testagram_local' AND indexname='federation_outbox_claim_idx') THEN
              RAISE EXCEPTION 'Federation outbox claim index missing';
            END IF;
          END $federation_outbox$;
          DO $remote_follows_schema$
          BEGIN
            IF to_regclass('testagram_local.remote_follows') IS NULL THEN
              RAISE EXCEPTION 'Backend canonical remote-follow migration missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_indexes WHERE schemaname='testagram_local' AND indexname='testagram_local_remote_follows_active_idx') THEN
              RAISE EXCEPTION 'Canonical remote-follow active index missing';
            END IF;
          END $remote_follows_schema$;
          INSERT INTO testagram_local.federation_outbox(activity_id,actor_user_id,payload)
          VALUES ('https://testagram.example/activities/ci-outbox',
                  '00000000-0000-4000-8000-000000000001',
                  '{"type":"Create","id":"https://testagram.example/activities/ci-outbox"}'::jsonb);
          DO $federation_outbox_verify$
          BEGIN
            IF (SELECT count(*) FROM testagram_local.federation_outbox WHERE activity_id='https://testagram.example/activities/ci-outbox' AND state='pending') <> 1 THEN
              RAISE EXCEPTION 'Federation outbox durable insert failed';
            END IF;
          END $federation_outbox_verify$;
          INSERT INTO testagram_local.accounts(user_id)
          VALUES ('00000000-0000-4000-8000-000000000001'),
                 ('00000000-0000-4000-8000-000000000002');
          INSERT INTO testagram_local.remote_follows
            (local_user_id,remote_actor_uri,follow_activity_id,last_activity_id,status)
          VALUES ('00000000-0000-4000-8000-000000000001',
                  'https://remote.example/users/alice',
                  'https://remote.example/activities/follow-1',
                  'https://remote.example/activities/follow-1',
                  'accepted');
          UPDATE testagram_local.remote_follows
            SET status='removed',last_activity_id='https://remote.example/activities/undo-wrong'
            WHERE local_user_id='00000000-0000-4000-8000-000000000001'
              AND remote_actor_uri='https://remote.example/users/alice'
              AND follow_activity_id='https://remote.example/activities/not-the-follow';
          DO $remote_follow_binding$
          BEGIN
            IF (SELECT status FROM testagram_local.remote_follows
                WHERE local_user_id='00000000-0000-4000-8000-000000000001'
                  AND remote_actor_uri='https://remote.example/users/alice') <> 'accepted' THEN
              RAISE EXCEPTION 'Mismatched Undo changed canonical remote-follow state';
            END IF;
          END $remote_follow_binding$;
          UPDATE testagram_local.remote_follows
            SET status='removed',last_activity_id='https://remote.example/activities/undo-1'
            WHERE local_user_id='00000000-0000-4000-8000-000000000001'
              AND remote_actor_uri='https://remote.example/users/alice'
              AND follow_activity_id='https://remote.example/activities/follow-1'
              AND status='accepted';
          DO $remote_follow_undo$
          BEGIN
            IF (SELECT status FROM testagram_local.remote_follows
                WHERE local_user_id='00000000-0000-4000-8000-000000000001'
                  AND remote_actor_uri='https://remote.example/users/alice') <> 'removed' THEN
              RAISE EXCEPTION 'Matching Undo did not remove canonical remote follow';
            END IF;
          END $remote_follow_undo$;
          INSERT INTO testagram_local.posts(id,author_id)
          VALUES ('00000000-0000-4000-8000-000000000003','00000000-0000-4000-8000-000000000001');
          UPDATE testagram_local.posts SET views_count=views_count+1 WHERE id='00000000-0000-4000-8000-000000000003';
          INSERT INTO testagram_media.assets
            (object_key,owner_id,visibility,content_type,size_bytes,status,original_name,storage_namespace)
          VALUES ('users/00000000-0000-4000-8000-000000000001/0123456789abcdef0123456789abcdef',
                  '00000000-0000-4000-8000-000000000001','public','image/jpeg',1024,'ready','thread.jpg','media-public');
          INSERT INTO testagram_local.polls(author_id,question,media_object_key)
          VALUES ('00000000-0000-4000-8000-000000000001','Which option should we choose?',
                  'users/00000000-0000-4000-8000-000000000001/0123456789abcdef0123456789abcdef');
          INSERT INTO testagram_local.poll_options(poll_id,label,position)
          SELECT id,'Option A',0 FROM testagram_local.polls;
          INSERT INTO testagram_local.poll_options(poll_id,label,position)
          SELECT id,'Option B',1 FROM testagram_local.polls;
          INSERT INTO testagram_local.poll_votes(poll_id,option_id,user_id)
          SELECT p.id,o.id,'00000000-0000-4000-8000-000000000002'
          FROM testagram_local.polls p JOIN testagram_local.poll_options o ON o.poll_id=p.id AND o.position=0;
          DO $ci$
          BEGIN
            IF (SELECT count(*) FROM testagram_local.poll_votes) <> 1 THEN
              RAISE EXCEPTION 'poll vote was not persisted';
            END IF;
            IF (SELECT count(*) FROM testagram_local.polls WHERE media_object_key IS NOT NULL) <> 1 THEN
              RAISE EXCEPTION 'poll media registry foreign key was not persisted';
            END IF;
          END $ci$;
          INSERT INTO testagram_local.threads(owner_id,body,media_urls)
          VALUES ('00000000-0000-4000-8000-000000000001','A native thread',
            '[{"key":"users/00000000-0000-4000-8000-000000000001/0123456789abcdef0123456789abcdef","url":"https://media.testagram.site/v1/tenants/owner/users/file","name":"thread.jpg","type":"image/jpeg","size":1024}]'::jsonb);
          INSERT INTO testagram_media.storage_deletion_jobs
            (object_key,owner_id,visibility,storage_namespace,storage_provider,reason)
          SELECT object_key,owner_id,visibility,storage_namespace,storage_provider,'user_delete'
          FROM testagram_media.assets
          WHERE object_key='users/00000000-0000-4000-8000-000000000001/0123456789abcdef0123456789abcdef';
          UPDATE testagram_media.assets SET status='deletion_pending'
          WHERE object_key='users/00000000-0000-4000-8000-000000000001/0123456789abcdef0123456789abcdef';
          INSERT INTO testagram_local.browsing_history(user_id,entity_type,entity_id,metadata)
          SELECT '00000000-0000-4000-8000-000000000001','thread',id,'{"surface":"thread-detail"}'::jsonb
          FROM testagram_local.threads;
          INSERT INTO testagram_local.thread_likes(thread_id,user_id)
          SELECT id,'00000000-0000-4000-8000-000000000002' FROM testagram_local.threads;
          INSERT INTO testagram_local.thread_reposts(thread_id,user_id)
          SELECT id,'00000000-0000-4000-8000-000000000002' FROM testagram_local.threads;
          INSERT INTO testagram_local.thread_bookmarks(thread_id,user_id)
          SELECT id,'00000000-0000-4000-8000-000000000002' FROM testagram_local.threads;
          INSERT INTO testagram_local.follows(follower_id,following_id,status)
          VALUES ('00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000001','accepted');
          INSERT INTO testagram_local.iptv_channel_reactions(channel_id,user_id)
          VALUES ('ci-channel','00000000-0000-4000-8000-000000000002');
          INSERT INTO testagram_local.iptv_channel_comments(channel_id,user_id,content)
          VALUES ('ci-channel','00000000-0000-4000-8000-000000000002','CI IPTV comment');
          INSERT INTO testagram_local.iptv_channel_favorites(user_id,channel_id,channel_data)
          VALUES ('00000000-0000-4000-8000-000000000002','ci-channel','{"id":"ci-channel","name":"CI channel"}'::jsonb);
          INSERT INTO testagram_local.iptv_watch_history(user_id,channel_id,channel_data)
          VALUES ('00000000-0000-4000-8000-000000000002','ci-channel','{"id":"ci-channel","name":"CI channel"}'::jsonb);
          INSERT INTO testagram_local.iptv_channel_reports(channel_id,user_id,reason)
          VALUES ('ci-channel','00000000-0000-4000-8000-000000000002','Stream is unavailable');
          DO $feed$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM testagram_local.threads t
              JOIN testagram_local.follows f ON f.following_id=t.owner_id
              WHERE f.follower_id='00000000-0000-4000-8000-000000000002'
                AND f.status='accepted' AND t.visibility='public' AND t.deleted_at IS NULL
            ) THEN
              RAISE EXCEPTION 'following thread feed query returned no visible thread';
            END IF;
            IF (SELECT count(*) FROM testagram_local.iptv_channel_reactions WHERE channel_id='ci-channel') <> 1
              OR (SELECT count(*) FROM testagram_local.iptv_channel_comments WHERE channel_id='ci-channel' AND deleted_at IS NULL) <> 1
              OR (SELECT count(*) FROM testagram_local.iptv_channel_favorites WHERE channel_id='ci-channel') <> 1
              OR (SELECT count(*) FROM testagram_local.iptv_watch_history WHERE channel_id='ci-channel') <> 1
              OR (SELECT count(*) FROM testagram_local.iptv_channel_reports WHERE channel_id='ci-channel') <> 1 THEN
              RAISE EXCEPTION 'IPTV social records were not persisted';
            END IF;
          END $feed$;
          DO $ci$
          BEGIN
            IF (SELECT count(*) FROM testagram_local.threads) <> 1 THEN
              RAISE EXCEPTION 'native thread row was not persisted';
            END IF;
            IF (SELECT views_count FROM testagram_local.posts WHERE id='00000000-0000-4000-8000-000000000003') <> 1 THEN
              RAISE EXCEPTION 'native post view counter did not increment';
            END IF;
            IF (SELECT likes_count FROM testagram_local.threads) <> 1 THEN
              RAISE EXCEPTION 'native thread like trigger did not update the counter';
            END IF;
            IF (SELECT reposts_count FROM testagram_local.threads) <> 1 THEN
              RAISE EXCEPTION 'native thread repost trigger did not update the counter';
            END IF;
            IF (SELECT count(*) FROM testagram_local.thread_bookmarks) <> 1 THEN
              RAISE EXCEPTION 'native thread bookmark was not persisted';
            END IF;
            IF (SELECT count(*) FROM testagram_media.storage_deletion_jobs WHERE reason='user_delete' AND status='pending') <> 1 THEN
              RAISE EXCEPTION 'thread media cleanup job was not queued';
            END IF;
            IF (SELECT count(*) FROM testagram_local.browsing_history WHERE user_id='00000000-0000-4000-8000-000000000001') <> 1 THEN
              RAISE EXCEPTION 'per-account browsing history was not persisted';
            END IF;
            IF (SELECT count(*) FROM testagram_local.browsing_history WHERE user_id='00000000-0000-4000-8000-000000000002') <> 0 THEN
              RAISE EXCEPTION 'browsing history leaked across accounts';
            END IF;
          END $ci$;
          SQL
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop testagram-social-schema-ci || true

  compose:
    name: Self-hosted Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint InstaBox deployment workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -ignore 'SC2034' -ignore 'SC2016' -ignore 'SC2129' .github/workflows/instabox-deploy.yml
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password-not-for-production
          MINIO_ROOT_USER: ci-only-minio-user
          MINIO_ROOT_PASSWORD: ci-only-minio-password-not-for-production
          ACME_EMAIL: ci-only@example.invalid
          DATABASE_URL: postgres://testagram:ci-only-password-not-for-production@db:5432/testagram?sslmode=disable
          VPS_INTERNAL_TOKEN: ci-only-vps-token-not-for-production
          VPS_NODE_BOOTSTRAP_TOKEN: ci-only-node-token-not-for-production
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password-not-for-production
          FEDERATION_INGRESS_TOKEN: ci-only-federation-ingress-token-not-for-production
          FEDERATION_BACKEND_INTERNAL_TOKEN: ci-only-federation-backend-token-not-for-production
          CDN_ORIGIN_AUTH_TOKEN: ci-only-cdn-origin-token-not-for-production
          CDN_MEDIA_ASSERTION_SECRET: ci-only-cdn-assertion-secret-not-for-production
        run: |
          export ADMIN_SESSION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          export ADMIN_PUBLIC_URL=https://ops.example.invalid
          export ADMIN_DOMAIN=ops.example.invalid
          docker compose -f deploy/self-hosted/docker-compose.yml config --quiet
          python - <<'PY'
          from pathlib import Path
          import re

          deploy = Path(".github/workflows/instabox-deploy.yml").read_text()
          compose = Path("deploy/self-hosted/docker-compose.yml").read_text()
          caddy = Path("deploy/self-hosted/Caddyfile").read_text()
          assert "secrets.FEDERATION_BACKEND_INTERNAL_TOKEN" in deploy and "FEDERATION_BACKEND_INTERNAL_TOKEN:" in deploy, "deployment must consume the repository Federation read secret"
          assert "ghcr.io/trendyzima/testagram-edge@sha256:e4c014a043b761d6f84b05d3973a3a6831522b863eef08685b7ca6db17f55ce9" in compose, "Backend Compose must pin the provenance-verified Go CDN image by digest"
          assert "ORIGIN_URL: http://api:8080" in compose and "ORIGIN_AUTH_TOKEN:" in compose, "Go CDN must use the private Backend origin and service credential"
          assert "reverse_proxy @cdn_media cdn:8080" in caddy and "reverse_proxy media-cache:8081" in caddy, "Caddy must route canonical CDN paths without breaking legacy signed MinIO paths"
          assert "543093e47bde602512adfc2b4aa30caed8cf0e60" in deploy and "Go CDN public cache miss authenticated and classified by Backend" in deploy, "InstaBox deploy must pin, health-check and smoke the CDN-to-Backend path"
          assert "envs:(" in deploy and "APPWRITE_PROJECT_ID:$appwrite" in deploy and "FEDERATION_BACKEND_INTERNAL_TOKEN:$federation_token" in deploy, "deployment must forward the Federation read secret to the VPS environment"
          assert "DATA_CENTRE_MEDIA_ENABLED:$media_enabled" in deploy and 'if $media_enabled == "true" then' in deploy, "media provider credentials must be forwarded only after explicit media activation"
          for check in (
              "DATA_CENTRE_MEDIA_ENABLED",
              "media-migrate",
              "up -d --build --force-recreate media",
              'verify_container_env "$DC_ENV" "$DATACENTRE/backend/docker-compose.yml" media MEDIA_INTERNAL_TOKEN',
              "Backend-to-Data-Centre private media readiness",
              'media-enabled.txt',
          ):
              assert check in deploy, f"deployment must wire and verify private Data Centre media: {check}"
          assert "must be distinct from FEDERATION_INGRESS_TOKEN" in deploy, "Federation credentials must remain independently keyed"
          for check in (
              'verify_container_env "$BASE_ENV" "$BASE_COMPOSE" api FEDERATION_BACKEND_INTERNAL_TOKEN',
              'verify_container_env "$BASE_ENV" "$BASE_COMPOSE" api FEDERATION_INTERNAL_TOKEN',
              'verify_container_env "$DC_ENV" "$DATACENTRE/backend/docker-compose.yml" federation-api BACKEND_INTERNAL_TOKEN',
              'verify_container_env "$DC_ENV" "$DATACENTRE/backend/docker-compose.yml" federation-api FEDERATION_INGRESS_TOKEN',
              'Backend ingress token accepted by Federation',
              'Backend read token rejected by Federation ingress',
              'Federation read token accepted by Backend',
              'Federation ingress token rejected by Backend read endpoint',
              'credential value redacted',
          ):
              assert check in deploy, f"deployment must verify redacted runtime environment: {check}"
          expected = {
              "TESTAGRAM_ALGORITHM_IMAGE": "sha-6ae0532c171383b84731063d590d775524f9da1e",
              "TESTAGRAM_FEDERATION_IMAGE": "sha-edf4f59f843514596d35273c888ff1c16ec0f73e",
          }
          for key, tag in expected.items():
              if not re.search(rf'{key}="ghcr\.io/trendyzima/[^"]*{re.escape(tag)}"', deploy):
                  raise SystemExit(f"{key} is not pinned to its reviewed immutable image")
              if f'write_dc_env_value {key} "${key}"' not in deploy:
                  raise SystemExit(f"{key} is not synchronized into existing Data Centre .env files")
          if 'pull algorithm federation-api' not in deploy:
              raise SystemExit("Deployment must explicitly pull the pinned Algorithm and Federation images")
          if '--force-recreate algorithm federation-api' not in deploy:
              raise SystemExit("Deployment must recreate services after updating immutable image pins")
          if "verify_running_image algorithm" not in deploy or "verify_running_image federation-api" not in deploy:
              raise SystemExit("Deployment must verify the exact running Algorithm and Federation image tags")
          if '::error::Data Centre deployment did not reach an accepted core-services state' not in deploy:
              raise SystemExit("Deployment must fail when Data Centre image rollout does not reach an accepted state")
          PY
          docker build -f admin-console/Dockerfile -t testagram-admin-console-ci .
          docker build -f deploy/self-hosted/minio-tools/Dockerfile -t testagram-minio-tools-ci deploy/self-hosted/minio-tools
          python -m json.tool deploy/self-hosted/grafana/dashboards/testagram-operations.json >/dev/null
          docker run --rm -v "$PWD/deploy/self-hosted/prometheus.yml:/etc/prometheus/prometheus.yml:ro" -v "$PWD/deploy/self-hosted/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/self-hosted/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
          sh -n deploy/self-hosted/alertmanager/generate-config.sh
          bash -n deploy/self-hosted/apply-media-replication-migrations.sh
          docker run --rm -e ALERTMANAGER_WEBHOOK_URL=https://hooks.example.invalid/test -v "$PWD/deploy/self-hosted/alertmanager/generate-config.sh:/etc/alertmanager/generate-config.sh:ro" --entrypoint /bin/sh prom/alertmanager:v0.28.1 -ec 'sh /etc/alertmanager/generate-config.sh > /tmp/alertmanager.yml && /bin/amtool check-config /tmp/alertmanager.yml'
          docker run --rm -e ALERTMANAGER_WEBHOOK_URL= -v "$PWD/deploy/self-hosted/alertmanager/generate-config.sh:/etc/alertmanager/generate-config.sh:ro" --entrypoint /bin/sh prom/alertmanager:v0.28.1 -ec 'sh /etc/alertmanager/generate-config.sh > /tmp/alertmanager.yml && /bin/amtool check-config /tmp/alertmanager.yml'

  virtual-storage-integration:
    name: Virtual storage MinIO lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache: true
      - name: Start isolated MinIO service
        run: |
          docker run -d --rm --name testagram-minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=testagram-ci \
            -e MINIO_ROOT_PASSWORD=testagram-ci-password \
            -e MINIO_SITE_REGION=us-east-1 \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9 server /data --address ":9000"
      - name: Wait for MinIO health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs testagram-minio-ci
          echo "MinIO did not become healthy within 60 seconds" >&2
          exit 1
      - name: Start two isolated replica MinIO services
        run: |
          set -euo pipefail
          for entry in "r2:9001" "b2:9002"; do
            name="testagram-minio-${entry%%:*}"
            port="${entry##*:}"
            docker run -d --rm --name "$name" -p "$port:9000" \
              -e MINIO_ROOT_USER=testagram-ci \
              -e MINIO_ROOT_PASSWORD=testagram-ci-password \
              -e MINIO_SITE_REGION=us-east-1 \
              ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9 server /data --address ":9000"
          done
          for port in 9001 9002; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:$port/minio/health/live" >/dev/null; then break; fi
              sleep 2
            done
            curl --fail --silent "http://127.0.0.1:$port/minio/health/live" >/dev/null
          done
      - name: Exercise signed PUT, HEAD, GET, LIST and DELETE against MinIO
        env:
          TESTAGRAM_S3_ENDPOINT: http://127.0.0.1:9000
          TESTAGRAM_S3_ACCESS_KEY: testagram-ci
          TESTAGRAM_S3_SECRET_KEY: testagram-ci-password
        run: go test -race -count=1 ./internal/virtualstorage -run '^TestS3ProviderMinIOLifecycle$'
      - name: Exercise three-provider verified replication and deletion
        env:
          TESTAGRAM_S3_ACCESS_KEY: testagram-ci
          TESTAGRAM_S3_SECRET_KEY: testagram-ci-password
          TESTAGRAM_REPLICA_PRIMARY_ENDPOINT: http://127.0.0.1:9000
          TESTAGRAM_REPLICA_R2_ENDPOINT: http://127.0.0.1:9001
          TESTAGRAM_REPLICA_B2_ENDPOINT: http://127.0.0.1:9002
        run: go test -race -count=1 ./internal/virtualstorage -run "TestReplicatorMinIOThreeProviderLifecycle"
      - name: Stop isolated MinIO services
        if: always()
        run: docker stop testagram-minio-ci testagram-minio-r2 testagram-minio-b2 || true

  replication-media-schema-integration:
    name: Replication media outbox PostgreSQL integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name testagram-replication-ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec testagram-replication-ci pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs testagram-replication-ci
          exit 1
      - name: Apply media and replication migrations
        run: |
          set -euo pipefail
          for migration in \
            migrations/005_media_assets.sql \
            migrations/006_media_lifecycle.sql \
            migrations/007_media_product_bridge.sql \
            migrations/008_virtual_storage_bridge.sql \
            migrations/20261019_dual_backend_replication.sql \
            migrations/20261019_testagram_media_replication_producers.sql; do
            docker exec -i testagram-replication-ci psql -U postgres -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Verify public-only producer, checksum payload, tombstones and health counters
        run: |
          set -euo pipefail
          docker exec -i testagram-replication-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO testagram_media.assets
            (object_key, owner_id, visibility, content_type, size_bytes, checksum_sha256, status)
          VALUES
            ('users/test-user/0123456789abcdef0123456789abcdef', 'test-user', 'public', 'image/jpeg', 1024, repeat('a',64), 'ready'),
            ('users/test-user/1123456789abcdef0123456789abcdef', 'test-user', 'private', 'image/jpeg', 1024, repeat('b',64), 'ready');
          DO $ci$
          BEGIN
            IF (SELECT count(*) FROM public.platform_replication_outbox WHERE entity_type='media') <> 1 THEN
              RAISE EXCEPTION 'only complete public media should produce an event';
            END IF;
            IF EXISTS (
              SELECT 1 FROM public.platform_replication_outbox
              WHERE entity_type='media' AND (payload ? 'signed_url' OR payload ? 'presigned_url' OR payload ? 'download_url')
            ) THEN
              RAISE EXCEPTION 'signed URL fields must never be replicated';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.platform_replication_outbox
              WHERE entity_type='media' AND event_type='media.created'
                AND payload->>'checksum_sha256'=repeat('a',64)
                AND payload->>'visibility'='public'
            ) THEN
              RAISE EXCEPTION 'public media event is missing verified metadata';
            END IF;
          END $ci$;
          UPDATE testagram_media.assets
          SET visibility='private'
          WHERE object_key='users/test-user/0123456789abcdef0123456789abcdef';
          DO $ci$
          BEGIN
            IF (SELECT count(*) FROM public.platform_replication_outbox WHERE entity_type='media') <> 2 THEN
              RAISE EXCEPTION 'public-to-private transition must append a tombstone';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.platform_replication_outbox
              WHERE entity_type='media' AND event_type='media.deleted' AND payload='{}'::jsonb
            ) THEN
              RAISE EXCEPTION 'privacy transition must emit an empty tombstone';
            END IF;
            IF (SELECT outbox_pending FROM public.platform_replication_health) <> 2 THEN
              RAISE EXCEPTION 'replication health view must report pending outbox events';
            END IF;
          END $ci$;
          SQL
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop testagram-replication-ci || true

