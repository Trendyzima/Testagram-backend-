name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Resolve and verify Go modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/api
      - name: Check formatting in API command package
        run: |
          unformatted="$(gofmt -l cmd)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            gofmt -d cmd
            exit 1
          fi

  platform:
    name: Platform service tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: services/platform/go.sum
      - name: Resolve and verify platform module
        run: |
          go mod tidy
          git diff --exit-code -- services/platform/go.mod services/platform/go.sum
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

  dependency-audit:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan API module
        run: govulncheck ./...
      - name: Scan platform module
        working-directory: services/platform
        run: govulncheck ./...

  compose:
    name: Self-hosted Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password-not-for-production
          VALKEY_PASSWORD: ci-only-valkey-password-not-for-production
          MINIO_ROOT_USER: ci-only-minio-user
          MINIO_ROOT_PASSWORD: ci-only-minio-password-not-for-production
          ACME_EMAIL: ci-only@example.invalid
          DATABASE_URL: postgres://testagram:ci-only-password-not-for-production@db:5432/testagram?sslmode=disable
          PLATFORM_INTERNAL_TOKEN: ci-only-platform-token-not-for-production
          VPS_INTERNAL_TOKEN: ci-only-vps-token-not-for-production
          VPS_NODE_BOOTSTRAP_TOKEN: ci-only-node-token-not-for-production
        run: docker compose -f deploy/self-hosted/docker-compose.yml config --quiet

  virtual-storage-integration:
    name: Virtual storage MinIO lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Start isolated MinIO service
        run: |
          docker run -d --rm --name testagram-minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=testagram-ci \
            -e MINIO_ROOT_PASSWORD=testagram-ci-password \
            -e MINIO_SITE_REGION=us-east-1 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data --address ":9000"
      - name: Wait for MinIO health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs testagram-minio-ci
          echo "MinIO did not become healthy within 60 seconds" >&2
          exit 1
      - name: Exercise signed PUT, HEAD, GET, LIST and DELETE against MinIO
        env:
          TESTAGRAM_S3_ENDPOINT: http://127.0.0.1:9000
          TESTAGRAM_S3_ACCESS_KEY: testagram-ci
          TESTAGRAM_S3_SECRET_KEY: testagram-ci-password
        run: go test -race -count=1 ./internal/virtualstorage -run '^TestS3ProviderMinIOLifecycle$'
      - name: Stop isolated MinIO service
        if: always()
        run: docker stop testagram-minio-ci || true
