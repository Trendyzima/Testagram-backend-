name: Backend CI

on:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true
      - name: Resolve and verify Go modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/api ./admin-console
      - name: Build fresh Appwrite API container
        run: docker build -f Dockerfile.fresh -t testagram-backend-fresh-ci .
      - name: Validate fresh Backend OpenAPI contract
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python scripts/validate-fresh-openapi.py
      - name: Validate staff console JavaScript syntax
        run: node --check admin-console/web/app.js
      - name: Check formatting of changed API Go files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -z "${BASE_SHA:-}" || "${BASE_SHA}" =~ ^0+$ ]]; then
            mapfile -t go_files < <(git ls-files 'cmd/*.go' 'cmd/**/*.go')
          else
            mapfile -t go_files < <(git diff --name-only "${BASE_SHA}"...HEAD -- 'cmd/*.go' 'cmd/**/*.go')
          fi
          if (("${#go_files[@]}" > 0)); then
            unformatted="$(printf '%s\n' "${go_files[@]}" | xargs -r gofmt -l)"
            if [[ -n "$unformatted" ]]; then
              printf '%s\n' "$unformatted"
              printf '%s\n' "${go_files[@]}" | xargs -r gofmt -d
              exit 1
            fi
          fi

  platform:
    name: Platform service tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true
          cache-dependency-path: services/platform/go.sum
      - name: Resolve and verify platform module
        run: |
          go mod tidy
          git diff --exit-code -- services/platform/go.mod services/platform/go.sum
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./...

  dependency-audit:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan API module
        run: govulncheck ./...
      - name: Scan platform module
        working-directory: services/platform
        run: govulncheck ./...

  tv-health-schema-integration:
    name: TV health PostgreSQL migration integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name testagram-tv-health-ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec testagram-tv-health-ci pg_isready -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs testagram-tv-health-ci
          exit 1
      - name: Apply TV health migration and verify constraints
        run: |
          set -euo pipefail
          docker exec -i testagram-tv-health-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE testagram_app NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
          docker exec -i testagram-tv-health-ci psql -U postgres -v ON_ERROR_STOP=1 < migrations/20261106_tv_health_postgres.sql
          docker exec -i testagram-tv-health-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO testagram_tv.channel_health
            (channel_id,url,is_online,last_checked_at,last_online_at,consecutive_failures,consecutive_successes,latency_ms,priority)
          VALUES ('ci-channel','https://stream.example/live.m3u8',true,now(),now(),0,1,120,10);
          INSERT INTO testagram_tv.channel_health
            (channel_id,url,is_online,last_checked_at,last_online_at,consecutive_failures,consecutive_successes,latency_ms,priority)
          VALUES ('ci-channel','https://stream.example/live.m3u8',false,now(),NULL,1,0,2500,10)
          ON CONFLICT (channel_id) DO UPDATE SET
            is_online=EXCLUDED.is_online,
            last_checked_at=EXCLUDED.last_checked_at,
            last_online_at=CASE WHEN EXCLUDED.is_online THEN EXCLUDED.last_checked_at ELSE testagram_tv.channel_health.last_online_at END,
            consecutive_failures=CASE WHEN EXCLUDED.is_online THEN 0 ELSE testagram_tv.channel_health.consecutive_failures+1 END,
            consecutive_successes=CASE WHEN EXCLUDED.is_online THEN testagram_tv.channel_health.consecutive_successes+1 ELSE 0 END;
          DO $ci$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM testagram_tv.channel_health WHERE channel_id='ci-channel' AND NOT is_online AND consecutive_failures=1 AND consecutive_successes=0 AND last_online_at IS NOT NULL) THEN
              RAISE EXCEPTION 'offline health update did not preserve last online timestamp or failure streak';
            END IF;
          END $ci$;
          SQL
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop testagram-tv-health-ci || true

  social-schema-integration:
    name: Poll, thread and browsing history PostgreSQL integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name testagram-social-schema-ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec testagram-social-schema-ci pg_isready -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs testagram-social-schema-ci
          exit 1
      - name: Apply real prerequisite and social migrations
        run: |
          set -euo pipefail
          docker exec -i testagram-social-schema-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA testagram_local;
          CREATE TABLE testagram_local.accounts (
            user_id uuid PRIMARY KEY,
            username text NOT NULL DEFAULT 'ci_user',
            display_name text NOT NULL DEFAULT '',
            avatar_key text NOT NULL DEFAULT '',
            account_status text NOT NULL DEFAULT 'active'
          );
          CREATE TABLE testagram_local.posts (id uuid PRIMARY KEY);
          CREATE TABLE testagram_local.follows (
            follower_id uuid NOT NULL,
            following_id uuid NOT NULL,
            status text NOT NULL DEFAULT 'accepted'
          );
          SQL
          for migration in \
            migrations/005_media_assets.sql \
            migrations/007_media_product_bridge.sql \
            migrations/008_virtual_storage_bridge.sql \
            migrations/20261108_testagram_polls.sql \
            migrations/20261109_threads_browsing_history.sql \
            migrations/20261109_thread_interactions.sql; do
            docker exec -i testagram-social-schema-ci psql -U postgres -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Verify media attachment, poll voting and private history constraints
        run: |
          set -euo pipefail
          docker exec -i testagram-social-schema-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO testagram_local.accounts(user_id)
          VALUES ('00000000-0000-4000-8000-000000000001'),
                 ('00000000-0000-4000-8000-000000000002');
          INSERT INTO testagram_media.assets
            (object_key,owner_id,visibility,content_type,size_bytes,status,original_name,storage_namespace)
          VALUES ('users/00000000-0000-4000-8000-000000000001/0123456789abcdef0123456789abcdef',
                  '00000000-0000-4000-8000-000000000001','public','image/jpeg',1024,'ready','thread.jpg','media-public');
          INSERT INTO testagram_local.polls(author_id,question,media_object_key)
          VALUES ('00000000-0000-4000-8000-000000000001','Which option should we choose?',
                  'users/00000000-0000-4000-8000-000000000001/0123456789abcdef0123456789abcdef');
          INSERT INTO testagram_local.poll_options(poll_id,label,position)
          SELECT id,'Option A',0 FROM testagram_local.polls;
          INSERT INTO testagram_local.poll_options(poll_id,label,position)
          SELECT id,'Option B',1 FROM testagram_local.polls;
          INSERT INTO testagram_local.poll_votes(poll_id,option_id,user_id)
          SELECT p.id,o.id,'00000000-0000-4000-8000-000000000002'
          FROM testagram_local.polls p JOIN testagram_local.poll_options o ON o.poll_id=p.id AND o.position=0;
          DO $ci$
          BEGIN
            IF (SELECT count(*) FROM testagram_local.poll_votes) <> 1 THEN
              RAISE EXCEPTION 'poll vote was not persisted';
            END IF;
            IF (SELECT count(*) FROM testagram_local.polls WHERE media_object_key IS NOT NULL) <> 1 THEN
              RAISE EXCEPTION 'poll media registry foreign key was not persisted';
            END IF;
          END $ci$;
          INSERT INTO testagram_local.threads(owner_id,body,media_urls)
          VALUES ('00000000-0000-4000-8000-000000000001','A native thread',
            '[{"url":"https://media.testagram.site/v1/tenants/owner/users/file","name":"thread.jpg","type":"image/jpeg","size":1024}]'::jsonb);
          INSERT INTO testagram_local.browsing_history(user_id,entity_type,entity_id,metadata)
          SELECT '00000000-0000-4000-8000-000000000001','thread',id,'{"surface":"thread-detail"}'::jsonb
          FROM testagram_local.threads;
          INSERT INTO testagram_local.thread_likes(thread_id,user_id)
          SELECT id,'00000000-0000-4000-8000-000000000002' FROM testagram_local.threads;
          INSERT INTO testagram_local.thread_reposts(thread_id,user_id)
          SELECT id,'00000000-0000-4000-8000-000000000002' FROM testagram_local.threads;
          INSERT INTO testagram_local.thread_bookmarks(thread_id,user_id)
          SELECT id,'00000000-0000-4000-8000-000000000002' FROM testagram_local.threads;
          INSERT INTO testagram_local.follows(follower_id,following_id,status)
          VALUES ('00000000-0000-4000-8000-000000000002','00000000-0000-4000-8000-000000000001','accepted');
          DO $feed$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM testagram_local.threads t
              JOIN testagram_local.follows f ON f.following_id=t.owner_id
              WHERE f.follower_id='00000000-0000-4000-8000-000000000002'
                AND f.status='accepted' AND t.visibility='public' AND t.deleted_at IS NULL
            ) THEN
              RAISE EXCEPTION 'following thread feed query returned no visible thread';
            END IF;
          END $feed$;
          DO $ci$
          BEGIN
            IF (SELECT count(*) FROM testagram_local.threads) <> 1 THEN
              RAISE EXCEPTION 'native thread row was not persisted';
            END IF;
            IF (SELECT likes_count FROM testagram_local.threads) <> 1 THEN
              RAISE EXCEPTION 'native thread like trigger did not update the counter';
            END IF;
            IF (SELECT reposts_count FROM testagram_local.threads) <> 1 THEN
              RAISE EXCEPTION 'native thread repost trigger did not update the counter';
            END IF;
            IF (SELECT count(*) FROM testagram_local.thread_bookmarks) <> 1 THEN
              RAISE EXCEPTION 'native thread bookmark was not persisted';
            END IF;
            IF (SELECT count(*) FROM testagram_local.browsing_history WHERE user_id='00000000-0000-4000-8000-000000000001') <> 1 THEN
              RAISE EXCEPTION 'per-account browsing history was not persisted';
            END IF;
            IF (SELECT count(*) FROM testagram_local.browsing_history WHERE user_id='00000000-0000-4000-8000-000000000002') <> 0 THEN
              RAISE EXCEPTION 'browsing history leaked across accounts';
            END IF;
          END $ci$;
          SQL
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop testagram-social-schema-ci || true

  compose:
    name: Self-hosted Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-password-not-for-production
          VALKEY_PASSWORD: ci-only-valkey-password-not-for-production
          MINIO_ROOT_USER: ci-only-minio-user
          MINIO_ROOT_PASSWORD: ci-only-minio-password-not-for-production
          ACME_EMAIL: ci-only@example.invalid
          DATABASE_URL: postgres://testagram:ci-only-password-not-for-production@db:5432/testagram?sslmode=disable
          PLATFORM_INTERNAL_TOKEN: ci-only-platform-token-not-for-production
          VPS_INTERNAL_TOKEN: ci-only-vps-token-not-for-production
          VPS_NODE_BOOTSTRAP_TOKEN: ci-only-node-token-not-for-production
          GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password-not-for-production
        run: |
          export ADMIN_SESSION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          export ADMIN_PUBLIC_URL=https://ops.example.invalid
          export ADMIN_DOMAIN=ops.example.invalid
          docker compose -f deploy/self-hosted/docker-compose.yml config --quiet
          docker build -f admin-console/Dockerfile -t testagram-admin-console-ci .
          docker build -f deploy/self-hosted/minio-tools/Dockerfile -t testagram-minio-tools-ci deploy/self-hosted/minio-tools
          python -m json.tool deploy/self-hosted/grafana/dashboards/testagram-operations.json >/dev/null
          docker run --rm -v "$PWD/deploy/self-hosted/prometheus.yml:/etc/prometheus/prometheus.yml:ro" -v "$PWD/deploy/self-hosted/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/self-hosted/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
          sh -n deploy/self-hosted/alertmanager/generate-config.sh
          docker run --rm -e ALERTMANAGER_WEBHOOK_URL=https://hooks.example.invalid/test -v "$PWD/deploy/self-hosted/alertmanager/generate-config.sh:/etc/alertmanager/generate-config.sh:ro" --entrypoint /bin/sh prom/alertmanager:v0.28.1 -ec 'sh /etc/alertmanager/generate-config.sh > /tmp/alertmanager.yml && /bin/amtool check-config /tmp/alertmanager.yml'
          docker run --rm -e ALERTMANAGER_WEBHOOK_URL= -v "$PWD/deploy/self-hosted/alertmanager/generate-config.sh:/etc/alertmanager/generate-config.sh:ro" --entrypoint /bin/sh prom/alertmanager:v0.28.1 -ec 'sh /etc/alertmanager/generate-config.sh > /tmp/alertmanager.yml && /bin/amtool check-config /tmp/alertmanager.yml'

  virtual-storage-integration:
    name: Virtual storage MinIO lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: true
      - name: Start isolated MinIO service
        run: |
          docker run -d --rm --name testagram-minio-ci \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=testagram-ci \
            -e MINIO_ROOT_PASSWORD=testagram-ci-password \
            -e MINIO_SITE_REGION=us-east-1 \
            ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9 server /data --address ":9000"
      - name: Wait for MinIO health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs testagram-minio-ci
          echo "MinIO did not become healthy within 60 seconds" >&2
          exit 1
      - name: Exercise signed PUT, HEAD, GET, LIST and DELETE against MinIO
        env:
          TESTAGRAM_S3_ENDPOINT: http://127.0.0.1:9000
          TESTAGRAM_S3_ACCESS_KEY: testagram-ci
          TESTAGRAM_S3_SECRET_KEY: testagram-ci-password
        run: go test -race -count=1 ./internal/virtualstorage -run '^TestS3ProviderMinIOLifecycle$'
      - name: Stop isolated MinIO service
        if: always()
        run: docker stop testagram-minio-ci || true

  replication-media-schema-integration:
    name: Replication media outbox PostgreSQL integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name testagram-replication-ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec testagram-replication-ci pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs testagram-replication-ci
          exit 1
      - name: Apply media and replication migrations
        run: |
          set -euo pipefail
          for migration in \
            migrations/005_media_assets.sql \
            migrations/006_media_lifecycle.sql \
            migrations/007_media_product_bridge.sql \
            migrations/008_virtual_storage_bridge.sql \
            migrations/20261019_dual_backend_replication.sql \
            migrations/20261019_testagram_media_replication_producers.sql; do
            docker exec -i testagram-replication-ci psql -U postgres -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Verify public-only producer, checksum payload, tombstones and health counters
        run: |
          set -euo pipefail
          docker exec -i testagram-replication-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO testagram_media.assets
            (object_key, owner_id, visibility, content_type, size_bytes, checksum_sha256, status)
          VALUES
            ('users/test-user/0123456789abcdef0123456789abcdef', 'test-user', 'public', 'image/jpeg', 1024, repeat('a',64), 'ready'),
            ('users/test-user/1123456789abcdef0123456789abcdef', 'test-user', 'private', 'image/jpeg', 1024, repeat('b',64), 'ready');
          DO $ci$
          BEGIN
            IF (SELECT count(*) FROM public.platform_replication_outbox WHERE entity_type='media') <> 1 THEN
              RAISE EXCEPTION 'only complete public media should produce an event';
            END IF;
            IF EXISTS (
              SELECT 1 FROM public.platform_replication_outbox
              WHERE entity_type='media' AND (payload ? 'signed_url' OR payload ? 'presigned_url' OR payload ? 'download_url')
            ) THEN
              RAISE EXCEPTION 'signed URL fields must never be replicated';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.platform_replication_outbox
              WHERE entity_type='media' AND event_type='media.created'
                AND payload->>'checksum_sha256'=repeat('a',64)
                AND payload->>'visibility'='public'
            ) THEN
              RAISE EXCEPTION 'public media event is missing verified metadata';
            END IF;
          END $ci$;
          UPDATE testagram_media.assets
          SET visibility='private'
          WHERE object_key='users/test-user/0123456789abcdef0123456789abcdef';
          DO $ci$
          BEGIN
            IF (SELECT count(*) FROM public.platform_replication_outbox WHERE entity_type='media') <> 2 THEN
              RAISE EXCEPTION 'public-to-private transition must append a tombstone';
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM public.platform_replication_outbox
              WHERE entity_type='media' AND event_type='media.deleted' AND payload='{}'::jsonb
            ) THEN
              RAISE EXCEPTION 'privacy transition must emit an empty tombstone';
            END IF;
            IF (SELECT outbox_pending FROM public.platform_replication_health) <> 2 THEN
              RAISE EXCEPTION 'replication health view must report pending outbox events';
            END IF;
          END $ci$;
          SQL
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop testagram-replication-ci || true

  local-product-outbox-integration:
    name: Local account and post transactional outbox integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name testagram-local-product-ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec testagram-local-product-ci pg_isready -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs testagram-local-product-ci
          exit 1
      - name: Apply isolated media and replication migrations
        run: |
          set -euo pipefail
          for migration in \
            migrations/005_media_assets.sql \
            migrations/006_media_lifecycle.sql \
            migrations/007_media_product_bridge.sql \
            migrations/008_virtual_storage_bridge.sql \
            migrations/20261019_dual_backend_replication.sql \
            migrations/20261019_testagram_local_accounts_posts.sql \
            migrations/20261019_testagram_independent_auth.sql \
            migrations/20261019_testagram_media_replication_producers.sql \
            migrations/20261106_appwrite_identity_bridge.sql \
            migrations/20261106_tv_health_postgres.sql \
            migrations/20261106_social_core.sql; do
            docker exec -i testagram-local-product-ci psql -U postgres -v ON_ERROR_STOP=1 < "$migration"
          done
      - name: Verify account/post atomic events and privacy tombstones
        run: |
          set -euo pipefail
          docker exec -i testagram-local-product-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO testagram_local.accounts(user_id,username,display_name)
          VALUES ('123e4567-e89b-42d3-a456-426614174000','ci_public_user','CI User');
          INSERT INTO testagram_local.posts(id,author_id,text,visibility)
          VALUES ('123e4567-e89b-42d3-a456-426614174001','123e4567-e89b-42d3-a456-426614174000','public test post','public');
          INSERT INTO testagram_local.accounts(user_id,username,display_name)
          VALUES ('123e4567-e89b-42d3-a456-426614174004','ci_social_user','Social User'),
                 ('123e4567-e89b-42d3-a456-426614174005','ci_protected_user','Protected User');
          UPDATE testagram_local.accounts SET protected_account=TRUE WHERE user_id='123e4567-e89b-42d3-a456-426614174005';
          INSERT INTO testagram_local.follows(follower_id,following_id,status)
          VALUES ('123e4567-e89b-42d3-a456-426614174000','123e4567-e89b-42d3-a456-426614174004','accepted'),
                 ('123e4567-e89b-42d3-a456-426614174000','123e4567-e89b-42d3-a456-426614174005','pending');
          INSERT INTO testagram_local.post_reactions(post_id,user_id,emoji)
          VALUES ('123e4567-e89b-42d3-a456-426614174001','123e4567-e89b-42d3-a456-426614174004','❤️');
          INSERT INTO testagram_local.replies(post_id,user_id,content)
          VALUES ('123e4567-e89b-42d3-a456-426614174001','123e4567-e89b-42d3-a456-426614174004','CI reply');
          INSERT INTO testagram_local.reposts(post_id,user_id)
          VALUES ('123e4567-e89b-42d3-a456-426614174001','123e4567-e89b-42d3-a456-426614174004');
          INSERT INTO testagram_local.bookmarks(user_id,post_id)
          VALUES ('123e4567-e89b-42d3-a456-426614174004','123e4567-e89b-42d3-a456-426614174001');
          DO $social$
          BEGIN
            IF (SELECT following_count FROM testagram_local.accounts WHERE user_id='123e4567-e89b-42d3-a456-426614174000') <> 1 THEN
              RAISE EXCEPTION 'accepted follow did not increment following count';
            END IF;
            IF (SELECT follower_count FROM testagram_local.accounts WHERE user_id='123e4567-e89b-42d3-a456-426614174004') <> 1 THEN
              RAISE EXCEPTION 'accepted follow did not increment follower count';
            END IF;
            IF (SELECT follower_count FROM testagram_local.accounts WHERE user_id='123e4567-e89b-42d3-a456-426614174005') <> 0 THEN
              RAISE EXCEPTION 'pending follow must not increment follower count';
            END IF;
            IF (SELECT likes_count FROM testagram_local.posts WHERE id='123e4567-e89b-42d3-a456-426614174001') <> 1 THEN
              RAISE EXCEPTION 'reaction count trigger failed';
            END IF;
            IF (SELECT replies_count FROM testagram_local.posts WHERE id='123e4567-e89b-42d3-a456-426614174001') <> 1 THEN
              RAISE EXCEPTION 'reply count trigger failed';
            END IF;
            IF (SELECT reposts_count FROM testagram_local.posts WHERE id='123e4567-e89b-42d3-a456-426614174001') <> 1 THEN
              RAISE EXCEPTION 'repost count trigger failed';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM testagram_local.bookmarks WHERE user_id='123e4567-e89b-42d3-a456-426614174004') THEN
              RAISE EXCEPTION 'bookmark insert failed';
            END IF;
          END $social$;
          UPDATE testagram_local.replies SET deleted_at=now()
            WHERE post_id='123e4567-e89b-42d3-a456-426614174001';
          DELETE FROM testagram_local.post_reactions WHERE post_id='123e4567-e89b-42d3-a456-426614174001';
          DELETE FROM testagram_local.reposts WHERE post_id='123e4567-e89b-42d3-a456-426614174001';
          DO $social_counts$
          BEGIN
            IF (SELECT likes_count FROM testagram_local.posts WHERE id='123e4567-e89b-42d3-a456-426614174001') <> 0
              OR (SELECT replies_count FROM testagram_local.posts WHERE id='123e4567-e89b-42d3-a456-426614174001') <> 0
              OR (SELECT reposts_count FROM testagram_local.posts WHERE id='123e4567-e89b-42d3-a456-426614174001') <> 0 THEN
              RAISE EXCEPTION 'delete/soft-delete counters did not return to zero';
            END IF;
          END $social_counts$;
          DO $ci$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.platform_replication_outbox WHERE entity_type='account' AND event_type='account.created' AND entity_id='123e4567-e89b-42d3-a456-426614174000') THEN
              RAISE EXCEPTION 'account write did not atomically emit a public account event';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.platform_replication_outbox WHERE entity_type='post' AND event_type='post.created' AND entity_id='123e4567-e89b-42d3-a456-426614174001' AND payload->>'text'='public test post') THEN
              RAISE EXCEPTION 'post write did not atomically emit a public post event';
            END IF;
          END $ci$;
          UPDATE testagram_local.accounts SET protected_account=TRUE WHERE user_id='123e4567-e89b-42d3-a456-426614174000';
          DO $ci$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.platform_replication_outbox WHERE entity_type='account' AND event_type='account.deleted' AND entity_id='123e4567-e89b-42d3-a456-426614174000' AND payload='{}'::jsonb) THEN
              RAISE EXCEPTION 'account privacy change did not emit tombstone';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.platform_replication_outbox WHERE entity_type='post' AND event_type='post.deleted' AND entity_id='123e4567-e89b-42d3-a456-426614174001' AND payload='{}'::jsonb) THEN
              RAISE EXCEPTION 'account privacy change did not tombstone public posts';
            END IF;
          END $ci$;
          INSERT INTO testagram_local.accounts(user_id,username,protected_account)
          VALUES ('123e4567-e89b-42d3-a456-426614174002','ci_private_user',TRUE);
          DO $ci$
          BEGIN
            IF EXISTS (SELECT 1 FROM public.platform_replication_outbox WHERE entity_type='account' AND entity_id='123e4567-e89b-42d3-a456-426614174002') THEN
              RAISE EXCEPTION 'private account must not be projected';
            END IF;
          END $ci$;
          SQL
      - name: Verify Go social privacy decisions against PostgreSQL
        env:
          TESTAGRAM_TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
        run: go test ./cmd/api -run '^TestSocialPostVisibilityPostgresIntegration$' -count=1 -v
      - name: Verify Go interaction summary query against PostgreSQL
        env:
          TESTAGRAM_TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
        run: go test ./cmd/api -run '^TestSocialInteractionSummaryPostgresIntegration$' -count=1 -v
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop testagram-local-product-ci || true

  independent-auth-schema-integration:
    name: Independent authentication schema integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name testagram-auth-ci -e POSTGRES_PASSWORD=ci-only-password -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec testagram-auth-ci pg_isready -U postgres >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs testagram-auth-ci
          exit 1
      - name: Apply schema and verify constraints
        run: |
          set -euo pipefail
          docker exec -i testagram-auth-ci psql -U postgres -v ON_ERROR_STOP=1 < migrations/20261019_testagram_independent_auth.sql
          docker exec -i testagram-auth-ci psql -U postgres -v ON_ERROR_STOP=1 < migrations/20261106_appwrite_identity_bridge.sql
          docker exec -i testagram-auth-ci psql -U postgres -v ON_ERROR_STOP=1 < migrations/20261106_appwrite_identity_link_audit.sql
          docker exec -i testagram-auth-ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO testagram_auth.identities(email,username,password_hash)
          VALUES ('ci@example.test','ci_user','test-hash');
          DO $ci$
          BEGIN
            IF (SELECT count(*) FROM testagram_auth.identities WHERE email_normalized='ci@example.test') <> 1 THEN
              RAISE EXCEPTION 'normalized email lookup failed';
            END IF;
            IF (SELECT count(*) FROM information_schema.columns WHERE table_schema='testagram_auth' AND table_name='identities' AND column_name IN ('verification_token_hash','reset_token_hash','token_version')) <> 3 THEN
              RAISE EXCEPTION 'verification, reset, or token-version columns missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='testagram_identity' AND table_name='appwrite_accounts') THEN
              RAISE EXCEPTION 'Appwrite identity bridge table missing';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema='testagram_identity' AND table_name='link_audit') THEN
              RAISE EXCEPTION 'Appwrite identity link audit table missing';
            END IF;
            INSERT INTO testagram_identity.appwrite_accounts(appwrite_user_id,canonical_user_id,legacy_user_id,email,email_verified,linked_at)
            VALUES ('ci-appwrite-user','123e4567-e89b-42d3-a456-426614174000','123e4567-e89b-42d3-a456-426614174000','ci@example.test',TRUE,now());
            INSERT INTO testagram_identity.link_audit(appwrite_user_id,canonical_user_id,legacy_user_id,event_type,request_id)
            VALUES ('ci-appwrite-user','123e4567-e89b-42d3-a456-426614174000','123e4567-e89b-42d3-a456-426614174000','linked','ci-request');
            IF (SELECT count(*) FROM testagram_identity.link_audit WHERE request_id='ci-request') <> 1 THEN
              RAISE EXCEPTION 'identity link audit write failed';
            END IF;
          END $ci$;
          DO $duplicate$
          BEGIN
            BEGIN
              INSERT INTO testagram_auth.identities(email,username,password_hash)
              VALUES ('CI@EXAMPLE.TEST','another_user','test-hash');
              RAISE EXCEPTION 'case-insensitive duplicate email was accepted';
            EXCEPTION WHEN unique_violation THEN NULL;
            END;
          END $duplicate$;
          SQL
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop testagram-auth-ci || true

  saas-schema-integration:
    name: SaaS tenancy migration integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated PostgreSQL
        run: |
          docker run -d --rm --name testagram-saas-schema-ci \
            -e POSTGRES_PASSWORD=ci-only-password \
            -p 5432:5432 postgres:17-alpine
      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec testagram-saas-schema-ci pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs testagram-saas-schema-ci
          exit 1
      - name: Apply migration twice and assert schema invariants
        run: |
          set -euo pipefail
          docker exec testagram-saas-schema-ci psql -U postgres -v ON_ERROR_STOP=1 -c 'create extension if not exists pgcrypto'
          docker exec -i testagram-saas-schema-ci psql -U postgres -v ON_ERROR_STOP=1 < migrations/009_saas_tenant_hosting.sql
          docker exec -i testagram-saas-schema-ci psql -U postgres -v ON_ERROR_STOP=1 < migrations/009_saas_tenant_hosting.sql
          rls_enabled="$(docker exec testagram-saas-schema-ci psql -U postgres -Atc "select relrowsecurity from pg_class where oid='testagram_saas.tenants'::regclass")"
          test "$rls_enabled" = "t"
          index_count="$(docker exec testagram-saas-schema-ci psql -U postgres -Atc "select count(*) from pg_indexes where schemaname='testagram_saas' and indexname='saas_subscriptions_external_ref_uidx'")"
          test "$index_count" = "1"
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop testagram-saas-schema-ci || true
