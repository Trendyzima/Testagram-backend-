          DO $approval$
          BEGIN
            IF (SELECT count(*) FROM testagram_auth.native_sensitive_action_approvals
                WHERE request_id=(SELECT id FROM testagram_auth.native_sensitive_action_requests WHERE target_reference='ci-release-001')) <> 2 THEN
              RAISE EXCEPTION 'two distinct approval records were not persisted';
            END IF;
          END $approval$;
          UPDATE testagram_auth.staff_principals SET enabled=FALSE
          WHERE user_id='123e4567-e89b-42d3-a456-426614174003';
          DO $revocation$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM testagram_auth.staff_principals WHERE user_id='123e4567-e89b-42d3-a456-426614174003' AND enabled=FALSE) THEN
              RAISE EXCEPTION 'native staff revocation state was not persisted';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM testagram_auth.native_staff_permission_overrides WHERE user_id='123e4567-e89b-42d3-a456-426614174003' AND permission_key='deployment.approve') THEN
              RAISE EXCEPTION 'revocation must preserve permission audit history';
            END IF;
          END $revocation$;
          SQL
      - name: Verify concurrent approval and credential revocation serialize
        shell: bash
        run: |
          set -euo pipefail
          # The preceding permission-revocation fixture disables this principal;
          # restore only this isolated CI fixture before testing lock ordering.
          docker exec testagram-admin-security-ci psql -U postgres -v ON_ERROR_STOP=1 -c "UPDATE testagram_auth.staff_principals SET enabled=TRUE WHERE user_id='123e4567-e89b-42d3-a456-426614174003'; UPDATE testagram_auth.staff_webauthn_credentials SET revoked_at=NULL WHERE user_id='123e4567-e89b-42d3-a456-426614174003';"
          request_id="$(docker exec testagram-admin-security-ci psql -U postgres -Atqc "INSERT INTO testagram_auth.native_sensitive_action_requests (action_type,requested_by_user_id,target_reference,reason,payload,payload_sha256) VALUES ('security.change','123e4567-e89b-42d3-a456-426614174001','ci-concurrent-001','CI validates concurrent approval and revocation serialization','{}'::jsonb,repeat('e',64)) RETURNING id")"
          test -n "$request_id"
          docker exec -i testagram-admin-security-ci psql -U postgres -v request_id="$request_id" <<'SQL'
          INSERT INTO testagram_auth.native_sensitive_action_approvals
            (request_id,approver_user_id,decision,reason,webauthn_rpid,webauthn_credential_id)
          VALUES
            (:'request_id'::uuid,'123e4567-e89b-42d3-a456-426614174002','approved','Concurrent test first approver','ops.testagram.invalid',digest('credential:123e4567-e89b-42d3-a456-426614174002','sha256')),
            (:'request_id'::uuid,'123e4567-e89b-42d3-a456-426614174003','approved','Concurrent test second approver','ops.testagram.invalid',digest('credential:123e4567-e89b-42d3-a456-426614174003','sha256'));
          SQL
          docker exec -i testagram-admin-security-ci psql -U postgres -v ON_ERROR_STOP=1 >/tmp/approval-lock.log 2>&1 <<SQL &
          BEGIN;
          UPDATE testagram_auth.native_sensitive_action_requests SET status='approved',decided_at=now() WHERE id='$request_id'::uuid;
          SELECT pg_sleep(4);
          COMMIT;
          SQL
          approval_pid=$!
          ready=false
          for attempt in $(seq 1 30); do
            holding="$(docker exec testagram-admin-security-ci psql -U postgres -Atqc "SELECT count(*) FROM pg_stat_activity WHERE state='active' AND query LIKE 'SELECT pg_sleep(4)%'")"
            if [[ "$holding" -ge 1 ]]; then ready=true; break; fi
            sleep 0.2
          done
          if [[ "$ready" != true ]]; then
            cat /tmp/approval-lock.log
            kill "$approval_pid" 2>/dev/null || true
            echo "::error::Approval transaction did not reach the expected locked interval."
            exit 1
          fi
          docker exec testagram-admin-security-ci psql -U postgres -v ON_ERROR_STOP=1 -c "UPDATE testagram_auth.staff_webauthn_credentials SET revoked_at=now() WHERE user_id='123e4567-e89b-42d3-a456-426614174003' AND revoked_at IS NULL" >/tmp/revocation-lock.log 2>&1 &
          revocation_pid=$!
          blocked=false
          for attempt in $(seq 1 30); do
            waiting="$(docker exec testagram-admin-security-ci psql -U postgres -Atqc "SELECT count(*) FROM pg_stat_activity WHERE wait_event_type='Lock' AND query LIKE 'UPDATE testagram_auth.staff_webauthn_credentials%'")"
            if [[ "$waiting" -ge 1 ]]; then blocked=true; break; fi
            sleep 0.2
          done
          if [[ "$blocked" != true ]]; then
            cat /tmp/approval-lock.log /tmp/revocation-lock.log
            kill "$approval_pid" "$revocation_pid" 2>/dev/null || true
            echo "::error::Credential revocation did not wait for the in-flight approval transaction."
            exit 1
          fi
          wait "$approval_pid"
          wait "$revocation_pid"
          final_status="$(docker exec testagram-admin-security-ci psql -U postgres -Atqc "SELECT status FROM testagram_auth.native_sensitive_action_requests WHERE id='$request_id'::uuid")"
          revoked_at="$(docker exec testagram-admin-security-ci psql -U postgres -Atqc "SELECT revoked_at IS NOT NULL FROM testagram_auth.staff_webauthn_credentials WHERE user_id='123e4567-e89b-42d3-a456-426614174003'")"
          [[ "$final_status" == "approved" && "$revoked_at" == "t" ]] || {
            echo "::error::Concurrent approval/revocation ordering was not preserved (status=$final_status, revoked=$revoked_at)."
            exit 1
          }
      - name: Stop isolated PostgreSQL
        if: always()
        run: docker stop testagram-admin-security-ci || true

      - name: Stop isolated MinIO services
        if: always()
        run: docker stop testagram-minio-ci testagram-minio-r2 testagram-minio-b2 || true

  social-platform-product-schema-integration:
    name: Social platform product schema PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify lists, drafts, scheduling, stories and moderation schema
        env:
          DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
        run: bash tests/test-social-platform-product-foundation.sh
