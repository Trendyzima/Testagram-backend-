          VALUES ('123e4567-e89b-42d3-a456-426614174002','ci_private_user',TRUE);
          DO $ci$
          BEGIN
            IF EXISTS (SELECT 1 FROM public.platform_replication_outbox WHERE entity_type='account' AND entity_id='123e4567-e89b-42d3-a456-426614174002') THEN
              RAISE EXCEPTION 'private account must not be projected';
            END IF;
          END $ci$;
          SQL
      - name: Verify Go social privacy decisions against PostgreSQL
        env:
          TESTAGRAM_TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres?sslmode=disable
        run: go test ./cmd/api -run '^TestSocialPostVisibilityPostgresIntegration$' -count=1 -v
      - name: Verify Go interaction summary query against PostgreSQL
