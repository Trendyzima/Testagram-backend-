name: Remove orphaned legacy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm_remove_orphaned_workers:
        description: Explicitly authorize deletion after all live-route and dependency guards pass.
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: testagram-cloudflare-legacy-worker-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: inputs.confirm_remove_orphaned_workers == true
    name: Guard and remove proven legacy Worker orphans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify every ingress and dependency before deletion
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::Missing existing CLOUDFLARE_API_TOKEN secret."; exit 1; }

          API="https://api.cloudflare.com/client/v4"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cf_get() {
            local path="$1" output="$2" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 45 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" "$API$path")"
            [[ "$status" == "200" ]] || { echo "::error::Cloudflare GET failed (HTTP $status): $path"; return 1; }
            jq -e '.success == true' "$output" >/dev/null
          }

          cf_delete() {
            local path="$1" output="$2" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 45 -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" "$API$path")"
            [[ "$status" == "200" || "$status" == "202" ]] || {
              echo "::error::Cloudflare DELETE failed (HTTP $status): $path"
              jq -r '(.errors // [])[]? | .message // "Cloudflare API error"' "$output" >&2 || true
              return 1
            }
            jq -e '.success == true' "$output" >/dev/null
          }

          cf_get "/user/tokens/verify" "$tmp/token.json"
          [[ "$(jq -r '.result.status // "unknown"' "$tmp/token.json")" == "active" ]] || {
            echo "::error::Cloudflare token is not active."
            exit 1
          }

          # Resolve the account from the actual testagram.site zone row, not page one.
          : > "$tmp/zones.tsv"
          page=1
          while :; do
            cf_get "/zones?per_page=50&page=$page" "$tmp/zones-$page.json"
            jq -r '.result[]? | [.id, .name, (.account.id // "")] | @tsv' "$tmp/zones-$page.json" >> "$tmp/zones.tsv"
            pages="$(jq -r '.result_info.total_pages // 1' "$tmp/zones-$page.json")"
            [[ "$page" -ge "$pages" ]] && break
            page=$((page + 1))
          done

          account_id="$(awk -F '\t' '$2=="testagram.site" {print $3; exit}' "$tmp/zones.tsv")"
          [[ -n "$account_id" ]] || { echo "::error::Could not resolve the Cloudflare account from the testagram.site zone."; exit 1; }

          # Inventory every route and every script, following API pagination.
          : > "$tmp/routes.tsv"
          while IFS=$'\t' read -r zone_id zone_name zone_account_id; do
            [[ -z "$zone_id" ]] && continue
            cf_get "/zones/$zone_id/workers/routes" "$tmp/routes-$zone_id.json"
            jq -r --arg zone "$zone_name" '.result[]? | [.script // "", .pattern // "", $zone] | @tsv' "$tmp/routes-$zone_id.json" >> "$tmp/routes.tsv"
          done < "$tmp/zones.tsv"

          : > "$tmp/scripts.txt"
          page=1
          while :; do
            cf_get "/accounts/$account_id/workers/scripts?per_page=100&page=$page" "$tmp/scripts-$page.json"
            jq -r '.result[]?.id // empty' "$tmp/scripts-$page.json" >> "$tmp/scripts.txt"
            pages="$(jq -r '.result_info.total_pages // 1' "$tmp/scripts-$page.json")"
            [[ "$page" -ge "$pages" ]] && break
            page=$((page + 1))
          done
          sort -u "$tmp/scripts.txt" -o "$tmp/scripts.txt"

          # Worker Custom Domains are a separate ingress path from zone Routes.
          : > "$tmp/worker-domains.tsv"
          page=1
          while :; do
            cf_get "/accounts/$account_id/workers/domains?per_page=100&page=$page" "$tmp/domains-$page.json"
            jq -r '.result[]? | [.service // "", .hostname // "", (.enabled // false | tostring)] | @tsv' "$tmp/domains-$page.json" >> "$tmp/worker-domains.tsv"
            pages="$(jq -r '.result_info.total_pages // 1' "$tmp/domains-$page.json")"
            [[ "$page" -ge "$pages" ]] && break
            page=$((page + 1))
          done

          # Only exact, previously observed legacy candidates are eligible.
          # testagram-federation is deliberately excluded pending ownership/dependency proof.
          candidates=(
            "testagram-api|supabase"
            "testagram-heartbeat|supabase"
            "xclone-9b4dz1-9b4dz1-8936-20260809|xclone"
          )

          {
            echo "## Cloudflare legacy Worker cleanup"
            echo "- Cloudflare token: active"
            echo "- Account resolution: derived from the testagram.site zone record"
            echo "- Ingress checked: all zone routes, all Worker Custom Domains and workers.dev subdomain state"
            echo "- Dependencies checked: schedules, service/workflow bindings, tail consumers and references from other Workers"
            echo "- Only exact candidates with matching legacy source markers can be removed"
            echo "- No DNS records, Pages projects/domains, R2 buckets or account settings are modified"
            echo ""
            echo "| Candidate | Result |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for item in "${candidates[@]}"; do
            worker="${item%%|*}"
            marker="${item#*|}"

            if ! grep -Fxq "$worker" "$tmp/scripts.txt"; then
              printf '| %s | already absent; no action |\n' "$worker" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if awk -F '\t' -v w="$worker" '$1==w {found=1} END {exit !found}' "$tmp/routes.tsv"; then
              echo "::error::$worker still has a zone route; refusing deletion."
              exit 1
            fi

            if awk -F '\t' -v w="$worker" '$1==w {found=1} END {exit !found}' "$tmp/worker-domains.tsv"; then
              echo "::error::$worker still has a Worker Custom Domain (enabled or disabled); detach and review it separately."
              exit 1
            fi

            # workers.dev is independent of zone routes and Custom Domains.
            cf_get "/accounts/$account_id/workers/scripts/$worker/subdomain" "$tmp/subdomain.json"
            if [[ "$(jq -r '.result.enabled // "unknown"' "$tmp/subdomain.json")" != "false" ||
                  "$(jq -r '.result.previews_enabled // "unknown"' "$tmp/subdomain.json")" != "false" ]]; then
              echo "::error::$worker still has workers.dev or preview ingress enabled/unknown; refusing deletion."
              exit 1
            fi

            cf_get "/accounts/$account_id/workers/scripts/$worker/schedules" "$tmp/schedules.json"
            if [[ "$(jq -r '.result.schedules // [] | length' "$tmp/schedules.json")" != "0" ]]; then
              echo "::error::$worker still has Cron triggers; refusing deletion."
              exit 1
            fi

            cf_get "/accounts/$account_id/workers/scripts/$worker/settings" "$tmp/target-settings.json"
            if [[ "$(jq -r '.result.bindings // [] | map(select(.type == "service" or .type == "workflow")) | length' "$tmp/target-settings.json")" != "0" ]]; then
              echo "::error::$worker has service/workflow bindings; refusing deletion."
              exit 1
            fi

            cf_get "/accounts/$account_id/workers/scripts/$worker/script-settings" "$tmp/target-script-settings.json"
            if [[ "$(jq -r '.result.tail_consumers // [] | length' "$tmp/target-script-settings.json")" != "0" ]]; then
              echo "::error::$worker has tail consumers; refusing deletion."
              exit 1
            fi

            # A different Worker may call this Worker through a service binding.
            while IFS= read -r other; do
              [[ -z "$other" || "$other" == "$worker" ]] && continue
              cf_get "/accounts/$account_id/workers/scripts/$other/settings" "$tmp/other-settings.json"
              if jq -e --arg target "$worker" '.result.bindings // [] | any((.type == "service" and .service == $target) or (.type == "workflow" and .workflow_name == $target))' "$tmp/other-settings.json" >/dev/null; then
                echo "::error::$worker is referenced by $other; refusing deletion."
                exit 1
              fi
              cf_get "/accounts/$account_id/workers/scripts/$other/script-settings" "$tmp/other-script-settings.json"
              if jq -e --arg target "$worker" '.result.tail_consumers // [] | any(.service == $target)' "$tmp/other-script-settings.json" >/dev/null; then
                echo "::error::$worker is referenced as a tail consumer by $other; refusing deletion."
                exit 1
              fi
            done < "$tmp/scripts.txt"

            curl --silent --show-error --fail --connect-timeout 10 --max-time 45 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API/accounts/$account_id/workers/scripts/$worker/content/v2" -o "$tmp/source"
            if ! grep -Eiq "$marker" "$tmp/source"; then
              echo "::error::$worker source no longer matches the expected $marker marker; refusing deletion."
              exit 1
            fi

            # Destructive action occurs only after all independent ingress/dependency
            # checks have succeeded and the workflow_dispatch confirmation was true.
            cf_delete "/accounts/$account_id/workers/scripts/$worker" "$tmp/delete.json"
            printf '| %s | deleted after all guards passed |\n' "$worker" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Cleanup completed. No DNS, routes, Worker Custom Domains, Pages, R2 or account configuration was changed." >> "$GITHUB_STEP_SUMMARY"
