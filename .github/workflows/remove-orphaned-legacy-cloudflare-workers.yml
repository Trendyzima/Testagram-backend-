name: Remove orphaned legacy Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      confirm_remove_orphaned_workers:
        description: Delete only explicitly listed legacy Workers after route, custom-domain, schedule, service-binding, replacement-health and source checks pass.
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: testagram-cloudflare-legacy-worker-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: inputs.confirm_remove_orphaned_workers == true
    name: Guard and remove unreferenced legacy Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify and remove only proven orphans
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::Missing existing CLOUDFLARE_API_TOKEN secret."; exit 1; }

          API="https://api.cloudflare.com/client/v4"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cf_get() {
            local path="$1" output="$2" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 45 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" "$API$path")"
            [[ "$status" == "200" ]] || { echo "::error::Cloudflare GET failed (HTTP $status): $path"; return 1; }
            jq -e '.success == true' "$output" >/dev/null
          }

          cf_delete() {
            local path="$1" output="$2" status
            status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
              --connect-timeout 10 --max-time 45 -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Accept: application/json" "$API$path")"
            [[ "$status" == "200" || "$status" == "202" ]] || {
              echo "::error::Cloudflare DELETE failed (HTTP $status): $path"
              jq -r '(.errors // [])[]? | .message // "Cloudflare API error"' "$output" >&2 || true
              return 1
            }
            jq -e '.success == true' "$output" >/dev/null
          }

          cf_get "/user/tokens/verify" "$tmp/token.json"
          [[ "$(jq -r '.result.status // "unknown"' "$tmp/token.json")" == "active" ]] || {
            echo "::error::Cloudflare token is not active."
            exit 1
          }

          : > "$tmp/zones.tsv"
          : > "$tmp/routes.tsv"
          page=1
          while :; do
            cf_get "/zones?per_page=50&page=$page" "$tmp/zones-$page.json"
            jq -r '.result[]? | [.id, .name, (.account.id // "")] | @tsv' "$tmp/zones-$page.json" >> "$tmp/zones.tsv"
            pages="$(jq -r '.result_info.total_pages // 1' "$tmp/zones-$page.json")"
            [[ "$page" -ge "$pages" ]] && break
            page=$((page + 1))
          done

          testagram_zone_id="$(awk -F '\t' '$2=="testagram.site" {print $1; exit}' "$tmp/zones.tsv")"
          account_id="$(awk -F '\t' '$2=="testagram.site" {print $3; exit}' "$tmp/zones.tsv")"
          [[ -n "$testagram_zone_id" && -n "$account_id" ]] || {
            echo "::error::The active testagram.site zone or its account could not be resolved."
            exit 1
          }

          while IFS=

          # These candidates were observed as legacy residue in a read-only audit.
          # Re-check zone zone routes, custom domains, workers.dev/preview URLs, Cron, service bindings and consumers
          # immediately before deletion. Active web/CDN Workers are excluded.
          candidates=(
            "testagram-api"
            "testagram-heartbeat"
            "testagram-federation"
            "xclone-9b4dz1-9b4dz1-8936-20260809"
          )

          echo "## Cloudflare orphan cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Only explicitly named legacy Workers are considered." >> "$GITHUB_STEP_SUMMARY"
          echo "- Every candidate is rechecked for zone routes, Worker custom domains, Cron triggers, service bindings, consumers and legacy source markers." >> "$GITHUB_STEP_SUMMARY"
          echo "- testagram-api additionally requires exactly one enabled, non-preview api.testagram.site binding to testagram-cdn and a successful live Backend health response." >> "$GITHUB_STEP_SUMMARY"
          echo "- testagram-web and testagram-cdn are not deletion candidates because they still have live routes/triggers." >> "$GITHUB_STEP_SUMMARY"

          for worker in "${candidates[@]}"; do
            if ! grep -Fxq "$worker" "$tmp/scripts.txt"; then
              echo "- $worker: already absent; no action." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if awk -F '\t' -v w="$worker" '$2==w {found=1} END {exit !found}' "$tmp/routes.tsv"; then
              echo "::error::$worker still has a live zone route; refusing deletion."
              exit 1
            fi

            if awk -F '\t' -v w="$worker" '$2==w {found=1} END {exit !found}' "$tmp/domains.tsv"; then
              echo "::error::$worker still owns a Worker custom domain; refusing deletion."
              exit 1
            fi

            if [[ "$worker" == "testagram-api" ]]; then
              api_domain_count="$(awk -F '\t' '$1=="api.testagram.site" {count++} END {print count+0}' "$tmp/domains.tsv")"
              canonical_api_domain_count="$(awk -F '\t' '$1=="api.testagram.site" && $2=="testagram-cdn" && $4=="true" && $5=="false" {count++} END {print count+0}' "$tmp/domains.tsv")"
              [[ "$api_domain_count" == "1" && "$canonical_api_domain_count" == "1" ]] || {
                echo "::error::The canonical API custom domain is not uniquely attached to testagram-cdn; refusing legacy API Worker deletion."
                exit 1
              }
              api_health_status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 \
                --output "$tmp/api-health.json" --write-out '%{http_code}' https://api.testagram.site/healthz || true)"
              [[ "$api_health_status" == "200" ]] && jq -e '.ok == true and .service == "testagram-api"' "$tmp/api-health.json" >/dev/null || {
                echo "::error::The canonical Backend health endpoint is not healthy through api.testagram.site; refusing legacy API Worker deletion."
                exit 1
              }
            fi

            cf_get "/accounts/$account_id/workers/scripts/$worker/subdomain" "$tmp/target-subdomain.json"
            workers_dev_enabled="$(jq -r '.result.enabled // "unknown"' "$tmp/target-subdomain.json")"
            preview_urls_enabled="$(jq -r '.result.previews_enabled // "unknown"' "$tmp/target-subdomain.json")"
            if [[ "$workers_dev_enabled" != "false" || "$preview_urls_enabled" != "false" ]]; then
              echo "::error::$worker still has a public workers.dev or preview URL (or its state is unknown); refusing deletion."
              exit 1
            fi

            cf_get "/accounts/$account_id/workers/scripts/$worker/schedules" "$tmp/schedules.json"
            if [[ "$(jq -r '.result.schedules // [] | length' "$tmp/schedules.json")" != "0" ]]; then
              echo "::error::$worker still has Cron triggers; refusing deletion."
              exit 1
            fi

            cf_get "/accounts/$account_id/workers/scripts/$worker/settings" "$tmp/target-settings.json"
            if [[ "$(jq -r '.result.bindings // [] | map(select(.type == "service")) | length' "$tmp/target-settings.json")" != "0" ]]; then
              echo "::error::$worker has service bindings; refusing deletion."
              exit 1
            fi

            cf_get "/accounts/$account_id/workers/scripts/$worker/script-settings" "$tmp/target-script-settings.json"
            if [[ "$(jq -r '.result.tail_consumers // [] | length' "$tmp/target-script-settings.json")" != "0" ]]; then
              echo "::error::$worker has tail consumers; refusing deletion."
              exit 1
            fi

            # Check all other scripts for service bindings targeting this candidate.
            while IFS= read -r other; do
              [[ -z "$other" || "$other" == "$worker" ]] && continue
              cf_get "/accounts/$account_id/workers/scripts/$other/settings" "$tmp/other-settings.json"
              if jq -e --arg target "$worker" '.result.bindings // [] | any(.type == "service" and .service == $target)' "$tmp/other-settings.json" >/dev/null; then
                echo "::error::$worker is referenced by service binding in $other; refusing deletion."
                exit 1
              fi
            done < "$tmp/scripts.txt"

            curl --silent --show-error --fail --connect-timeout 10 --max-time 45 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API/accounts/$account_id/workers/scripts/$worker/content/v2" -o "$tmp/source"
            if [[ "$worker" == xclone-* ]]; then
              :
            elif ! grep -Eiq 'supabase|sb-project-ref' "$tmp/source"; then
              echo "::error::$worker no longer contains a legacy Supabase marker; refusing deletion."
              exit 1
            fi

            cf_delete "/accounts/$account_id/workers/scripts/$worker" "$tmp/delete.json"
            echo "- $worker: deleted after all safety guards passed." >> "$GITHUB_STEP_SUMMARY"
          done

          echo "Cleanup finished. No DNS records, Worker routes, Pages domains, R2 buckets or account settings were modified." >> "$GITHUB_STEP_SUMMARY"
\t' read -r zone_id zone_name _zone_account; do
            [[ -z "$zone_id" ]] && continue
            cf_get "/zones/$zone_id/workers/routes" "$tmp/routes-$zone_id.json"
            jq -r '.result[]? | [.pattern, (.script // "")] | @tsv' "$tmp/routes-$zone_id.json" >> "$tmp/routes.tsv"
          done < "$tmp/zones.tsv"

          # Enumerate every script and every custom-domain binding. These are
          # separate Cloudflare attachment mechanisms; a route-only check is
          # not proof that a Worker is detached.
          : > "$tmp/scripts.txt"
          page=1
          while :; do
            cf_get "/accounts/$account_id/workers/scripts?per_page=100&page=$page" "$tmp/scripts-$page.json"
            jq -r '.result[]?.id // empty' "$tmp/scripts-$page.json" >> "$tmp/scripts.txt"
            pages="$(jq -r '.result_info.total_pages // 1' "$tmp/scripts-$page.json")"
            [[ "$page" -ge "$pages" ]] && break
            page=$((page + 1))
          done

          : > "$tmp/domains.tsv"
          page=1
          while :; do
            cf_get "/accounts/$account_id/workers/domains?per_page=100&page=$page" "$tmp/domains-$page.json"
            jq -r '.result[]? | [(.hostname // ""), (.service // ""), (.environment // ""), ((.enabled // false)|tostring), ((.previews_enabled // false)|tostring)] | @tsv' "$tmp/domains-$page.json" >> "$tmp/domains.tsv"
            pages="$(jq -r '.result_info.total_pages // 1' "$tmp/domains-$page.json")"
            [[ "$page" -ge "$pages" ]] && break
            page=$((page + 1))
          done

          # These candidates were observed with no zone routes, no Cron triggers,
          # and no service bindings in the read-only audit. Re-check every condition
          # immediately before deletion. Active web/CDN Workers are intentionally
          # excluded and must be cut over separately.
          candidates=(
            "testagram-api"
            "testagram-heartbeat"
            "testagram-federation"
            "xclone-9b4dz1-9b4dz1-8936-20260809"
          )

          echo "## Cloudflare orphan cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Only explicitly named legacy Workers are considered." >> "$GITHUB_STEP_SUMMARY"
          echo "- Every candidate is rechecked for routes, Cron triggers, service bindings and legacy source markers." >> "$GITHUB_STEP_SUMMARY"
          echo "- testagram-web and testagram-cdn are not deletion candidates because they still have live routes/triggers." >> "$GITHUB_STEP_SUMMARY"

          for worker in "${candidates[@]}"; do
            if ! grep -Fxq "$worker" "$tmp/scripts.txt"; then
              echo "- $worker: already absent; no action." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if awk -F '\t' -v w="$worker" '$2==w {found=1} END {exit !found}' "$tmp/routes.tsv"; then
              echo "::error::$worker still has a live zone route; refusing deletion."
              exit 1
            fi

            cf_get "/accounts/$account_id/workers/scripts/$worker/schedules" "$tmp/schedules.json"
            if [[ "$(jq -r '.result.schedules // [] | length' "$tmp/schedules.json")" != "0" ]]; then
              echo "::error::$worker still has Cron triggers; refusing deletion."
              exit 1
            fi

            cf_get "/accounts/$account_id/workers/scripts/$worker/settings" "$tmp/target-settings.json"
            if [[ "$(jq -r '.result.bindings // [] | map(select(.type == "service")) | length' "$tmp/target-settings.json")" != "0" ]]; then
              echo "::error::$worker has service bindings; refusing deletion."
              exit 1
            fi

            cf_get "/accounts/$account_id/workers/scripts/$worker/script-settings" "$tmp/target-script-settings.json"
            if [[ "$(jq -r '.result.tail_consumers // [] | length' "$tmp/target-script-settings.json")" != "0" ]]; then
              echo "::error::$worker has tail consumers; refusing deletion."
              exit 1
            fi

            # Check all other scripts for service bindings targeting this candidate.
            while IFS= read -r other; do
              [[ -z "$other" || "$other" == "$worker" ]] && continue
              cf_get "/accounts/$account_id/workers/scripts/$other/settings" "$tmp/other-settings.json"
              if jq -e --arg target "$worker" '.result.bindings // [] | any(.type == "service" and .service == $target)' "$tmp/other-settings.json" >/dev/null; then
                echo "::error::$worker is referenced by service binding in $other; refusing deletion."
                exit 1
              fi
            done < "$tmp/scripts.txt"

            curl --silent --show-error --fail --connect-timeout 10 --max-time 45 \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API/accounts/$account_id/workers/scripts/$worker/content/v2" -o "$tmp/source"
            if [[ "$worker" == xclone-* ]]; then
              :
            elif ! grep -Eiq 'supabase|sb-project-ref' "$tmp/source"; then
              echo "::error::$worker no longer contains a legacy Supabase marker; refusing deletion."
              exit 1
            fi

            cf_delete "/accounts/$account_id/workers/scripts/$worker" "$tmp/delete.json"
            echo "- $worker: deleted after all safety guards passed." >> "$GITHUB_STEP_SUMMARY"
          done

          echo "Cleanup finished. No DNS records, Worker routes, Pages domains, R2 buckets or account settings were modified." >> "$GITHUB_STEP_SUMMARY"
