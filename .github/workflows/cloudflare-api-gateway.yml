name: Test and deploy Testagram API edge gateway

on:
  pull_request:
    paths:
      - "infra/cloudflare-api-gateway/**"
      - ".github/workflows/cloudflare-api-gateway.yml"
      - "tests/test_cloudflare_api_gateway_deployment_order.py"
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Deploy the API hostname route to Cloudflare production.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: testagram-cloudflare-api-edge
  cancel-in-progress: false

jobs:
  test:
    name: Test API edge proxy contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check infra/cloudflare-api-gateway/src/index.mjs
      - name: Unit tests
        run: node --test infra/cloudflare-api-gateway/test/index.test.mjs
      - name: Verify production route and secret activation order
        run: python3 tests/test_cloudflare_api_gateway_deployment_order.py -v
      - name: Build Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run --outdir "${RUNNER_TEMP}/testagram-api-edge-build" --config infra/cloudflare-api-gateway/wrangler.toml

  deploy:
    name: Deploy production API hostname route
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == true
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify DNS, Worker custom domains and route ownership before cutover
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          API="https://api.cloudflare.com/client/v4"
          ACCOUNT_ID="77dbe7a859196105dc84fbb6b7094019"
          ZONE_NAME="testagram.site"
          HOSTNAME="api.testagram.site"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error::Missing scoped Cloudflare deployment token."; exit 1; }
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json")

          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" \
            "$API/zones?name=$ZONE_NAME&status=active" -o "$tmp/zone.json"
          jq -e --arg name "$ZONE_NAME" --arg account "$ACCOUNT_ID" '
            .success == true and (.result | length == 1) and
            .result[0].name == $name and .result[0].status == "active" and
            .result[0].account.id == $account
          ' "$tmp/zone.json" >/dev/null || { echo "::error::Expected exactly one active testagram.site zone in the pinned Cloudflare account."; exit 1; }
          zone_id="$(jq -er '.result[0].id' "$tmp/zone.json")"
          [[ -n "$zone_id" ]] || { echo "::error::Active Testagram zone was not found."; exit 1; }

          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" \
            "$API/zones/$zone_id/dns_records?name=$HOSTNAME" -o "$tmp/dns.json"
          jq -e '.success == true' "$tmp/dns.json" >/dev/null || { echo "::error::Cloudflare DNS lookup failed."; exit 1; }
          jq -e --arg name "$HOSTNAME" '.result | any(.name == $name and .proxied == true and (.type == "A" or .type == "AAAA"))' "$tmp/dns.json" >/dev/null || {
            echo "::error::api.testagram.site must have a proxied A/AAAA DNS record before a Worker route can serve it."
            exit 1
          }

          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" \
            "$API/accounts/$ACCOUNT_ID/workers/domains?hostname=$HOSTNAME" -o "$tmp/domains.json"
          jq -e '.success == true' "$tmp/domains.json" >/dev/null || { echo "::error::Cloudflare Worker custom-domain lookup failed."; exit 1; }
          domain_count="$(jq -r --arg host "$HOSTNAME" '[.result[]? | select(.hostname == $host)] | length' "$tmp/domains.json")"
          if [[ "$domain_count" -gt 1 ]]; then
            echo "::error::Multiple Worker Custom Domains claim api.testagram.site. Resolve the duplicate ownership before cutover."
            exit 1
          fi
          if [[ "$domain_count" == "1" ]] &&
             ! jq -e --arg host "$HOSTNAME" '
               .result | any(.hostname == $host and .service == "testagram-api" and .zone_name == "testagram.site")
             ' "$tmp/domains.json" >/dev/null; then
            echo "::error::An unexpected Worker Custom Domain owns api.testagram.site. Only the known legacy testagram-api owner may be shadowed by the new route."
            exit 1
          fi

          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" \
            "$API/zones/$zone_id/workers/routes" -o "$tmp/routes.json"
          jq -e '.success == true' "$tmp/routes.json" >/dev/null || { echo "::error::Cloudflare Worker route lookup failed."; exit 1; }
          if jq -e --arg host "$HOSTNAME" --arg script "testagram-api-edge" '
            .result | any(
              ((.pattern == $host) or (.pattern | startswith($host + "/"))) and
              (.script // "") != $script
            )
          ' "$tmp/routes.json" >/dev/null; then
            echo "::error::A different Worker owns an api.testagram.site route. Refusing a partial or overlapping cutover."
            exit 1
          fi

          echo "Cloudflare cutover preflight passed: active zone, proxied DNS, only the known legacy testagram-api custom-domain owner (if present), and no conflicting Worker route." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Worker and attach api.testagram.site route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
          EDGE_PROXY_SHARED_TOKEN: ${{ secrets.TESTAGRAM_EDGE_PROXY_SHARED_TOKEN }}
          TESTAGRAM_CLOUDFLARE_EVENTS_TOKEN: ${{ secrets.TESTAGRAM_CLOUDFLARE_EVENTS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then echo "::error::Add CLOUDFLARE_WORKERS_DEPLOY_TOKEN with Account.Workers Scripts:Edit scoped to account 77dbe7a859196105dc84fbb6b7094019, plus Zone.Workers Routes:Edit, Zone:Read and DNS:Read scoped to testagram.site. Keep the read-only audit token separate."; exit 1; fi
          if [[ ! "${EDGE_PROXY_SHARED_TOKEN:-}" =~ ^[a-fA-F0-9]{64}$ ]]; then echo "::error::Add TESTAGRAM_EDGE_PROXY_SHARED_TOKEN as exactly 32 random bytes encoded in 64 hexadecimal characters; it must match EDGE_PROXY_SHARED_TOKEN in the InstaBox Caddy .env."; exit 1; fi
          if [[ ! "${TESTAGRAM_CLOUDFLARE_EVENTS_TOKEN:-}" =~ ^[a-fA-F0-9]{64}$ ]]; then echo "::error::Add TESTAGRAM_CLOUDFLARE_EVENTS_TOKEN as an independent 32-byte hex secret shared with the backend runtime."; exit 1; fi
          API="https://api.cloudflare.com/client/v4"
          ACCOUNT_ID="77dbe7a859196105dc84fbb6b7094019"
          ZONE_NAME="testagram.site"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json")
          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" "$API/zones?name=$ZONE_NAME&status=active" -o "$RUNNER_TEMP/mail-zone.json"
          zone_id="$(jq -er --arg name "$ZONE_NAME" --arg account "$ACCOUNT_ID" '.result[] | select(.name == $name and .account.id == $account and .status == "active") | .id' "$RUNNER_TEMP/mail-zone.json")"
          ensure_queue() {
            local queue_name="$1"
            curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" "$API/accounts/$ACCOUNT_ID/queues?per_page=100" -o "$RUNNER_TEMP/queues.json"
            jq -e --arg name "$queue_name" '.success == true and any(.result[]?; .queue_name == $name)' "$RUNNER_TEMP/queues.json" >/dev/null && return 0
            jq -nc --arg name "$queue_name" '{queue_name:$name}' > "$RUNNER_TEMP/create-queue.json"
            curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" -H "Content-Type: application/json" -X POST --data-binary @"$RUNNER_TEMP/create-queue.json" "$API/accounts/$ACCOUNT_ID/queues" -o "$RUNNER_TEMP/queue-created.json"
            jq -e --arg name "$queue_name" '.success == true and .result.queue_name == $name' "$RUNNER_TEMP/queue-created.json" >/dev/null
          }
          ensure_queue "testagram-mail-delivery-events"
          ensure_queue "testagram-mail-delivery-events-dlq"
          # wrangler.toml intentionally has no public route. Deploy the private
          # Worker script first, then install its secret before exposing traffic.
          npx --yes wrangler@4 deploy --config infra/cloudflare-api-gateway/wrangler.toml
          printf '%s' "$EDGE_PROXY_SHARED_TOKEN" | npx --yes wrangler@4 secret put EDGE_PROXY_SHARED_TOKEN --config infra/cloudflare-api-gateway/wrangler.toml
          printf '%s' "$TESTAGRAM_CLOUDFLARE_EVENTS_TOKEN" | npx --yes wrangler@4 secret put TESTAGRAM_CLOUDFLARE_EVENTS_TOKEN --config infra/cloudflare-api-gateway/wrangler.toml

          # Recheck route ownership to close the preflight-to-deploy race. The
          # route is attached only after the secret is present, avoiding a
          # public 503 window during first deployment.
          API="https://api.cloudflare.com/client/v4"
          ACCOUNT_ID="77dbe7a859196105dc84fbb6b7094019"
          ZONE_NAME="testagram.site"
          HOSTNAME="api.testagram.site"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Accept: application/json")
          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" \
            "$API/zones?name=$ZONE_NAME&status=active" -o "$RUNNER_TEMP/edge-zone.json"
          jq -e --arg name "$ZONE_NAME" --arg account "$ACCOUNT_ID" '
            .success == true and (.result | length == 1) and
            .result[0].name == $name and .result[0].status == "active" and
            .result[0].account.id == $account
          ' "$RUNNER_TEMP/edge-zone.json" >/dev/null || { echo "::error::Cloudflare zone/account changed after preflight; refusing route attachment."; exit 1; }
          zone_id="$(jq -er '.result[0].id' "$RUNNER_TEMP/edge-zone.json")"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" \
            "$API/zones/$zone_id/workers/routes" -o "$RUNNER_TEMP/edge-routes.json"
          jq -e '.success == true' "$RUNNER_TEMP/edge-routes.json" >/dev/null || { echo "::error::Could not re-read Worker routes before attachment."; exit 1; }
          if jq -e --arg host "$HOSTNAME" --arg script "testagram-api-edge" '
            .result | any(
              ((.pattern == $host) or (.pattern | startswith($host + "/"))) and
              (.script // "") != $script
            )
          ' "$RUNNER_TEMP/edge-routes.json" >/dev/null; then
            echo "::error::An overlapping API route changed owner after preflight; refusing attachment."
            exit 1
          fi
          route_count="$(jq -r --arg pattern "$HOSTNAME/*" --arg script "testagram-api-edge" '[.result[]? | select(.pattern == $pattern and .script == $script)] | length' "$RUNNER_TEMP/edge-routes.json")"
          if [[ "$route_count" == "0" ]]; then
            jq -nc --arg pattern "$HOSTNAME/*" --arg script "testagram-api-edge" '{pattern:$pattern,script:$script}' > "$RUNNER_TEMP/edge-route.json"
            curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" \
              -H "Content-Type: application/json" -X POST \
              --data-binary @"$RUNNER_TEMP/edge-route.json" \
              "$API/zones/$zone_id/workers/routes" -o "$RUNNER_TEMP/edge-route-created.json"
            jq -e --arg pattern "$HOSTNAME/*" --arg script "testagram-api-edge" \
              '.success == true and .result.pattern == $pattern and .result.script == $script' \
              "$RUNNER_TEMP/edge-route-created.json" >/dev/null || {
                echo "::error::Cloudflare did not confirm ownership of the canonical API route."
                exit 1
              }
          elif [[ "$route_count" != "1" ]]; then
            echo "::error::Duplicate canonical API routes exist; refusing ambiguous ownership."
            exit 1
          fi
          curl --silent --show-error --fail --connect-timeout 10 --max-time 30 "${auth[@]}" \
            "$API/zones/$zone_id/workers/routes" -o "$RUNNER_TEMP/edge-routes-verified.json"
          jq -e --arg pattern "$HOSTNAME/*" --arg script "testagram-api-edge" \
            '.success == true and (.result | any(.pattern == $pattern and .script == $script))' \
            "$RUNNER_TEMP/edge-routes-verified.json" >/dev/null || {
              echo "::error::Canonical API route was not verified after attachment."
              exit 1
            }
          echo "API edge secret installed before route attachment; canonical route ownership verified." >> "$GITHUB_STEP_SUMMARY"
          # Ensure the existing API edge Worker receives all six lifecycle events.
          npx --yes wrangler@4 queues subscription list testagram-mail-delivery-events --json > "$RUNNER_TEMP/mail-subscriptions.json"
          subscription_id="$(jq -r --arg name "testagram-mail-delivery-events-testagram-site" '(.result // .)[]? | select(.name == $name and .source.type == "email.sending" and .source.domain == "testagram.site") | .id' "$RUNNER_TEMP/mail-subscriptions.json" | head -n 1)"
          event_list="message.delivered,message.deferred,message.bounced,message.failed,message.rejected,message.complained"
          if [[ -n "$subscription_id" ]]; then
            npx --yes wrangler@4 queues subscription update testagram-mail-delivery-events --id "$subscription_id" --events "$event_list" --enabled true
          else
            npx --yes wrangler@4 queues subscription create testagram-mail-delivery-events --source email.sending --zone-id "$zone_id" --domain testagram.site --events "$event_list" --name testagram-mail-delivery-events-testagram-site
          fi
          npx --yes wrangler@4 queues subscription list testagram-mail-delivery-events --json > "$RUNNER_TEMP/mail-subscriptions-verified.json"
          jq -e --arg name "testagram-mail-delivery-events-testagram-site" --argjson expected '["message.delivered","message.deferred","message.bounced","message.failed","message.rejected","message.complained"]' '(.result // .) | any(.[]?; .name == $name and .enabled == true and (.events | sort) == ($expected | sort))' "$RUNNER_TEMP/mail-subscriptions-verified.json" >/dev/null || { echo "::error::Cloudflare Email Sending event subscription could not be verified."; exit 1; }
          echo "Cloudflare Email Sending event queue, dead-letter queue, Worker consumer secrets and six-event subscription verified." >> "$GITHUB_STEP_SUMMARY"
      - name: Verify canonical API ingress after deployment
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # These are deliberate, one-time GET probes after an operator-approved
          # deployment. They may wake an idle-paused InstaBox machine.
          success=false
          for delay in 0 2 4 8 16; do
            if [[ "$delay" != "0" ]]; then sleep "$delay"; fi
            health_status="$(curl --silent --show-error --output "$tmp/health.json" --write-out '%{http_code}' --connect-timeout 10 --max-time 35 https://api.testagram.site/healthz || true)"
            search_status="$(curl --silent --show-error --output "$tmp/search.json" --write-out '%{http_code}' --connect-timeout 10 --max-time 35 'https://api.testagram.site/api/search?q=testagram' || true)"
            feed_status="$(curl --silent --show-error --output "$tmp/feed.json" --write-out '%{http_code}' --connect-timeout 10 --max-time 35 https://api.testagram.site/api/feed/home || true)"

            if [[ "$health_status" == "200" ]] &&
               jq -e '.ok == true and .service == "testagram-api"' "$tmp/health.json" >/dev/null &&
               [[ "$search_status" == "200" ]] &&
               [[ "$feed_status" == "401" ]]; then
              success=true
              break
            fi
          done

          [[ "$success" == "true" ]] || {
            echo "::error::Canonical API ingress acceptance failed. Expected health=200, search=200, unauthenticated feed=401. No write request was replayed."
            echo "Observed statuses: health=$health_status search=$search_status feed=$feed_status"
            exit 1
          }
          echo "Canonical API ingress passed: health=200, search=200, unauthenticated feed=401." >> "$GITHUB_STEP_SUMMARY"
