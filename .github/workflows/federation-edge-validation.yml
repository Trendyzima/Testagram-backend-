name: Federation apex edge validation

on:
  pull_request:
    paths:
      - "deploy/self-hosted/Caddyfile"
      - ".github/workflows/federation-edge-validation.yml"
  push:
    branches: [main]
    paths:
      - "deploy/self-hosted/Caddyfile"
      - ".github/workflows/federation-edge-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate canonical Caddy edge configuration
        env:
          API_DOMAIN: api.testagram.site
          MEDIA_DOMAIN: media.testagram.site
          ADMIN_DOMAIN: ops.testagram.site
          ACME_EMAIL: ci@example.invalid
        run: |
          set -euo pipefail
          docker run --rm \
            -e API_DOMAIN -e MEDIA_DOMAIN -e ADMIN_DOMAIN -e ACME_EMAIL \
            -v "$PWD/deploy/self-hosted/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          grep -Fq 'testagram.site {' deploy/self-hosted/Caddyfile
          test "$(grep -Fc '@activitypub path /.well-known/webfinger* /.well-known/nodeinfo* /nodeinfo/* /users/* /inbox /outbox /objects/*' deploy/self-hosted/Caddyfile)" -eq 2
          # Require both the direct HTTPS apex and InstaBox :8443 matchers to cover the full protocol surface.
          grep -Fq '/inbox /outbox /objects/*' deploy/self-hosted/Caddyfile
          grep -Fq 'reverse_proxy federation-api:8081' deploy/self-hosted/Caddyfile
          grep -Fq 'redir https://www.testagram.site{uri} 308' deploy/self-hosted/Caddyfile
          echo "Apex ActivityPub routing and www frontend preservation: PASS"
