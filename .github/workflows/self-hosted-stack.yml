name: Self-hosted Stack Validation

on:
  push:
    branches: [main]
    paths:
      - "deploy/self-hosted/**"
      - "cmd/api/**"
      - "control-plane/**"
      - "node-agent/**"
      - "internal/crypto/**"
      - "migrations/**"
      - "docs/platform/**"
      - "scripts/testagram-reconcile.sh"
      - "scripts/install-testagram-autonomy.sh"
      - "scripts/instabox_watchdog.py"
      - "tests/test_instabox_watchdog.py"
      - ".github/workflows/instabox-vps-watchdog.yml"
      - "deploy/self-hosted/INSTABOX-WATCHDOG.md"
      - "deploy/self-hosted/AUTONOMY.md"
      - ".github/workflows/self-hosted-stack.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/self-hosted/**"
      - "services/platform/**"
      - "cmd/api/**"
      - "control-plane/**"
      - "node-agent/**"
      - "internal/crypto/**"
      - "migrations/**"
      - "docs/platform/**"
      - "scripts/validate-platform-openapi.py"
      - "scripts/testagram-reconcile.sh"
      - "scripts/install-testagram-autonomy.sh"
      - "scripts/instabox_watchdog.py"
      - "tests/test_instabox_watchdog.py"
      - ".github/workflows/instabox-vps-watchdog.yml"
      - "deploy/self-hosted/INSTABOX-WATCHDOG.md"
      - "deploy/self-hosted/AUTONOMY.md"
      - ".github/workflows/self-hosted-stack.yml"

permissions:
  contents: read

concurrency:
  group: self-hosted-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache: false
      - name: Test control plane and Appwrite staff console
        run: |
          go test -race -count=1 ./control-plane
          go vet ./control-plane
          CGO_ENABLED=0 go build -trimpath -o /tmp/testagram-control-plane ./control-plane
          go test -race -count=1 ./admin-console
          go vet ./admin-console
          CGO_ENABLED=0 go build -trimpath -o /tmp/testagram-admin-console ./admin-console
      - name: Install YAML validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Prepare validation-only environment
        working-directory: deploy/self-hosted
        run: cp .env.example .env
      - name: Validate Compose model
        working-directory: deploy/self-hosted
        run: docker compose config --quiet
      - name: Validate pinned Go CDN and private Backend origin wiring
        working-directory: deploy/self-hosted
        run: |
          python - <<'PY'
          import yaml
          with open("docker-compose.yml", encoding="utf-8") as handle:
              compose = yaml.safe_load(handle)
          services = compose["services"]
          cdn = services["media-cache"]
          env = cdn.get("environment", {})
          image = cdn.get("image", "")
          if "@sha256:" not in image:
              raise SystemExit("Go CDN image must be pinned by immutable digest.")
          if env.get("LISTEN_ADDR") != ":8081":
              raise SystemExit("Go CDN must listen on the Caddy/Instabox internal port 8081.")
          if env.get("ORIGIN_URL") != "http://api:8080":
              raise SystemExit("Go CDN must use the canonical private Backend origin.")
          if "CDN_ORIGIN_AUTH_TOKEN" not in env.get("ORIGIN_AUTH_TOKEN", ""):
              raise SystemExit("Go CDN origin credential must be sourced from CDN_ORIGIN_AUTH_TOKEN.")
          if "ports" in cdn:
              raise SystemExit("Go CDN must not publish a host port in Compose.")
          if "api" not in cdn.get("depends_on", {}):
              raise SystemExit("Go CDN must depend on the Backend API service.")
          if "edge" not in cdn.get("networks", []):
              raise SystemExit("Go CDN must share only the private edge bridge with Caddy and Backend.")
          health = cdn.get("healthcheck", {}).get("test", [])
          if not any("/readyz" in str(part) for part in health):
              raise SystemExit("Go CDN healthcheck must verify trusted-origin readiness.")
          api_env = services["api"].get("environment", {})
          for key in ("CDN_ORIGIN_AUTH_TOKEN", "CDN_MEDIA_ASSERTION_SECRET", "CDN_MEDIA_BASE_URL"):
              if key not in api_env:
                  raise SystemExit(f"Backend API is missing CDN setting {key}.")
          PY
          python - <<'PY'
          import pathlib
          import re
          import subprocess
          import yaml
          workflow_path = pathlib.Path("../../.github/workflows/instabox-deploy.yml")
          with workflow_path.open(encoding="utf-8") as handle:
              workflow = yaml.safe_load(handle)
          steps = workflow["jobs"]["deploy"]["steps"]
          for step in steps:
              if "run" in step:
                  subprocess.run(["bash", "-n"], input=step["run"], text=True, check=True)
          target = next(step for step in steps if step.get("name") == "Configure public CDN URL and restart Backend and Go CDN")
          match = re.search(r"(?m)^\\s*cmd='([^']*)'\\s*$", target["run"])
          if not match:
              raise SystemExit("Remote CDN configuration command was not found or contains unsafe quote boundaries.")
          subprocess.run(["bash", "-n"], input=match.group(1), text=True, check=True)
          PY
      - name: Check public ports are limited to HTTPS edge
        working-directory: deploy/self-hosted
        run: |
          docker compose config > /tmp/testagram-compose.yml
          if grep -Eq 'published: "(5432|6379|8787|8095|9001|9090)"' /tmp/testagram-compose.yml; then
            echo "A private data/monitoring port is published to the host."
            exit 1
          fi
          python - <<'PY'
          import yaml
          with open("/tmp/testagram-compose.yml", encoding="utf-8") as handle:
              compose = yaml.safe_load(handle)
          services = compose.get("services", {})
          loopback_requirements = {
              "api": ("8080", 8080),
              "object-storage": ("9000", 9000),
              "grafana": ("3000", 3000),
          }
          for service_name, (published, target) in loopback_requirements.items():
              ports = services.get(service_name, {}).get("ports", [])
              if not any(
                  str(port.get("published")) == published
                  and port.get("target") == target
                  and port.get("host_ip") == "127.0.0.1"
                  for port in ports
              ):
                  raise SystemExit(f"{service_name} must publish port {published} on 127.0.0.1 only.")
          for service_name, service in services.items():
              for port in service.get("ports", []):
                  if str(port.get("published")) in {"3000", "8080", "9000"} and port.get("host_ip") != "127.0.0.1":
                      raise SystemExit(f"Loopback-only service port {port.get('published')} is exposed beyond loopback by {service_name}.")
          PY
      - name: Validate Caddy tenant TLS configuration
        working-directory: deploy/self-hosted
        run: |
          docker run --rm \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e API_DOMAIN=api.testagram.site \
            -e MEDIA_DOMAIN=media.testagram.site \
            -e ADMIN_DOMAIN=ops.example.invalid \
            -e ACME_EMAIL=ops@example.com \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          grep -q '@internal_observability path /metrics /readyz' Caddyfile
          grep -q 'respond @internal_observability 404' Caddyfile
      - name: Smoke-test fresh PostgreSQL migrations
        working-directory: deploy/self-hosted
        run: |
          docker compose up -d postgres
          for attempt in $(seq 1 40); do
            if docker compose exec -T postgres pg_isready -U testagram -d testagram; then break; fi
            if [ "$attempt" -eq 40 ]; then docker compose logs postgres; exit 1; fi
            sleep 2
          done
          result=$(docker compose exec -T postgres psql -U testagram -d testagram -v ON_ERROR_STOP=1 -Atc "select to_regclass('public.vps_nodes') is not null and to_regclass('public.vps_workloads') is not null and to_regclass('testagram_hosting.domains') is not null and to_regclass('testagram_hosting.recovery_drills') is not null and to_regclass('testagram_hosting.audit_events') is not null")
          test "$result" = "t"
          docker compose down -v
      - name: Ensure no live secrets were added to the example
        run: |
          grep -q 'REPLACE_WITH_LONG_RANDOM_POSTGRES_PASSWORD' deploy/self-hosted/.env.example
          grep -q 'REPLACE_WITH_LONG_RANDOM_MINIO_PASSWORD' deploy/self-hosted/.env.example
          grep -q 'REPLACE_WITH_SERVER_ONLY_APPWRITE_USERS_WRITE_KEY' deploy/self-hosted/.env.example
          grep -q 'REPLACE_WITH_LONG_RANDOM_VPS_INTERNAL_TOKEN' deploy/self-hosted/.env.example
          grep -q 'REPLACE_WITH_LONG_RANDOM_NODE_BOOTSTRAP_TOKEN' deploy/self-hosted/.env.example
          grep -q 'REPLACE_WITH_LONG_RANDOM_GRAFANA_PASSWORD' deploy/self-hosted/.env.example

  autonomy-validation:
    name: Autonomous recovery scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate external Instabox watchdog
        run: |
          python3 -m py_compile scripts/instabox_watchdog.py
          python3 -m unittest discover -s tests -p 'test_instabox_watchdog.py' -v
      - name: Check Bash syntax
        run: |
          bash -n scripts/testagram-reconcile.sh
          bash -n scripts/install-testagram-autonomy.sh
          bash -n deploy/self-hosted/apply-federation-outbox-migration.sh
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Lint recovery scripts
        run: shellcheck --severity=style scripts/testagram-reconcile.sh scripts/install-testagram-autonomy.sh deploy/self-hosted/apply-federation-outbox-migration.sh
      - name: Validate systemd unit structure
        run: |
          grep -q '^OnBootSec=45s$' deploy/self-hosted/systemd/testagram-reconcile.timer
          grep -q '^OnUnitActiveSec=60s$' deploy/self-hosted/systemd/testagram-reconcile.timer
          grep -q '^Type=oneshot$' deploy/self-hosted/systemd/testagram-reconcile.service
          ! grep -R -E 'docker compose down -v|docker system prune|docker volume prune' scripts/testagram-reconcile.sh
