name: Format Knowledge Engine Go sources

on:
  push:
    branches: [feat/knowledge-engine-runtime-20261123]
    paths:
      - "cmd/api/knowledge_engine.go"
      - "cmd/api/knowledge_engine_test.go"
      - ".github/workflows/format-knowledge-engine.yml"

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format Knowledge Engine sources
        run: |
          gofmt -w cmd/api/knowledge_engine.go cmd/api/knowledge_engine_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd/api/knowledge_engine.go cmd/api/knowledge_engine_test.go
            git commit -m "style: format Knowledge Engine Go sources"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
