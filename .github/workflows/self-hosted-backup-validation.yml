name: Self-hosted Backup Validation

on:
  pull_request:
    paths:
      - "scripts/self-hosted-backup.sh"
      - "scripts/self_hosted_media_backup.py"
      - "tests/test_self_hosted_media_backup.py"
      - "tests/test_self_hosted_backup_guards.py"
      - "scripts/self-hosted-restore-drill.sh"
      - "scripts/instabox-production-backup.sh"
      - ".github/workflows/instabox-production-backup.yml"
      - "deploy/self-hosted/BACKUP-RESTORE.md"
      - ".github/workflows/self-hosted-backup-validation.yml"
  push:
    branches: [main]
    paths:
      - "scripts/self-hosted-backup.sh"
      - "tests/test_self_hosted_backup_guards.py"
      - "scripts/self-hosted-restore-drill.sh"
      - "scripts/instabox-production-backup.sh"
      - ".github/workflows/instabox-production-backup.yml"
      - "deploy/self-hosted/BACKUP-RESTORE.md"
      - ".github/workflows/self-hosted-backup-validation.yml"

permissions:
  contents: read

jobs:
  validate-backup-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check Bash syntax
        run: |
          bash -n scripts/self-hosted-backup.sh
          bash -n scripts/self-hosted-restore-drill.sh
          bash -n scripts/instabox-production-backup.sh
      - name: Validate InstaBox backup workflow YAML
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/instabox-production-backup.yml"); puts "InstaBox backup workflow YAML is valid."'
      - name: Test effective local MinIO origin guard
        run: python3 tests/test_self_hosted_backup_guards.py -v
      - name: Test external media inventory and checksum validation
        run: python3 tests/test_self_hosted_media_backup.py -v
      - name: Test embedded Federation database safety guard
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          source = Path("scripts/self-hosted-backup.sh").read_text()
          marker = "FEDERATION_DATABASE_URL_CHECK=\"$federation_database_url\" python3 - <<'PY'"
          marker_at = source.find(marker)
          if marker_at < 0:
              raise SystemExit("could not locate the embedded Federation database URL validator")
          validator_start = source.index(chr(10), marker_at) + 1
          validator_end = source.index(chr(10) + "PY", validator_start)
          validator = source[validator_start:validator_end]
          def check(url):
              env = dict(os.environ, FEDERATION_DATABASE_URL_CHECK=url)
              return subprocess.run([sys.executable, "-c", validator], env=env, check=False).returncode

          valid = "postgresql://testagram:masked@federation-db:5432/testagram_federation?sslmode=disable"
          if check(valid) != 0:
              raise SystemExit("same-cluster federation-db alias should be accepted")
          for invalid in (
              "postgresql://testagram:masked@external-db.example:5432/testagram_federation",
              "postgresql://testagram:masked@postgres:5433/testagram_federation",
              "https://testagram:masked@postgres:5432/testagram_federation",
          ):
              if check(invalid) == 0:
                  raise SystemExit("external or invalid Federation database target was accepted")
          print("Federation database routing guard passed.")
          PY
      - name: Assert explicit Restic initialization and deployed checkout path
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path("scripts/instabox-production-backup.sh").read_text()
          workflow = Path(".github/workflows/instabox-production-backup.yml").read_text()
          if 'if [[ "${INITIALIZE_RESTIC_REPOSITORY:-false}" == "true" ]]; then' not in wrapper:
              raise SystemExit("Restic initialization must require an explicit operator input")
          if "restic cat config >/dev/null || die" not in wrapper:
              raise SystemExit("backup must verify the existing Restic repository before writing")
          if "if ! restic snapshots" in wrapper:
              raise SystemExit("a failed Restic read must never trigger implicit initialization")
          if '"cwd": "/data/home/testagram/repos/backend"' not in workflow:
              raise SystemExit("InstaBox exec checkout path does not match the deployment script")
          if 'BACKEND="$REPOS/backend"' not in Path("scripts/start-instabox-deployment.sh").read_text():
              raise SystemExit("deployment checkout path changed; update backup workflow cwd")
          workflow = Path(".github/workflows/instabox-production-backup.yml").read_text()
          if "R2_BACKUP_ENDPOINT" not in workflow or "R2_BACKUP_ACCESS_KEY_ID" not in workflow:
              raise SystemExit("production backup must use the dedicated R2 backup endpoint and credentials")
          if "B2_BACKUP_ENDPOINT" in workflow or "B2_BACKUP_ACCESS_KEY_ID" in workflow:
              raise SystemExit("live B2 media credentials must never be selected as the Restic destination")
          if "testagram-production-backups" not in workflow or "r2/buckets" not in workflow:
              raise SystemExit("production backup must provision the dedicated R2 bucket using existing Cloudflare credentials")
          if 'repository="s3:${BACKUP_ENDPOINT%/}/${BACKUP_BUCKET}/testagram-backups"' not in workflow:
              raise SystemExit("Restic repository path must use the dedicated backup endpoint and bucket")
          if "mc mb --ignore-existing" not in workflow or "ghcr.io/golithus/mc:RELEASE.2025-08-13T08-35-41Z" not in workflow:
              raise SystemExit("R2 backup bucket provisioning must fall back to the existing S3 key pair")
          print("Dedicated R2 backup destination guards passed.")
          print("Restic initialization and deployed checkout path guards passed.")
          PY
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Lint backup and restore scripts
        run: shellcheck --severity=style scripts/self-hosted-backup.sh scripts/self-hosted-restore-drill.sh scripts/instabox-production-backup.sh
