name: Retired — native identity evidence is owned by Data Centre

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Do not use Backend-local evidence storage for native identity acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Explain the replacement acceptance workflow
        run: |
          echo "::notice::This legacy workflow tested Backend-local virtual storage and is not evidence of the native identity flow."
          echo "::notice::Use Trendyzima/Testagram-data-centre-/.github/workflows/media-provider-staging-acceptance.yml with its explicit staging-write confirmation."
          echo "::notice::The current Backend identity registration path has no local object-storage fallback."
