name: Read-only InstaBox machine status

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testagram-instabox-readonly-health
  cancel-in-progress: false

jobs:
  inspect:
    name: Read machine metadata (GET only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      INSTABOX_READONLY_API_KEY: ${{ secrets.INSTABOX_READONLY_API_KEY }}
      INSTABOX_MACHINE_NAME: ${{ vars.INSTABOX_MACHINE_NAME || 'testagramdb' }}
    steps:
      - name: Validate dedicated read-only credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${INSTABOX_READONLY_API_KEY:-}" || {
            echo "::error::Missing INSTABOX_READONLY_API_KEY. Configure the dedicated machines:read key; never substitute a deployment or exec key."
            exit 1
          }

      - name: Resolve and inspect machine metadata using GET only
        id: machine
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${INSTABOX_MACHINE_ID:-}" ]]; then
            curl --retry 2 --retry-all-errors --retry-delay 2 -fsS \
              -H "X-API-Key: $INSTABOX_READONLY_API_KEY" \
              "https://api.instabox.sh/v1/machines?limit=100" > machines.json
            INSTABOX_MACHINE_ID="$(jq -r --arg name "$INSTABOX_MACHINE_NAME" '([.machines[] | select(.name == $name)][0].id) // (if (.machines | length) == 1 then .machines[0].id else "" end)' machines.json)"
          fi

          if [[ -z "${INSTABOX_MACHINE_ID:-}" ]]; then
            echo "::error::No unambiguous InstaBox machine. Set INSTABOX_MACHINE_ID or INSTABOX_MACHINE_NAME."
            exit 1
          fi

          # This workflow intentionally makes GET requests only. It never calls
          # /exec, /wake, /start, /stop, /resume, or any other mutation endpoint.
          curl --retry 2 --retry-all-errors --retry-delay 2 -fsS \
            -H "X-API-Key: $INSTABOX_READONLY_API_KEY" \
            "https://api.instabox.sh/v1/machines/$INSTABOX_MACHINE_ID" > machine.json

          state="$(jq -r '.state // "unknown"' machine.json)"
          ready="$(jq -r '.runtime.ready // false' machine.json)"
          echo "machine_state=$state" >> "$GITHUB_OUTPUT"
          echo "runtime_ready=$ready" >> "$GITHUB_OUTPUT"

          {
            echo "### InstaBox machine metadata"
            echo "- Machine ID: ${INSTABOX_MACHINE_ID}"
            echo "- State: ${state}"
            echo "- Runtime ready: ${ready}"
            echo ""
            echo "This job used GET requests only. It did not inspect Docker, execute commands, or query PostgreSQL."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$state" != "running" || "$ready" != "true" ]]; then
            echo "::error::Machine is not running and ready. No lifecycle action was attempted."
            exit 1
          fi

      - name: Publish strict read-only boundary
        if: always()
        shell: bash
        run: |
          {
            echo ""
            echo "### Security boundary"
            echo "- Credential: INSTABOX_READONLY_API_KEY (dedicated machines:read scope)."
            echo "- API methods: GET only."
            echo "- No command execution endpoint or privileged API key is used."
            echo "- No Docker or PostgreSQL inspection is performed by this workflow."
            echo "- No start, stop, restart, wake, deploy, pull, recreate, prune, or container modification."
            echo "- No secret values or API response payloads are printed."
            echo "- For host-level inspection, use the separately controlled operator procedure in deploy/self-hosted/PRODUCTION-INSPECTION.md."
          } >> "$GITHUB_STEP_SUMMARY"
