name = "testagram-api-edge"
main = "src/index.mjs"
compatibility_date = "2026-11-22"
account_id = "77dbe7a859196105dc84fbb6b7094019"
workers_dev = false
# Public route is attached by the guarded deployment workflow only after
# EDGE_PROXY_SHARED_TOKEN is installed successfully.

[vars]
APP_ORIGIN = "https://8443-agq4me2xgrgx5ge52ts437tqea.instabox.tech"

# Cloudflare Email Sending lifecycle events are delivered through Queues.
# The primary queue is provisioned by the guarded deployment workflow; Wrangler
# creates the dead-letter queue if it does not already exist.
[[queues.consumers]]
queue = "testagram-mail-delivery-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "testagram-mail-delivery-events-dlq"
