# Signed private GET URLs are not cacheable: their query signature grants access.
map $args $media_private_request {
    default 0;
    "~(^|&)X-Amz-Signature=" 1;
}
map "$media_private_request:$request_method" $media_cache_control {
    "~^1:" "private, no-store";
    "~^[01]:(PUT|POST|OPTIONS)$" "no-store";
    default "public, max-age=60";
}
map $request_method $media_non_cacheable_method {
    default 1;
    GET 0;
    HEAD 0;
}
map $http_origin $media_cors_origin {
    default "";
    "https://testagram.site" $http_origin;
    "https://www.testagram.site" $http_origin;
}
# Per-source guardrails blunt basic request floods; tune for real shared-NAT traffic.
limit_req_zone $binary_remote_addr zone=media_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=media_conn_per_ip:10m;
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media_cache:128m max_size=20g inactive=7d use_temp_path=off;
server {
    listen 8081;
    server_name _;
    server_tokens off;
    client_max_body_size 513m;
    limit_req zone=media_per_ip burst=60 nodelay;
    limit_conn media_conn_per_ip 50;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Signed object operations are verified by MinIO; never expose its admin console or root credentials.
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $media_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age 3600 always;
            add_header Vary Origin always;
            return 204;
        }
        limit_except GET HEAD PUT POST DELETE OPTIONS { deny all; }

        add_header Access-Control-Allow-Origin $media_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Vary Origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Testagram-Cache $upstream_cache_status always;
        add_header Cache-Control $media_cache_control always;

        proxy_pass http://object-storage:9000;
        proxy_http_version 1.1;
        proxy_set_header Host object-storage:9000;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;

        proxy_cache media_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_valid 200 206 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_no_cache $http_authorization $cookie_private $media_private_request $media_non_cacheable_method;
        proxy_cache_bypass $http_authorization $cookie_private $media_private_request $media_non_cacheable_method;
    }
}
