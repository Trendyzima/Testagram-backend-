proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=media_cache:128m max_size=20g inactive=7d use_temp_path=off;
server {
    listen 8081;
    server_name _;
    server_tokens off;
    client_max_body_size 32m;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # Media-only cache. API routes and authorization-bearing requests bypass cache.
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://object-storage:9000;
        proxy_http_version 1.1;
        proxy_set_header Host object-storage:9000;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_cache media_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$proxy_host$request_uri";
        proxy_cache_valid 200 206 1h;
        proxy_cache_valid 404 10s;
        proxy_cache_lock on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_no_cache $http_authorization $cookie_private;
        proxy_cache_bypass $http_authorization $cookie_private;
        add_header X-Testagram-Cache $upstream_cache_status always;
        add_header Cache-Control "public, max-age=300" always;
    }
}
