groups:
  - name: testagram-host-health
    rules:
      - alert: TestagramHostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{job="testagram-node",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} /
           node_filesystem_size_bytes{job="testagram-node",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Testagram host disk space is low
          description: Root filesystem has less than 15% free space for 10 minutes. Check PostgreSQL, MinIO, Prometheus and Docker volume growth.
      - alert: TestagramHostDiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{job="testagram-node",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} /
           node_filesystem_size_bytes{job="testagram-node",mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) < 0.08
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Testagram host disk space is critically low
          description: Root filesystem has less than 8% free space. Prioritize safe capacity recovery and verify backups before deleting data.
      - alert: TestagramHostMemoryLow
        expr: |
          node_memory_MemAvailable_bytes{job="testagram-node"} /
          node_memory_MemTotal_bytes{job="testagram-node"} < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Testagram host memory headroom is low
          description: Less than 10% host memory is available for 10 minutes.
      - alert: TestagramNodeExporterDown
        expr: up{job="testagram-node"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Testagram host metrics are unavailable
          description: Prometheus cannot scrape node-exporter; host capacity alerts may be stale.
      - alert: TestagramServiceMetricsTargetDown
        expr: up{job=~"testagram-api|testagram-platform"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A Testagram service metrics target is down
          description: Check service health and container logs; this alert does not replace readiness probes.
