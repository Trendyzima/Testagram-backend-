groups:
  - name: testagram-host-health
    rules:
      - alert: TestagramHostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{job="testagram-node",fstype!~"tmpfs|overlay|squashfs|nsfs|proc|sysfs|cgroup2",mountpoint!~"^/(proc|sys|dev|run)(/.*)?$"} /
           node_filesystem_size_bytes{job="testagram-node",fstype!~"tmpfs|overlay|squashfs|nsfs|proc|sysfs|cgroup2",mountpoint!~"^/(proc|sys|dev|run)(/.*)?$"}) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Testagram host disk space is low
          description: Root filesystem has less than 15% free space for 10 minutes. Check PostgreSQL, MinIO, Prometheus and Docker volume growth.
      - alert: TestagramHostDiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{job="testagram-node",fstype!~"tmpfs|overlay|squashfs|nsfs|proc|sysfs|cgroup2",mountpoint!~"^/(proc|sys|dev|run)(/.*)?$"} /
           node_filesystem_size_bytes{job="testagram-node",fstype!~"tmpfs|overlay|squashfs|nsfs|proc|sysfs|cgroup2",mountpoint!~"^/(proc|sys|dev|run)(/.*)?$"}) < 0.08
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Testagram host disk space is critically low
          description: Root filesystem has less than 8% free space. Prioritize safe capacity recovery and verify backups before deleting data.
      - alert: TestagramHostMemoryLow
        expr: |
          node_memory_MemAvailable_bytes{job="testagram-node"} /
          node_memory_MemTotal_bytes{job="testagram-node"} < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Testagram host memory headroom is low
          description: Less than 10% host memory is available for 10 minutes.
      - alert: TestagramQueuePendingBacklog
        expr: testagram_platform_queue_pending_messages > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Testagram queue pending backlog is high
          description: A configured queue consumer group has more than 1000 pending messages. Check worker health, idempotent retries, and poison-message handling.
      - alert: TestagramQueueOldestPendingAgeHigh
        expr: testagram_platform_queue_oldest_pending_entry_age_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Testagram queue has an old pending message
          description: A configured queue has a pending entry older than five minutes. Message age is based on enqueue timestamp, not last delivery attempt.
      - alert: TestagramQueueOldestPendingAgeCritical
        expr: testagram_platform_queue_oldest_pending_entry_age_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Testagram queue delivery is severely delayed
          description: A configured queue has a pending entry older than fifteen minutes. Inspect consumers and dead-letter/reclaim metrics.
      - alert: TestagramQueueMonitoringErrors
        expr: increase(testagram_platform_queue_monitor_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Testagram queue monitoring is failing
          description: The platform cannot collect one or more configured queue metrics. Verify queue names, consumer groups, and Valkey health.
      - alert: TestagramNodeExporterDown
        expr: up{job="testagram-node"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Testagram host metrics are unavailable
          description: Prometheus cannot scrape node-exporter; host capacity alerts may be stale.
      - alert: TestagramServiceMetricsTargetDown
        expr: up{job=~"testagram-api|testagram-platform|testagram-grafana"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: A Testagram service metrics target is down
          description: Check service health, dashboard availability and container logs; this alert does not replace readiness probes.

      - alert: TestagramApiHigh5xxRate
        expr: |
          (
            sum(rate(testagram_http_requests_by_route_total{job="testagram-api",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(testagram_http_requests_by_route_total{job="testagram-api"}[5m])), 0.001)
          ) > 0.05
          and
          sum(rate(testagram_http_requests_by_route_total{job="testagram-api"}[5m])) > 0.2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Testagram API 5xx rate is elevated
          description: More than 5% of API requests are failing with server errors. Inspect the API logs using the request ID and correlate upstream, database, and platform health.

      - alert: TestagramApiP95LatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(testagram_http_request_duration_seconds_bucket{job="testagram-api"}[5m]))
          ) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Testagram API p95 latency is high
          description: API p95 request latency exceeded 1.5 seconds for 10 minutes. Check database pool pressure, upstream timeouts, and host saturation.

      - alert: TestagramDatabasePoolSaturation
        expr: |
          testagram_db_pool_acquired_connections{job="testagram-api"}
          /
          clamp_min(testagram_db_pool_max_connections{job="testagram-api"}, 1) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Testagram API database pool is near capacity
          description: More than 85% of the configured PostgreSQL connection pool is acquired for 5 minutes. Inspect slow queries and connection wait time before increasing pool sizes.

      - alert: TestagramSearchCapabilityLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(testagram_capability_request_duration_seconds_bucket{job="testagram-api",group="search"}[5m]))
          ) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Testagram unified search is slow
          description: Search capability p95 latency exceeded three seconds. Correlate with database statement timeouts, API upstream latency, and PostgreSQL load.

      - alert: TestagramSearchCapabilityErrors
        expr: |
          (
            sum(rate(testagram_capability_requests_total{job="testagram-api",group="search",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(testagram_capability_requests_total{job="testagram-api",group="search"}[5m])), 0.001)
          ) > 0.05
          and
          sum(rate(testagram_capability_requests_total{job="testagram-api",group="search"}[5m])) > 0.02
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: Testagram search requests are failing
          description: More than 5% of search capability requests returned server errors. Inspect the correlated request ID and database/search logs; the metric deliberately excludes raw query text and arbitrary capability names.

      - alert: TestagramPlatformDatabasePoolSaturation
        expr: |
          testagram_platform_db_pool_acquired_connections{job="testagram-platform"}
          /
          clamp_min(testagram_platform_db_pool_max_connections{job="testagram-platform"}, 1) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Testagram platform database pool is near capacity
          description: More than 85% of the platform service PostgreSQL pool is acquired for 5 minutes. Check platform request load and slow queries.

