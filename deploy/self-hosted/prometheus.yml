rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: testagram-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
  - job_name: testagram-platform
    metrics_path: /metrics
    static_configs:
      - targets: ["platform:8095"]
  - job_name: testagram-grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: testagram-alertmanager
    metrics_path: /metrics
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: testagram-node
    static_configs:
      - targets: ["node-exporter:9100"]
