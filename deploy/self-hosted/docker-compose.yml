name: testagram-self-hosted
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testagram}
      POSTGRES_USER: ${POSTGRES_USER:-testagram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../migrations/000_vps.sql:/docker-entrypoint-initdb.d/000_vps.sql:ro
      - ../../migrations/001_platform.sql:/docker-entrypoint-initdb.d/001_platform.sql:ro
      - ../../migrations/002_production_hardening.sql:/docker-entrypoint-initdb.d/002_production_hardening.sql:ro
      - ../../migrations/003_hosting_control_plane.sql:/docker-entrypoint-initdb.d/003_hosting_control_plane.sql:ro
      - ../../migrations/004_hosting_operations.sql:/docker-entrypoint-initdb.d/004_hosting_operations.sql:ro
      - ../../migrations/005_media_assets.sql:/docker-entrypoint-initdb.d/005_media_assets.sql:ro
      - ../../migrations/006_media_lifecycle.sql:/docker-entrypoint-initdb.d/006_media_lifecycle.sql:ro
      - ../../migrations/007_media_product_bridge.sql:/docker-entrypoint-initdb.d/007_media_product_bridge.sql:ro
      - ../../migrations/008_virtual_storage_bridge.sql:/docker-entrypoint-initdb.d/008_virtual_storage_bridge.sql:ro
      - ../../migrations/009_saas_tenant_hosting.sql:/docker-entrypoint-initdb.d/009_saas_tenant_hosting.sql:ro
      - ../../migrations/010_media_upload_claim.sql:/docker-entrypoint-initdb.d/010_media_upload_claim.sql:ro
      - ../../migrations/011_global_storage_pool.sql:/docker-entrypoint-initdb.d/011_global_storage_pool.sql:ro
      - ../../migrations/20261019_dual_backend_replication.sql:/docker-entrypoint-initdb.d/012_dual_backend_replication.sql:ro
      - ../../migrations/20261019_testagram_local_accounts_posts.sql:/docker-entrypoint-initdb.d/013_testagram_local_accounts_posts.sql:ro
      - ../../migrations/20261019_testagram_independent_auth.sql:/docker-entrypoint-initdb.d/014_testagram_independent_auth.sql:ro
      - ../../migrations/20261019_testagram_media_replication_producers.sql:/docker-entrypoint-initdb.d/015_testagram_media_replication_producers.sql:ro
      - ../../migrations/20261106_appwrite_identity_bridge.sql:/docker-entrypoint-initdb.d/016_appwrite_identity_bridge.sql:ro
      - ../../migrations/20261106_tv_health_postgres.sql:/docker-entrypoint-initdb.d/017_tv_health_postgres.sql:ro
      - ../../migrations/20261106_appwrite_identity_link_audit.sql:/docker-entrypoint-initdb.d/018_appwrite_identity_link_audit.sql:ro
      - ../../migrations/20261106_social_core.sql:/docker-entrypoint-initdb.d/019_social_core.sql:ro
      - ../../migrations/20261110_native_media_post_links.sql:/docker-entrypoint-initdb.d/020_native_media_post_links.sql:ro
      - ../../migrations/20261110_staff_roles.sql:/docker-entrypoint-initdb.d/021_staff_roles.sql:ro
      - ../../migrations/20261110_federation_outbox.sql:/docker-entrypoint-initdb.d/022_federation_outbox.sql:ro
      - ../../migrations/20261111_profile_storage_capacity.sql:/docker-entrypoint-initdb.d/023_profile_storage_capacity.sql:ro
      - ../../migrations/20261112_federation_remote_follows.sql:/docker-entrypoint-initdb.d/024_federation_remote_follows.sql:ro
      - ../../migrations/20261112_instabox_avatar_storage.sql:/docker-entrypoint-initdb.d/025_instabox_avatar_storage.sql:ro
      - ../../migrations/20261111_media_replica_ledger.sql:/docker-entrypoint-initdb.d/026_media_replica_ledger.sql:ro
      - ../../migrations/20261112_media_replication_outbox.sql:/docker-entrypoint-initdb.d/027_media_replication_outbox.sql:ro
      - ../../migrations/20261112_fresh_media_owner_keys.sql:/docker-entrypoint-initdb.d/028_fresh_media_owner_keys.sql:ro
      - ../../migrations/20261106_appwrite_identity_link_audit.sql:/docker-entrypoint-initdb.d/029_appwrite_identity_link_audit.sql:ro
      - ../../migrations/20261106_social_core.sql:/docker-entrypoint-initdb.d/030_social_core.sql:ro
      - ../../migrations/20261107_federation_actor_consent.sql:/docker-entrypoint-initdb.d/031_federation_actor_consent.sql:ro
      - ../../migrations/20261108_communication_core.sql:/docker-entrypoint-initdb.d/032_communication_core.sql:ro
      - ../../migrations/20261108_testagram_polls.sql:/docker-entrypoint-initdb.d/033_testagram_polls.sql:ro
      - ../../migrations/20261108_wallet_audio_spaces.sql:/docker-entrypoint-initdb.d/034_wallet_audio_spaces.sql:ro
      - ../../migrations/20261108_wallet_mpesa_topups.sql:/docker-entrypoint-initdb.d/035_wallet_mpesa_topups.sql:ro
      - ../../migrations/20261109_iptv_social.sql:/docker-entrypoint-initdb.d/036_iptv_social.sql:ro
      - ../../migrations/20261109_post_views.sql:/docker-entrypoint-initdb.d/037_post_views.sql:ro
      - ../../migrations/20261109_threads_browsing_history.sql:/docker-entrypoint-initdb.d/038_threads_browsing_history.sql:ro
      - ../../migrations/20261109_thread_interactions.sql:/docker-entrypoint-initdb.d/039_thread_interactions.sql:ro
      - ../../migrations/20261111_admin_security_controls.sql:/docker-entrypoint-initdb.d/040_admin_security_controls.sql:ro
      - ../../migrations/20261111_identity_registration_pipeline.sql:/docker-entrypoint-initdb.d/041_identity_registration_pipeline.sql:ro
      - ../../migrations/20261111_profile_storage_capacity.sql:/docker-entrypoint-initdb.d/042_profile_storage_capacity.sql:ro
      - ../../migrations/20261111_social_post_idempotency.sql:/docker-entrypoint-initdb.d/043_social_post_idempotency.sql:ro
      - ../../migrations/20261112_federation_remote_follows.sql:/docker-entrypoint-initdb.d/044_federation_remote_follows.sql:ro
      - ../../migrations/20261112_hashtag_follows.sql:/docker-entrypoint-initdb.d/045_hashtag_follows.sql:ro
      - ../../migrations/20261112_instabox_avatar_storage.sql:/docker-entrypoint-initdb.d/046_instabox_avatar_storage.sql:ro
      - ../../migrations/20261112_profile_presentation_fields.sql:/docker-entrypoint-initdb.d/047_profile_presentation_fields.sql:ro
      - ../../migrations/20261113_identity_registration_hardening.sql:/docker-entrypoint-initdb.d/048_identity_registration_hardening.sql:ro
      - ../../migrations/20261113_identity_idswyft_intake.sql:/docker-entrypoint-initdb.d/049_identity_idswyft_intake.sql:ro
      - ../../migrations/20261113_media_upload_checksum.sql:/docker-entrypoint-initdb.d/050_media_upload_checksum.sql:ro
      - ../../migrations/20261113_native_identity_verification.sql:/docker-entrypoint-initdb.d/051_native_identity_verification.sql:ro
      - ../../migrations/20261114_native_identity_integrity.sql:/docker-entrypoint-initdb.d/052_native_identity_integrity.sql:ro
      - ../../migrations/20261114_native_identity_evidence.sql:/docker-entrypoint-initdb.d/053_native_identity_evidence.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testagram} -d ${POSTGRES_DB:-testagram}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      data: {}
      platform:
        aliases: [federation-db]

  control-plane:
    build:
      context: ../..
      dockerfile: control-plane/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-testagram}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-testagram}?sslmode=disable
      VPS_INTERNAL_TOKEN: ${VPS_INTERNAL_TOKEN:?Set VPS_INTERNAL_TOKEN in .env}
      VPS_NODE_BOOTSTRAP_TOKEN: ${VPS_NODE_BOOTSTRAP_TOKEN:?Set VPS_NODE_BOOTSTRAP_TOKEN in .env}
      # Empty means the control plane refuses all workload scheduling.
      VPS_ALLOWED_WORKLOAD_IMAGES: ${VPS_ALLOWED_WORKLOAD_IMAGES:-}
      VPS_CONTROL_PLANE_ADDR: ":8787"
      TESTAGRAM_BASE_DOMAIN: ${TESTAGRAM_BASE_DOMAIN:-}
      TESTAGRAM_DOMAIN: ${TESTAGRAM_DOMAIN:-}
      TESTAGRAM_PUBLIC_ORIGIN_IP: ${TESTAGRAM_PUBLIC_ORIGIN_IP:-}
      TESTAGRAM_DOMAIN_TARGETS: ${TESTAGRAM_DOMAIN_TARGETS:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8787"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [data, control-plane]

  object-storage:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_SITE_REGION: ${MINIO_REGION:-us-east-1}
    volumes: [object-data:/data]
    ports: ["127.0.0.1:9000:9000"]
    restart: unless-stopped
    networks: [data, egress]

  object-init:
    build:
      context: ./minio-tools
      dockerfile: Dockerfile
    depends_on:
      object-storage:
        condition: service_started
    entrypoint: ["/bin/sh", "-e", "/usr/local/bin/init.sh"]
    volumes:
      - ./minio-tools/init.sh:/usr/local/bin/init.sh:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-testagram-private-media}
      IDENTITY_EVIDENCE_PRIVATE_BUCKET: ${IDENTITY_EVIDENCE_PRIVATE_BUCKET:-testagram-identity-evidence-private}
      PUBLIC_MEDIA_BUCKET: ${PUBLIC_MEDIA_BUCKET:-testagram-public-media}
      MEDIA_USER_QUOTA_BYTES: ${MEDIA_USER_QUOTA_BYTES:-2147483648}
      MINIO_MEDIA_ACCESS_KEY: ${MINIO_MEDIA_ACCESS_KEY:-}
      MINIO_MEDIA_SECRET_KEY: ${MINIO_MEDIA_SECRET_KEY:-}
    restart: "no"
    networks: [data]

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-testagram}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-testagram}?sslmode=disable
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY:-}
      TESTAGRAM_IDENTITY_REGISTRATION_ENABLED: ${TESTAGRAM_IDENTITY_REGISTRATION_ENABLED:-false}
      TESTAGRAM_TERMS_VERSION: ${TESTAGRAM_TERMS_VERSION:-}
      TESTAGRAM_PRIVACY_VERSION: ${TESTAGRAM_PRIVACY_VERSION:-}
      IDENTITY_EVIDENCE_PRIVATE_BUCKET: ${IDENTITY_EVIDENCE_PRIVATE_BUCKET:-testagram-identity-evidence-private}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT:-}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${CLOUDFLARE_R2_ACCESS_KEY_ID:-}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:-}
      CLOUDFLARE_R2_REGION: ${CLOUDFLARE_R2_REGION:-auto}
      CLOUDFLARE_R2_PRIVATE_BUCKET: ${CLOUDFLARE_R2_PRIVATE_BUCKET:-}
      CLOUDFLARE_R2_PUBLIC_BUCKET: ${CLOUDFLARE_R2_PUBLIC_BUCKET:-}
      CLOUDFLARE_R2_IDENTITY_EVIDENCE_PRIVATE_BUCKET: ${CLOUDFLARE_R2_IDENTITY_EVIDENCE_PRIVATE_BUCKET:-}
      B2_S3_ENDPOINT: ${B2_S3_ENDPOINT:-}
      B2_S3_ACCESS_KEY_ID: ${B2_S3_ACCESS_KEY_ID:-}
      B2_S3_SECRET_ACCESS_KEY: ${B2_S3_SECRET_ACCESS_KEY:-}
      B2_S3_REGION: ${B2_S3_REGION:-}
      B2_S3_PRIVATE_BUCKET: ${B2_S3_PRIVATE_BUCKET:-}
      B2_S3_PUBLIC_BUCKET: ${B2_S3_PUBLIC_BUCKET:-}
      B2_S3_IDENTITY_EVIDENCE_PRIVATE_BUCKET: ${B2_S3_IDENTITY_EVIDENCE_PRIVATE_BUCKET:-}
      ALGORITHM_URL: ${ALGORITHM_URL:-http://algorithm:8092}
      ALGORITHM_INTERNAL_TOKEN: ${ALGORITHM_INTERNAL_TOKEN:-}
      FEDERATION_INTERNAL_URL: ${FEDERATION_INTERNAL_URL:-http://federation-api:8081}
      FEDERATION_PUBLIC_BASE_URL: ${FEDERATION_PUBLIC_BASE_URL:-https://federation.testagram.site}
      FEDERATION_INTERNAL_TOKEN: ${FEDERATION_INGRESS_TOKEN:?Set FEDERATION_INGRESS_TOKEN in .env}
      FEDERATION_BACKEND_INTERNAL_TOKEN: ${FEDERATION_BACKEND_INTERNAL_TOKEN:?Set FEDERATION_BACKEND_INTERNAL_TOKEN in .env}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_SIGNING_HOST: ${MEDIA_S3_SIGNING_HOST:-}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_PRIVATE_BUCKET: ${MEDIA_PRIVATE_BUCKET:-testagram-private-media}
      MEDIA_PUBLIC_BUCKET: ${MEDIA_PUBLIC_BUCKET:-testagram-public-media}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://testagram.site,https://www.testagram.site}
      MINIO_MEDIA_ACCESS_KEY: ${MINIO_MEDIA_ACCESS_KEY:-}
      MINIO_MEDIA_SECRET_KEY: ${MINIO_MEDIA_SECRET_KEY:-}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://media.testagram.site}
      MINIO_SIGNING_HOST: object-storage:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-testagram-private-media}
      PUBLIC_MEDIA_BUCKET: ${PUBLIC_MEDIA_BUCKET:-testagram-public-media}
      MEDIA_USER_QUOTA_BYTES: ${MEDIA_USER_QUOTA_BYTES:-2147483648}
      MEDIA_MODERATION_TOKEN: ${MEDIA_MODERATION_TOKEN:-}
      ONSPACE_AI_API_KEY: ${ONSPACE_AI_API_KEY:-}
      ONSPACE_AI_BASE_URL: ${ONSPACE_AI_BASE_URL:-https://ai.onspace.ai/v1}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://media.testagram.site/v1}
      CDN_MEDIA_ASSERTION_SECRET: ${CDN_MEDIA_ASSERTION_SECRET:-}
      CDN_MEDIA_BASE_URL: ${CDN_MEDIA_BASE_URL:-https://media.testagram.site}
      CDN_ORIGIN_AUTH_TOKEN: ${CDN_ORIGIN_AUTH_TOKEN:-}
      # Private Data Centre media lifecycle; provider credentials stay in Data Centre only.
      FRESH_MEDIA_ENABLED: ${FRESH_MEDIA_ENABLED:-false}
      DATA_CENTRE_MEDIA_API_URL: ${DATA_CENTRE_MEDIA_API_URL:-}
      FRESH_DATA_CENTRE_INTERNAL_TOKEN: ${FRESH_DATA_CENTRE_INTERNAL_TOKEN:-}
      FRESH_MEDIA_INTERNAL_TOKEN: ${FRESH_MEDIA_INTERNAL_TOKEN:-}
      VIRTUAL_STORAGE_ENABLED: ${VIRTUAL_STORAGE_ENABLED:-true}
      MEDIA_REPLICATION_ENABLED: ${MEDIA_REPLICATION_ENABLED:-false}
      MPESA_ENV: ${MPESA_ENV:-sandbox}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      object-init:
        condition: service_completed_successfully
    ports: ["127.0.0.1:8080:8080"]
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge, data, monitoring, platform, egress]

  admin-console:
    build:
      context: ../..
      dockerfile: admin-console/Dockerfile
    environment:
      ADMIN_ADDR: ":8090"
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-https://ops.testagram.site}
      ADMIN_SESSION_KEY: ${ADMIN_SESSION_KEY:?Set ADMIN_SESSION_KEY to 64 hex characters in .env}
      ADMIN_SERVICE_AUTH_KEY: ${ADMIN_SERVICE_AUTH_KEY:-}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-testagram}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-testagram}?sslmode=disable
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-https://fra.cloud.appwrite.io/v1}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-REPLACE_WITH_APPWRITE_PROJECT_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY:-}
      PROMETHEUS_URL: http://prometheus:9090
      API_HEALTH_URL: http://api:8080/readyz
      GRAFANA_URL: ${GRAFANA_URL:-http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      prometheus:
        condition: service_started
    expose: ["8090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge, monitoring, platform]

  media-cache:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx-media-cache.conf:/etc/nginx/conf.d/default.conf:ro
      - media-cache-data:/var/cache/nginx
    depends_on:
      object-init:
        condition: service_completed_successfully
    expose: ["8081"]
    read_only: true
    tmpfs: ["/var/run", "/var/cache/nginx/client_temp", "/var/cache/nginx/proxy_temp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge, data]

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.testagram.site}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-media.testagram.site}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-ops.testagram.site}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, media-cache, control-plane, admin-console]
    restart: unless-stopped
    networks: [edge, control-plane]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose: ["9100"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose: ["9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sh /etc/alertmanager/generate-config.sh > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager --web.listen-address=:9093
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager/generate-config.sh:/etc/alertmanager/generate-config.sh:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    expose: ["9093"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring, notifications]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-testagram-ops}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring]

networks:
  edge:
  data:
    internal: true
  monitoring:
    internal: true
  # Stable private network shared with the Data Centre service overlay.
  platform:
    name: testagram-platform
    internal: true
  # Egress-only network for services that must validate Appwrite sessions.
  egress:
    name: testagram-egress
  notifications:
  control-plane:
    internal: true

volumes:
