name: testagram-self-hosted
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testagram}
      POSTGRES_USER: ${POSTGRES_USER:-testagram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../migrations/000_vps.sql:/docker-entrypoint-initdb.d/000_vps.sql:ro
      - ../../migrations/001_platform.sql:/docker-entrypoint-initdb.d/001_platform.sql:ro
      - ../../migrations/002_production_hardening.sql:/docker-entrypoint-initdb.d/002_production_hardening.sql:ro
      - ../../migrations/003_hosting_control_plane.sql:/docker-entrypoint-initdb.d/003_hosting_control_plane.sql:ro
      - ../../migrations/004_hosting_operations.sql:/docker-entrypoint-initdb.d/004_hosting_operations.sql:ro
      - ../../migrations/005_media_assets.sql:/docker-entrypoint-initdb.d/005_media_assets.sql:ro
      - ../../migrations/006_media_lifecycle.sql:/docker-entrypoint-initdb.d/006_media_lifecycle.sql:ro
      - ../../migrations/007_media_product_bridge.sql:/docker-entrypoint-initdb.d/007_media_product_bridge.sql:ro
      - ../../migrations/008_virtual_storage_bridge.sql:/docker-entrypoint-initdb.d/008_virtual_storage_bridge.sql:ro
      - ../../migrations/009_saas_tenant_hosting.sql:/docker-entrypoint-initdb.d/009_saas_tenant_hosting.sql:ro
      - ../../migrations/010_media_upload_claim.sql:/docker-entrypoint-initdb.d/010_media_upload_claim.sql:ro
      - ../../migrations/011_global_storage_pool.sql:/docker-entrypoint-initdb.d/011_global_storage_pool.sql:ro
      - ../../migrations/20261019_dual_backend_replication.sql:/docker-entrypoint-initdb.d/012_dual_backend_replication.sql:ro
      - ../../migrations/20261019_testagram_local_accounts_posts.sql:/docker-entrypoint-initdb.d/013_testagram_local_accounts_posts.sql:ro
      - ../../migrations/20261019_testagram_independent_auth.sql:/docker-entrypoint-initdb.d/014_testagram_independent_auth.sql:ro
      - ../../migrations/20261019_testagram_media_replication_producers.sql:/docker-entrypoint-initdb.d/015_testagram_media_replication_producers.sql:ro
      - ../../migrations/20261106_appwrite_identity_bridge.sql:/docker-entrypoint-initdb.d/016_appwrite_identity_bridge.sql:ro
      - ../../migrations/20261106_tv_health_postgres.sql:/docker-entrypoint-initdb.d/017_tv_health_postgres.sql:ro
      - ../../migrations/20261106_appwrite_identity_link_audit.sql:/docker-entrypoint-initdb.d/018_appwrite_identity_link_audit.sql:ro
      - ../../migrations/20261106_social_core.sql:/docker-entrypoint-initdb.d/019_social_core.sql:ro
      - ../../migrations/20261110_native_media_post_links.sql:/docker-entrypoint-initdb.d/020_native_media_post_links.sql:ro
      - ../../migrations/20261110_staff_roles.sql:/docker-entrypoint-initdb.d/021_staff_roles.sql:ro
      - ../../migrations/20261110_federation_outbox.sql:/docker-entrypoint-initdb.d/022_federation_outbox.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testagram} -d ${POSTGRES_DB:-testagram}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      data: {}
      platform:
        aliases: [federation-db]

  control-plane:
    build:
      context: ../..
      dockerfile: control-plane/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-testagram}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-testagram}?sslmode=disable
      VPS_INTERNAL_TOKEN: ${VPS_INTERNAL_TOKEN:?Set VPS_INTERNAL_TOKEN in .env}
      VPS_NODE_BOOTSTRAP_TOKEN: ${VPS_NODE_BOOTSTRAP_TOKEN:?Set VPS_NODE_BOOTSTRAP_TOKEN in .env}
      # Empty means the control plane refuses all workload scheduling.
      VPS_ALLOWED_WORKLOAD_IMAGES: ${VPS_ALLOWED_WORKLOAD_IMAGES:-}
      VPS_CONTROL_PLANE_ADDR: ":8787"
      TESTAGRAM_BASE_DOMAIN: ${TESTAGRAM_BASE_DOMAIN:-}
      TESTAGRAM_DOMAIN: ${TESTAGRAM_DOMAIN:-}
      TESTAGRAM_PUBLIC_ORIGIN_IP: ${TESTAGRAM_PUBLIC_ORIGIN_IP:-}
      TESTAGRAM_DOMAIN_TARGETS: ${TESTAGRAM_DOMAIN_TARGETS:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8787"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [data, control-plane]

  object-storage:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_SITE_REGION: ${MINIO_REGION:-us-east-1}
    volumes: [object-data:/data]
    restart: unless-stopped
    networks: [data]

  object-init:
    build:
      context: ./minio-tools
      dockerfile: Dockerfile
    depends_on:
      object-storage:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      until mc alias set local http://object-storage:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
      mc admin info local >/dev/null 2>&1; do sleep 2; done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-testagram-private-media};
      mc anonymous set none local/${MINIO_BUCKET:-testagram-private-media};
      mc mb --ignore-existing local/${PUBLIC_MEDIA_BUCKET:-testagram-public-media};
      mc anonymous set download local/${PUBLIC_MEDIA_BUCKET:-testagram-public-media};
      if [ -n "$MINIO_MEDIA_ACCESS_KEY" ] && [ -n "$MINIO_MEDIA_SECRET_KEY" ]; then
        cat > /tmp/testagram-media-policy.json <<EOF
      {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:PutObject","s3:GetObject","s3:DeleteObject"],"Resource":["arn:aws:s3:::$MINIO_BUCKET/*","arn:aws:s3:::$PUBLIC_MEDIA_BUCKET/*"]}]}
      EOF
        mc admin policy create local testagram-media-api /tmp/testagram-media-policy.json || true;
        mc admin user add local "$MINIO_MEDIA_ACCESS_KEY" "$MINIO_MEDIA_SECRET_KEY" >/dev/null 2>&1 || true;
        mc admin policy attach local testagram-media-api --user "$MINIO_MEDIA_ACCESS_KEY";
      fi;
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-testagram-private-media}
      PUBLIC_MEDIA_BUCKET: ${PUBLIC_MEDIA_BUCKET:-testagram-public-media}
      MEDIA_USER_QUOTA_BYTES: ${MEDIA_USER_QUOTA_BYTES:-2147483648}
      MINIO_MEDIA_ACCESS_KEY: ${MINIO_MEDIA_ACCESS_KEY:-}
      MINIO_MEDIA_SECRET_KEY: ${MINIO_MEDIA_SECRET_KEY:-}
    restart: "no"
    networks: [data]

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-testagram}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-testagram}?sslmode=disable
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-}
      ALGORITHM_URL: ${ALGORITHM_URL:-}
      ALGORITHM_INTERNAL_TOKEN: ${ALGORITHM_INTERNAL_TOKEN:-}
      FEDERATION_INTERNAL_URL: ${FEDERATION_INTERNAL_URL:-}
      FEDERATION_INTERNAL_TOKEN: ${FEDERATION_INTERNAL_TOKEN:-}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_SIGNING_HOST: ${MEDIA_S3_SIGNING_HOST:-}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-us-east-1}
      MEDIA_PRIVATE_BUCKET: ${MEDIA_PRIVATE_BUCKET:-testagram-private-media}
      MEDIA_PUBLIC_BUCKET: ${MEDIA_PUBLIC_BUCKET:-testagram-public-media}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://testagram.site,https://www.testagram.site}
      MINIO_MEDIA_ACCESS_KEY: ${MINIO_MEDIA_ACCESS_KEY:-}
      MINIO_MEDIA_SECRET_KEY: ${MINIO_MEDIA_SECRET_KEY:-}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://media.testagram.site}
      MINIO_SIGNING_HOST: object-storage:9000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-testagram-private-media}
      PUBLIC_MEDIA_BUCKET: ${PUBLIC_MEDIA_BUCKET:-testagram-public-media}
      MEDIA_USER_QUOTA_BYTES: ${MEDIA_USER_QUOTA_BYTES:-2147483648}
      MEDIA_MODERATION_TOKEN: ${MEDIA_MODERATION_TOKEN:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-https://media.testagram.site/testagram-public-media}
      VIRTUAL_STORAGE_ENABLED: ${VIRTUAL_STORAGE_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      object-init:
        condition: service_completed_successfully
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge, data, monitoring, platform, egress]

  admin-console:
    build:
      context: ../..
      dockerfile: admin-console/Dockerfile
    environment:
      ADMIN_ADDR: ":8090"
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-https://ops.testagram.site}
      ADMIN_SESSION_KEY: ${ADMIN_SESSION_KEY:?Set ADMIN_SESSION_KEY to 64 hex characters in .env}
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      DATABASE_URL: postgres://${POSTGRES_USER:-testagram}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-testagram}?sslmode=disable
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-https://cloud.appwrite.io/v1}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-REPLACE_WITH_APPWRITE_PROJECT_ID}
      APPWRITE_API_KEY: ${APPWRITE_API_KEY:-}
      PROMETHEUS_URL: http://prometheus:9090
      API_HEALTH_URL: http://api:8080/readyz
      GRAFANA_URL: ${GRAFANA_URL:-http://127.0.0.1:3000}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
      prometheus:
        condition: service_started
    expose: ["8090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge, monitoring]

  media-cache:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx-media-cache.conf:/etc/nginx/conf.d/default.conf:ro
      - media-cache-data:/var/cache/nginx
    depends_on:
      object-init:
        condition: service_completed_successfully
    expose: ["8081"]
    read_only: true
    tmpfs: ["/var/run", "/var/cache/nginx/client_temp", "/var/cache/nginx/proxy_temp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge, data]

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.testagram.site}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-media.testagram.site}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-ops.testagram.site}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, media-cache, control-plane, admin-console]
    restart: unless-stopped
    networks: [edge, control-plane]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    expose: ["9100"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    expose: ["9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks: [monitoring]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sh /etc/alertmanager/generate-config.sh > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager --web.listen-address=:9093
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager/generate-config.sh:/etc/alertmanager/generate-config.sh:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    expose: ["9093"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9093/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring, notifications]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-testagram-ops}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [monitoring]

networks:
  edge:
  data:
    internal: true
  monitoring:
    internal: true
  # Stable private network shared with the Data Centre service overlay.
  platform:
    name: testagram-platform
    internal: true
  # Egress-only network for services that must validate Appwrite sessions.
  egress:
    name: testagram-egress
  notifications:
  control-plane:
    internal: true

volumes:
  postgres-data:
  object-data:
  media-cache-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
  grafana-data:
