name: testagram-self-hosted
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testagram}
      POSTGRES_USER: ${POSTGRES_USER:-testagram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../migrations/001_platform.sql:/docker-entrypoint-initdb.d/001_platform.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testagram} -d ${POSTGRES_DB:-testagram}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [data]

  redis:
    image: valkey/valkey:8-alpine
    command: ["sh", "-ec", "exec valkey-server --appendonly yes --requirepass \"$$VALKEY_PASSWORD\" --maxmemory ${VALKEY_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [data]

  platform:
    build:
      context: ../..
      dockerfile: services/platform/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-testagram}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-testagram}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
      PLATFORM_INTERNAL_TOKEN: ${PLATFORM_INTERNAL_TOKEN:?Set PLATFORM_INTERNAL_TOKEN in .env}
      PLATFORM_ADDR: ":8095"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: ["8095"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8095/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [data, monitoring]

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: [object-data:/data]
    restart: unless-stopped
    networks: [data]

  object-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      object-storage:
        condition: service_started
    entrypoint: ["/bin/sh", "-ec"]
    command: >
      until mc alias set local http://object-storage:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
      mc admin info local >/dev/null 2>&1; do sleep 2; done;
      mc mb --ignore-existing local/${MINIO_BUCKET:-testagram-private-media};
      mc anonymous set none local/${MINIO_BUCKET:-testagram-private-media};
      mc mb --ignore-existing local/${PUBLIC_MEDIA_BUCKET:-testagram-public-media};
      mc anonymous set download local/${PUBLIC_MEDIA_BUCKET:-testagram-public-media};
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-testagram-private-media}
      PUBLIC_MEDIA_BUCKET: ${PUBLIC_MEDIA_BUCKET:-testagram-public-media}
    restart: "no"
    networks: [data]

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-testagram}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-testagram}?sslmode=disable
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://testagram.site,https://www.testagram.site}
    depends_on:
      postgres:
        condition: service_healthy
    expose: ["8080"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge, data, monitoring]

  media-cache:
    image: nginx:1.28-alpine
    volumes:
      - ./nginx-media-cache.conf:/etc/nginx/conf.d/default.conf:ro
      - media-cache-data:/var/cache/nginx
    depends_on:
      object-init:
        condition: service_completed_successfully
    expose: ["8081"]
    read_only: true
    tmpfs: ["/var/run", "/var/cache/nginx/client_temp", "/var/cache/nginx/proxy_temp"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [edge, data]

  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.testagram.site}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-media.testagram.site}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, media-cache]
    restart: unless-stopped
    networks: [edge]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose: ["9090"]
    restart: unless-stopped
    networks: [monitoring]

networks:
  edge:
  data:
    internal: true
  monitoring:
    internal: true

volumes:
  postgres-data:
  valkey-data:
  object-data:
  media-cache-data:
  caddy-data:
  caddy-config:
  prometheus-data:
