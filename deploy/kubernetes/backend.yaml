apiVersion: apps/v1
kind: Deployment
metadata:
  name: testagram-api
  labels:
    app.kubernetes.io/name: testagram-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: testagram-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testagram-api
    spec:
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: testagram-api
      containers:
        - name: api
          # Replace with an immutable image digest published by your release pipeline.
          image: ghcr.io/trendyzima/testagram-backend:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LISTEN_ADDR
              value: ":8080"
            - name: DB_MAX_CONNS
              value: "10"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: testagram-backend-secrets
                  key: database-url
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: testagram-backend-secrets
                  key: supabase-url
            - name: SUPABASE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: testagram-backend-secrets
                  key: supabase-publishable-key
            - name: ALLOWED_ORIGINS
              value: "https://testagram.site,https://www.testagram.site"
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: testagram-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: testagram-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: testagram-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: testagram-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: testagram-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: testagram-api
