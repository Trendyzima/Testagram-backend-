services:
  - type: web
    name: testagram-backend-fresh
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile.fresh
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: FRESH_API_ADDR
        value: ""
      - key: FRESH_API_ALLOWED_ORIGINS
        sync: false
      - key: APPWRITE_ENDPOINT
        value: https://cloud.appwrite.io/v1
      - key: APPWRITE_PROJECT_ID
        sync: false
      - key: APPWRITE_DATABASE_ID
        sync: false
      - key: APPWRITE_SERVER_API_KEY
        sync: false
      - key: IDENTITY_PREAUTH_SECRET
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: NEON_REQUIRED
        value: "true"
      - key: ONSPACE_AI_BASE_URL
        value: https://ai.onspace.ai/v1
      - key: ONSPACE_AI_API_KEY
        sync: false
      - key: FRESH_MEDIA_ENABLED
        value: "false"
      - key: FRESH_MEDIA_PRIMARY_PROVIDER
        value: r2
      - key: B2_S3_ENDPOINT
        sync: false
      - key: B2_S3_REGION
        value: us-west-004
      - key: B2_S3_BUCKET
        sync: false
      - key: B2_S3_ACCESS_KEY_ID
        sync: false
      - key: B2_S3_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_REGION
        value: auto
      - key: CLOUDFLARE_R2_BUCKET
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_MEDIA_BASE_URL
        sync: false
      - key: CLOUDFLARE_MEDIA_SIGNING_SECRET
        sync: false
      - key: FRESH_FEDERATION_INTERNAL_TOKEN
        sync: false
      - key: ALGORITHM_ENDPOINT
        sync: false
      - key: ALGORITHM_INTERNAL_TOKEN
        sync: false
      - key: FEED_RANKING_REQUIRED
        value: "false"
      - key: TESTAGRAM_STORAGE_POOL_BYTES
        value: "150000000000"
      - key: TESTAGRAM_STORAGE_PER_USER_BYTES
        value: "2147483648"
