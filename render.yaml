services:
  - type: web
    name: testagram-backend
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    # Backend's canonical public API runtime is cmd/api (Dockerfile), not
    # cmd/fresh-api (Dockerfile.fresh). Keep this service manually promoted
    # until its environment and live health/auth checks are verified.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: LISTEN_ADDR
        value: ":8080"
      - key: NEON_DATABASE_URL
        sync: false
      - key: DB_MAX_CONNS
        value: "10"
      - key: APPWRITE_ENDPOINT
        value: https://fra.cloud.appwrite.io/v1
      - key: APPWRITE_PROJECT_ID
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://testagram.site,https://www.testagram.site
      - key: ONSPACE_AI_BASE_URL
        value: https://ai.onspace.ai/v1
      - key: ONSPACE_AI_API_KEY
        sync: false
      - key: ALGORITHM_URL
        sync: false
      - key: ALGORITHM_INTERNAL_TOKEN
        sync: false
      - key: FEED_RANKING_REQUIRED
        value: "false"
      - key: FEDERATION_INTERNAL_URL
        sync: false
      - key: FEDERATION_INTERNAL_TOKEN
        sync: false
      - key: FEDERATION_PUBLIC_BASE_URL
        value: https://federation.testagram.site
      # Media remains disabled until Data Centre + CDN live acceptance passes.
      - key: FRESH_MEDIA_ENABLED
        value: "false"
      - key: DATA_CENTRE_MEDIA_API_URL
        sync: false
      - key: FRESH_DATA_CENTRE_INTERNAL_TOKEN
        sync: false
      - key: VIRTUAL_STORAGE_ENABLED
        value: "false"
      - key: MEDIA_REPLICATION_ENABLED
        value: "false"
      - key: TESTAGRAM_IDENTITY_REGISTRATION_ENABLED
        value: "false"
      - key: IDENTITY_EVIDENCE_PRIVATE_BUCKET
        value: testagram-identity-evidence-private
